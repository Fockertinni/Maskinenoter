<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>{{TITEL}} · {{FAG}} · Maskinenoter</title>
<link rel="stylesheet" href="../../hav.css"><script>document.documentElement.dataset.theme="dark"</script>
<!-- Bygget af noter/kilde/byg.py fra afsnittet "# Kort" i kildefilen. Ret i kildefilen, ikke her. -->
<style>
:root {
  --bg: #f5f5f7; --surface: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --line: #d9d9de; --hover: #ececf0;
  --accent: {{FARVE}}; --soft: color-mix(in srgb, var(--accent) 9%, var(--surface));
  --ok: #1f8a48; --ok-bg: #e6f4ea; --bad: #c4362c; --bad-bg: #fbe9e7; --key: #fff6d6; --key-line: #e7c44a;
  --bar: rgba(245,245,247,.82); --focus: #0a66d8;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c0d10; --surface: #17191d; --fg: #f5f5f7; --muted: #a1a1a8; --line: #2c2e34; --hover: #1f2227;
  --accent: {{FARVE_M}}; --ok: #5cc884; --ok-bg: #15301f; --bad: #ff7b6e; --bad-bg: #3a1a17; --key: #2e2913; --key-line: #8a7424;
  --bar: rgba(12,13,16,.78); --focus: #5ea2ff; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0c0d10; --surface: #17191d; --fg: #f5f5f7; --muted: #a1a1a8; --line: #2c2e34; --hover: #1f2227;
  --accent: {{FARVE_M}}; --ok: #5cc884; --ok-bg: #15301f; --bad: #ff7b6e; --bad-bg: #3a1a17; --key: #2e2913; --key-line: #8a7424;
  --bar: rgba(12,13,16,.78); --focus: #5ea2ff; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.bar { position: sticky; top: 0; z-index: 20; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
.bar .in { max-width: 820px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left, 0px)); min-height: 52px; display: flex; align-items: center; gap: 12px; }
.bar .tilbage { text-decoration: none; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bar .tilbage:hover { text-decoration: underline; }
.bar .taeller { margin-left: auto; font: 600 .9rem var(--sans); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.fremdrift { height: 3px; background: var(--line); }
.fremdrift div { height: 100%; width: 0; background: var(--accent); transition: width .25s; }
main { max-width: 820px; margin: 0 auto; padding: clamp(1.6rem, 4vw, 2.6rem) max(16px, env(safe-area-inset-left, 0px)) 6rem; }
.kicker { margin: 0; font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { margin: .3rem 0 0; font-size: clamp(2rem, 5vw, 2.9rem); line-height: 1.08; letter-spacing: -.03em; text-wrap: balance; }
.intro { margin: .7rem 0 0; font-size: 1.08rem; color: var(--muted); max-width: 60ch; }

.vaelg { margin: 1.6rem 0 1rem; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.vaelg select { flex: 1 1 240px; min-width: 0; font: 600 .98rem var(--sans); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: .6rem .8rem; }
.knap { font: 600 .95rem var(--sans); padding: .65rem 1.05rem; border-radius: 11px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
.knap.stille { background: var(--hover); color: var(--fg); }
.knap:disabled { opacity: .4; cursor: default; }
.knap.lille { padding: .5rem .8rem; font-size: .88rem; }
.knap[aria-pressed="true"] { background: var(--accent); color: #fff; }

.kort { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: clamp(1.2rem, 3.5vw, 2rem); }
.kort .nr { font-size: .78rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.kort .q { margin: .4rem 0 0; font-size: clamp(1.18rem, 2.6vw, 1.42rem); line-height: 1.38; font-weight: 650; letter-spacing: -.01em; text-wrap: pretty; }
.kort .handl { margin-top: 1.2rem; display: flex; flex-wrap: wrap; gap: 8px; }
.kort .vis { width: 100%; padding: .95rem; font-size: 1.02rem; }
.svar { margin-top: 1.4rem; padding-top: 1.2rem; border-top: 1px solid var(--line); }
.svar > :first-child { margin-top: 0; }
.svar p, .svar li { max-width: 68ch; }
.svar ul, .svar ol { padding-left: 1.3rem; }
.svar li { margin: .25rem 0; }
.svar li::marker { color: var(--muted); }
.svar strong { font-weight: 650; }
.svar img { display: block; max-width: 100%; height: auto; border-radius: 12px; margin: 1rem 0; }
.svar img.lys { background: #fff; padding: 8px; }
.tbl { overflow-x: auto; margin: 1rem 0; border-radius: 14px; border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: .93rem; line-height: 1.45; }
th, td { text-align: left; vertical-align: top; padding: .55rem .75rem; border-bottom: 1px solid var(--line); }
th { font-weight: 650; background: var(--soft); }
tr:last-child td { border-bottom: 0; }
pre.formel { font: .9rem/1.6 var(--mono); background: var(--soft); border-left: 3px solid var(--accent); border-radius: 0 12px 12px 0; padding: .9rem 1.1rem; margin: 1rem 0; overflow-x: auto; white-space: pre; }
blockquote { margin: 1rem 0; padding: .8rem 1.1rem; background: var(--key); border-left: 3px solid var(--key-line); border-radius: 0 12px 12px 0; }
blockquote p { margin: .3rem 0; }
blockquote strong:first-child { display: block; font-size: .76rem; letter-spacing: .07em; text-transform: uppercase; }
.vurder { margin-top: 1.4rem; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.vurder .knap { padding: .8rem; }
.vurder .sad { background: var(--ok-bg); color: var(--fg); border: 1px solid var(--ok); }
.vurder .oev { background: var(--bad-bg); color: var(--fg); border: 1px solid var(--bad); }
.figurer { margin-top: 1.2rem; }
.figurer img { display: block; width: 100%; height: auto; border-radius: 12px; background: #fff; margin: 0 0 10px; border: 1px solid var(--line); }
.figurer p { margin: .2rem 0 .6rem; font-size: .88rem; color: var(--muted); }

.nav { margin-top: 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.nav .knap { padding: .85rem; }
.tip { margin: .9rem 0 0; font-size: .85rem; color: var(--muted); text-align: center; }

.oversigt { margin-top: 2.4rem; }
.oversigt h2 { font-size: 1.1rem; margin: 0 0 .3rem; letter-spacing: -.01em; }
.oversigt .forkl { margin: 0 0 .8rem; font-size: .9rem; color: var(--muted); }
.oversigt .gruppe { display: flex; align-items: baseline; gap: 10px; padding: .45rem 0; border-bottom: 1px solid var(--line); }
.oversigt .gnavn { flex: 0 0 auto; width: 13.5rem; max-width: 45%; font-size: .9rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oversigt .prikker { display: flex; flex-wrap: wrap; gap: 5px; }
.oversigt .prik { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: 600 .68rem var(--sans); cursor: pointer; padding: 0; }
.oversigt .prik.sad { background: var(--ok-bg); border-color: var(--ok); color: var(--fg); }
.oversigt .prik.oev { background: var(--bad-bg); border-color: var(--bad); color: var(--fg); }
.oversigt .prik.nu { outline: 2px solid var(--accent); outline-offset: 1px; }
.status { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 1rem; font-size: .9rem; color: var(--muted); }
@media (max-width: 560px) {
  body { font-size: 16px; }
  th, td { padding: .5rem .6rem; }
  pre.formel { font-size: .78rem; padding: .8rem .9rem; }
  h1 { hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word; }
  .kort .q { hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word; }
  .oversigt .gruppe { flex-direction: column; gap: 4px; }
  .oversigt .gnavn { width: auto; max-width: 100%; }
}
</style>
</head>
<body>
<header class="bar"><div class="in">
  <a class="tilbage" id="tilbage" href="../../index.html#{{FAGFRA}}">‹ {{FAG}}</a>
  <span class="taeller" id="taeller"></span>
</div><div class="fremdrift"><div id="fremdrift"></div></div></header>
<main>
  <p class="kicker">{{FAG}}</p>
  <h1>{{TITEL}}</h1>
  <p class="intro">{{INTRO}}</p>

  <div class="vaelg">
    <select id="gruppe" aria-label="Vælg spørgsmål"></select>
    <button class="knap stille lille" id="kunOev" aria-pressed="false">Kun dem jeg skal øve</button>
  </div>

  <article class="kort" id="kort" aria-live="polite">
    <div class="nr" id="nr"></div>
    <p class="q" id="q"></p>
    <div class="handl">
      <button class="knap vis" id="vis">Vis svar</button>
      <button class="knap stille lille" id="figKnap" aria-expanded="false">Vis opgavens figurer</button>
    </div>
    <div class="figurer" id="figurer" hidden></div>
    <div class="svar" id="svar" hidden></div>
    <div class="vurder" id="vurder" hidden>
      <button class="knap sad" id="sad">Det sad ✓</button>
      <button class="knap oev" id="oev">Øv igen</button>
    </div>
  </article>

  <div class="nav">
    <button class="knap stille" id="forrige">‹ Forrige</button>
    <button class="knap stille" id="naeste">Næste ›</button>
  </div>
  <p class="tip">Tip: mellemrum viser svaret, pilene skifter spørgsmål.</p>

  <section class="oversigt">
    <h2>Oversigt</h2>
    <p class="forkl">Tryk på et nummer for at hoppe dertil. Grøn sad, rød skal øves.</p>
    <div id="oversigt"></div>
    <div class="status"><span id="statustekst"></span><button class="knap stille lille" id="nulstil">Nulstil markeringer</button></div>
  </section>
</main>
<script>
const GRUPPER = {{KORT}};
const NOGLE = "{{NOGLE}}";
const q = new URLSearchParams(location.search);
const fra = q.get("fra");
if (fra && /^[a-z0-9-]+$/.test(fra)) {
  const a = document.getElementById("tilbage");
  a.href = "../../index.html#" + fra;
  a.textContent = "‹ " + (q.get("navn") || "Tilbage");
}
const $ = id => document.getElementById(id);
const ALLE = GRUPPER.flatMap((g, gi) => g.kort.map(k => ({ ...k, gi })));
let gemt = { vurd: {}, pos: 0 };
try { gemt = Object.assign(gemt, JSON.parse(localStorage.getItem(NOGLE) || "{}")); } catch (e) {}
const gem = () => { try { localStorage.setItem(NOGLE, JSON.stringify(gemt)); } catch (e) {} };
let kunOev = false;
const liste = () => kunOev ? ALLE.map((k, i) => i).filter(i => gemt.vurd[ALLE[i].nr] === "oev") : ALLE.map((k, i) => i);
let pos = Math.min(Math.max(0, +gemt.pos || 0), ALLE.length - 1);
const fraHash = decodeURIComponent(location.hash.slice(1));
if (fraHash) { const i = ALLE.findIndex(k => k.nr === fraHash); if (i >= 0) pos = i; }

$("gruppe").innerHTML = GRUPPER.map((g, gi) => `<option value="${gi}">Spørgsmål ${g.nr} · ${g.titel} (${g.kort.length})</option>`).join("");
$("gruppe").addEventListener("change", e => { const gi = +e.target.value; kunOev = false; opdKunOev(); gaaTil(ALLE.findIndex(k => k.gi === gi)); });

function tegn() {
  const k = ALLE[pos], g = GRUPPER[k.gi], l = liste(), plads = l.indexOf(pos);
  $("nr").textContent = `Spørgsmål ${g.nr} · ${g.titel} · ${k.nr}`;
  $("q").innerHTML = k.q;
  $("svar").innerHTML = k.a; $("svar").hidden = true; $("vurder").hidden = true;
  $("vis").hidden = false; $("vis").textContent = "Vis svar";
  $("svar").querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.before(w); w.append(t); });
  $("figurer").hidden = true; $("figKnap").setAttribute("aria-expanded", "false"); $("figKnap").textContent = "Vis opgavens figurer";
  $("figKnap").hidden = !g.sider.length;
  $("gruppe").value = k.gi;
  $("taeller").textContent = kunOev ? `${plads + 1} / ${l.length} at øve` : `${pos + 1} / ${ALLE.length}`;
  $("fremdrift").style.width = ((kunOev ? (plads + 1) / l.length : (pos + 1) / ALLE.length) * 100) + "%";
  $("forrige").disabled = plads <= 0; $("naeste").disabled = plads >= l.length - 1;
  gemt.pos = pos; gem();
  history.replaceState(null, "", "#" + encodeURIComponent(k.nr));
  tegnOversigt();
}
function visSvar() {
  if (!$("svar").hidden) return;
  $("svar").hidden = false; $("vurder").hidden = false; $("vis").hidden = true;
}
function gaaTil(i) { if (i < 0 || i >= ALLE.length) return; pos = i; tegn(); window.scrollTo({ top: $("kort").offsetTop - 120, behavior: "smooth" }); }
function flyt(d) { const l = liste(), p = l.indexOf(pos); const ny = l[p + d]; if (ny != null) gaaTil(ny); }
function vurder(v) {
  gemt.vurd[ALLE[pos].nr] = v; gem();
  const l = liste(), p = l.indexOf(pos);
  if (kunOev && v === "sad") { const rest = liste(); if (!rest.length) { kunOev = false; opdKunOev(); tegn(); return; } gaaTil(rest.find(i => i > pos) ?? rest[0]); return; }
  if (p < l.length - 1) flyt(1); else tegn();
}
function tegnOversigt() {
  $("oversigt").innerHTML = GRUPPER.map((g, gi) => `<div class="gruppe"><span class="gnavn">${g.nr} · ${g.titel}</span><span class="prikker">${
    ALLE.map((k, i) => k.gi === gi ? `<button class="prik ${gemt.vurd[k.nr] || ""} ${i === pos ? "nu" : ""}" data-i="${i}" aria-label="Spørgsmål ${k.nr}">${k.nr.split(".")[1]}</button>` : "").join("")
  }</span></div>`).join("");
  const s = Object.values(gemt.vurd), sad = s.filter(v => v === "sad").length, oev = s.filter(v => v === "oev").length;
  $("statustekst").textContent = `${sad} sad · ${oev} skal øves · ${ALLE.length - sad - oev} ikke vurderet`;
  $("kunOev").disabled = !oev && !kunOev;
}
function opdKunOev() { $("kunOev").setAttribute("aria-pressed", kunOev); }
$("oversigt").addEventListener("click", e => { const b = e.target.closest(".prik"); if (b) { kunOev = false; opdKunOev(); gaaTil(+b.dataset.i); } });
$("vis").addEventListener("click", visSvar);
$("sad").addEventListener("click", () => vurder("sad"));
$("oev").addEventListener("click", () => vurder("oev"));
$("forrige").addEventListener("click", () => flyt(-1));
$("naeste").addEventListener("click", () => flyt(1));
$("kunOev").addEventListener("click", () => {
  kunOev = !kunOev; opdKunOev();
  if (kunOev) { const l = liste(); if (!l.length) { kunOev = false; opdKunOev(); return; } if (!l.includes(pos)) pos = l[0]; }
  tegn();
});
$("nulstil").addEventListener("click", () => { gemt.vurd = {}; gem(); kunOev = false; opdKunOev(); tegn(); });
$("figKnap").addEventListener("click", () => {
  const f = $("figurer"), g = GRUPPER[ALLE[pos].gi], aaben = f.hidden;
  if (aaben) f.innerHTML = g.sider.map(s => `<a href="${g.mappe}/s-${String(s).padStart(2, "0")}.jpg" target="_blank" rel="noopener"><img loading="lazy" src="${g.mappe}/s-${String(s).padStart(2, "0")}.jpg" alt="Side ${s} i prøvespørgsmålene"></a>`).join("") + `<p>Siderne fra prøvespørgsmålene med figurer til spørgsmål ${g.nr}. Tryk på en side for at se den i fuld størrelse.</p>`;
  f.hidden = !aaben; $("figKnap").setAttribute("aria-expanded", aaben); $("figKnap").textContent = aaben ? "Skjul figurer" : "Vis opgavens figurer";
});
document.addEventListener("keydown", e => {
  if (e.target.closest("select, input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " " || e.key === "Enter") { if ($("svar").hidden && !e.target.closest("button")) { e.preventDefault(); visSvar(); } }
  else if (e.key === "ArrowRight") flyt(1);
  else if (e.key === "ArrowLeft") flyt(-1);
});
tegn();
</script>
</body>
</html>
