<script>
const QUIZ = [{"valg": ["Retten til at drive virksomhed", "At kunderne kræver dokumentation", "At ESG-dokumentation giver adgang til kapital og bedre lånevilkår", "At virksomheden må optage lån uden sikkerhed"], "rigtig": 2, "q": "Hvad dækker \"license to finance\"?", "f": "License to sell er kunderne, license to operate er lovgivningen, license to finance er banker og investorer.", "emne": "Bæredygtighed, CSR og ESG"}, {"q": "Eksport til England giver 150 kr./stk. VE er 80 kr. og transport 25 kr. Hvad er DIFB pr. stk.?", "tal": 45.0, "tol": 0.1, "enhed": "kr.", "losning": "150 − 80 − 25 = 45 kr. pr. stk.", "f": "Transporten er en variabel omkostning, der kun gælder eksportsalget.", "emne": "Kapacitetsstyring"}, {"valg": ["Budgettet med sidste års budget", "Regnskabet med budgettet, med afvigelser i kr. og %", "Resultatbudgettet med likviditetsbudgettet", "Balancen med resultatopgørelsen"], "rigtig": 1, "q": "Hvad skal sammenlignes ved budgetkontrol?", "f": "Afvigelserne og deres årsager bruges til at forbedre de næste planer.", "emne": "Budgettering"}, {"valg": ["Bruge egne regneark med løsninger som opslag", "Søge lokalt efter filer på din computer", "Kopiere et færdigt regneark ind i besvarelsen", "Tage et billede af en håndtegnet kurve med mobilen til PDF'en"], "rigtig": 2, "q": "Hvad må du <strong>ikke<\/strong> til eksamen?", "f": "Egne løsninger må bruges som opslag, men de må ikke kopieres ind. AI og søgemaskiner er heller ikke tilladt.", "emne": "Eksamen, Excel og formelsamling"}, {"valg": ["mængdetilpasser. Prisen er givet af markedet", "pristilpasser. Den sætter selv prisen", "monopolist", "både pris- og mængdetilpasser"], "rigtig": 0, "q": "En virksomhed på et marked med fuldkommen konkurrence er …", "f": "Ved fuldkommen konkurrence er afsætningskurven vandret. Virksomheden kan kun vælge, hvor meget den vil sælge til markedsprisen.", "emne": "Afsætning og elasticitet"}, {"valg": ["Serielån", "Annuitetslån", "Stående lån", "Kassekredit"], "rigtig": 1, "q": "Hvilken låntype har konstant ydelse?", "f": "Annuitetslånets ydelse er fast. Afdraget stiger, mens renten falder.", "emne": "Finansiering"}, {"q": "Du skal have 5.000.000 kr. udbetalt, stiftelsesomkostningerne er 25.000 kr., og kursen er 97. Hvad bliver hovedstolen? (hele kr.)", "tal": 5180412.0, "tol": 2.0, "enhed": "kr.", "losning": "H = (5.000.000 + 25.000) / 0,97 = 5.180.412 kr.", "f": "Kurstabet og omkostningerne gør, at du skylder mere, end du får.", "emne": "Finansiering"}, {"valg": ["Serielån", "Annuitetslån", "Stående lån", "De er ens"], "rigtig": 2, "q": "Hvilken låntype er typisk bedst for likviditeten i lånets løbetid?", "f": "Der betales kun renter undervejs, men hele hovedstolen skal betales ved udløb, og lånet er ofte dyrest.", "emne": "Finansiering"}, {"q": "Et serielån på 700.000 kr. over 7 år med 5 % rente. Hvad er ydelsen i år 1?", "tal": 135000.0, "tol": 1.0, "enhed": "kr.", "losning": "Afdrag 700.000/7 = 100.000. Rente 5 % af 700.000 = 35.000. Ydelse 135.000 kr.", "f": "I år 2 er renten kun 5 % af 600.000, så ydelsen falder til 130.000.", "emne": "Finansiering"}, {"valg": ["De er substitutter", "De er komplementære", "Blæk er en luksusvare", "Efterspørgslen er uelastisk"], "rigtig": 1, "q": "Krydspriselasticiteten mellem printer og blæk er negativ. Hvad betyder det?", "f": "Stiger printerprisen, sælges færre printere og dermed mindre blæk. Negativt fortegn betyder komplementære varer.", "emne": "Afsætning og elasticitet"}, {"valg": ["En omkostning, der allerede er afholdt", "Den fortjeneste, man giver afkald på ved at vælge et alternativ fra", "En variabel omkostning, der stiger i spring", "Omkostningen ved at ofre et aktiv (scrapværdi)"], "rigtig": 1, "q": "Hvad er en offeromkostning?", "f": "Den første mulighed er sunk cost. Offeromkostningen er værdien af det bedste fravalgte alternativ.", "emne": "Indtægter og omkostninger"}, {"valg": ["Den rente, der står i låneaftalen", "Den reelle årlige omkostning, når kurstab og gebyrer er medregnet", "Renten efter skat", "Renten fratrukket inflation"], "rigtig": 1, "q": "Hvad er den effektive rente?", "f": "Den findes som den interne rente af lånets betalingsrække: +provenu i år 0 og −ydelser derefter.", "emne": "Finansiering"}, {"q": "Anlæg X: KO = 1 mio. kr., VE = 755. Anlæg Y: KO = 2 mio. kr., VE = 455. Ved hvor mange stk. er de lige dyre? (Afrund til hele stk.)", "tal": 3333.0, "tol": 1.0, "enhed": "stk.", "losning": "x = (2.000.000 − 1.000.000) / (755 − 455) = 1.000.000/300 = 3.333 stk.", "f": "Over skæringspunktet vinder anlægget med lav VE, under vinder det med lav KO.", "emne": "Indhyllingskurver"}, {"valg": ["Alle trin, der ikke kom med", "De trin, der ikke kom med, og som har positiv DIFB", "Kun det første trin, der ikke kom med", "Trin med negativ DIFB"], "rigtig": 1, "q": "Hvilke trin tæller med i det tabte DB pga. knaphed?", "f": "Et trin med negativ DIFB ville man ikke tage med, selv med ubegrænset kapacitet, så det er ikke \"tabt\".", "emne": "Kapacitetsstyring"}, {"q": "Overtidstillægget er 400 kr./t. Et trin har DIFB pr. time = 480. Det bruger 400 timer. Hvad er merindtjeningen ved at køre overarbejde?", "tal": 32000.0, "tol": 1.0, "enhed": "kr.", "losning": "(480 − 400) · 400 = 32.000 kr.", "f": "Kun forskellen mellem DIFB pr. time og tillægget er gevinst.", "emne": "Kapacitetsstyring"}, {"valg": ["Fordi de er fradragsberettigede", "Fordi de ikke er en betaling. Pengene gik ud, da aktivet blev købt", "Fordi de står under finansieringen", "Det gør de, som plus"], "rigtig": 1, "q": "Hvorfor indgår afskrivninger ikke i likviditetsbudgettet?", "f": "Derfor starter den indirekte metode fra IB, som er før afskrivninger.", "emne": "Budgettering"}, {"valg": ["Den stiger", "Den falder", "Den er uændret", "Det kan ikke afgøres"], "rigtig": 1, "q": "Priselasticiteten er −0,4. Prisen sættes ned. Hvad sker der med omsætningen?", "f": "|e| &lt; 1 er uelastisk. Afsætningen stiger procentvis mindre, end prisen falder, så omsætningen falder.", "emne": "Afsætning og elasticitet"}, {"q": "p(x) = 1.850 − x/120 og VE = 430. Hvad er den optimale afsætning uden kapacitetsgrænse?", "tal": 85200.0, "tol": 1.0, "enhed": "stk.", "losning": "DOMS = 1.850 − 2x/120 = 430 → x = 1.420 · 60 = 85.200 stk.", "f": "Husk at DOMS har dobbelt hældning: b = 1/120, så 2b = 1/60.", "emne": "Pris- og aktivitetsoptimering"}, {"valg": ["Green", "Governance", "Growth", "Global"], "rigtig": 1, "q": "Hvad står G for i ESG?", "f": "Governance er ledelse: bestyrelse, etik, antikorruption, risikostyring og compliance.", "emne": "Bæredygtighed, CSR og ESG"}, {"valg": ["Husleje", "Funktionærløn", "Afskrivning på en maskine", "Råvarer"], "rigtig": 2, "q": "Hvilken af disse er en beregnet kapacitetsomkostning?", "f": "Beregnede KO er aktivets kostpris fordelt over levetiden. Husleje og funktionærløn er kontante KO, råvarer er variable.", "emne": "Indtægter og omkostninger"}, {"valg": ["Den kan ikke", "Gennem store kunder, banker og investorer, der kræver data fra underleverandører", "Gennem højere selskabsskat", "Kun hvis den er børsnoteret"], "rigtig": 1, "q": "Hvordan kan en mindre virksomhed blive påvirket af CSRD, selvom den ikke selv er omfattet?", "f": "De store virksomheder skal rapportere for hele værdikæden og efterspørger derfor data fra deres leverandører.", "emne": "Bæredygtighed, CSR og ESG"}, {"valg": ["<code>NUTIDSVÆRDI<\/code>, uden år 0", "<code>IA<\/code>, med år 0", "<code>IA<\/code>, uden år 0", "<code>YDELSE<\/code>, med år 0"], "rigtig": 1, "q": "Hvilken Excel-funktion bruger du til intern rente, og skal år 0 med i området?", "f": "<code>IA<\/code> skal have hele betalingsrækken inkl. investeringen i år 0. Det er <code>NUTIDSVÆRDI<\/code>, der skal have området <em>uden<\/em> år 0.", "emne": "Eksamen, Excel og formelsamling"}, {"valg": ["Likvider −100 og maskiner −100", "Maskiner −100 og egenkapital −100 (via resultatet)", "Kun resultatopgørelsen, ikke balancen", "Maskiner −100 og kreditorer +100"], "rigtig": 1, "q": "Hvad påvirker en afskrivning på 100 kr.?", "f": "Afskrivningen er en omkostning uden betaling. Aktivets værdi falder, og resultatet (og dermed egenkapitalen) falder lige så meget.", "emne": "Virksomheden og årsregnskabet"}, {"valg": ["A", "B", "C", "Kun D"], "rigtig": 2, "q": "Fra hvilken regnskabsklasse kræves der en pengestrømsopgørelse?", "f": "Pengestrømsopgørelse og udvidet ledelsesberetning kræves i klasse C og D.", "emne": "Virksomheden og årsregnskabet"}, {"q": "Indkomsten stiger 4 %, og indkomstelasticiteten er 1,5. Hvor mange procent stiger afsætningen?", "tal": 6.0, "tol": 0.05, "enhed": "%", "losning": "1,5 · 4 % = 6 %.", "f": "e_i &gt; 1 betyder, at afsætningen vokser hurtigere end indkomsten (en luksusvare).", "emne": "Afsætning og elasticitet"}, {"q": "En maskine koster 500.000 kr., har levetid 4 år og scrapværdi 120.000 kr. Hvad er den lineære afskrivning pr. år?", "tal": 95000.0, "tol": 1.0, "enhed": "kr.", "losning": "(500.000 − 120.000) / 4 = 95.000 kr.", "f": "Kun det beløb, der faktisk tabes over levetiden (anskaffelse minus scrap), fordeles.", "emne": "Indtægter og omkostninger"}, {"q": "Et annuitetslån har hovedstol 1.000.000 kr., rente 5 % og løbetid 10 år. Hvad er den årlige ydelse? (hele kr.)", "tal": 129505.0, "tol": 2.0, "enhed": "kr.", "losning": "Ydelse = 1.000.000 · 0,05 / (1 − 1,05⁻¹⁰) = 1.000.000 · 0,129505 = 129.505 kr.", "f": "I Excel: <code>=YDELSE(5%; 10; -1000000)<\/code>.", "emne": "Finansiering"}, {"valg": ["Fra (0, 0) med hældning = VE, fordi den gamle anskaffelse er sunk cost", "Med KO = den oprindelige anskaffelsespris", "Med KO = den bogførte værdi", "Det skal ikke indtegnes"], "rigtig": 0, "q": "Et gammelt anlæg er fuldt betalt. Hvordan indtegnes det?", "f": "Kun omkostninger, der afhænger af valget, skal med.", "emne": "Indhyllingskurver"}, {"valg": ["Prøv dig frem med forskellige tal", "Data → What-if-analyse → Målsøgning", "<code>=IA()<\/code> på besparelsen", "Problemløser med maks. DB"], "rigtig": 1, "q": "Hvordan finder du hurtigst den.", "emne": "Virksomheden og årsregnskabet"}, {"valg": ["Hvor prisen er højest", "Hvor afsætningen er størst", "Hvor DOMS = DOMK (monopolpunktet)", "Hvor DB pr. stk. er størst"], "rigtig": 2, "q": "Hvor ligger optimum ved ufuldkommen konkurrence og proportionale omkostninger?", "f": "Så længe DOMS &gt; DOMK, giver en ekstra enhed mere i omsætning, end den koster. Optimum er, hvor de to er lige store.", "emne": "Pris- og aktivitetsoptimering"}, {"valg": ["Skifter helt over til det næstbilligste anlæg", "Fylder det billigste op og lægger det næste anlæg i forlængelse", "Fordeler mængden ligeligt", "Køber endnu et af det dyreste anlæg"], "rigtig": 1, "q": "Kapaciteten på det billigste anlæg (laveste VE) er brugt op. Hvad gør man?", "f": "Kurven fortsætter fra det punkt, hvor første anlæg er fuldt, med det næste anlægs KO og VE.", "emne": "Indhyllingskurver"}, {"valg": ["Den passive budgetfase", "Den aktive budgetfase", "Budgetkontrol", "Den strategiske fase"], "rigtig": 0, "q": "Virksomheden justerer sidste års tal for kendte prisstigninger, men vurderer ingen nye tiltag. Hvilken budgetfase er det?", "f": "Ingen nye handlingsalternativer = passiv fase. Den aktive fase vurderer nye alternativer med alternativkalkuler.", "emne": "Budgettering"}, {"q": "Omsætningen var 6.400 (1.000 kr.). Priserne stiger 8 %, og mængden stiger 5 %. Hvad er den budgetterede omsætning? (1.000 kr., afrund til hele tal)", "tal": 7258.0, "tol": 1.0, "enhed": "1.000 kr.", "losning": "6.400 · 1,08 · 1,05 = 7.257,6 ≈ 7.258.", "f": "Pris og mængde ganges på hver for sig. At lægge procenterne sammen (13 %) giver en lille fejl.", "emne": "Budgettering"}, {"q": "Ved 9.000 stk. (A: KO 0/VE 10/kap. 4.000, B: 10.000/6/5.000, C: 20.000/3/5.000), hvad er de laveste totale omkostninger?", "tal": 67000.0, "tol": 1.0, "enhed": "kr.", "losning": "2 × C: 2 · 20.000 + 3 · 9.000 = 67.000 kr. (C + B = 69.000, C + A = 75.000.)", "f": "Det kan betale sig at købe en ekstra C, fordi den lave VE hurtigt tjener den ekstra KO hjem.", "emne": "Indhyllingskurver"}, {"q": "Et trin giver DIFB = 60.000 kr. og bruger 150 ekstra maskintimer. Hvad er DIFB pr. time?", "tal": 400.0, "tol": 0.5, "enhed": "kr./t", "losning": "60.000 / 150 = 400 kr. pr. time.", "f": "Det er tallet, der sammenlignes på tværs af produkter og trin.", "emne": "Kapacitetsstyring"}, {"valg": ["Kurven for det anlæg med lavest VE", "Den nederste kant af alle totalomkostningskurver, dvs. den billigste løsning ved hver mængde", "Summen af alle anlægs totalomkostninger", "Kurven for det anlæg med lavest KO"], "rigtig": 1, "q": "Hvad er indhyllingskurven?", "f": "For hver mængde aflæser man den laveste totalomkostning, uanset hvilket anlæg eller hvilken kombination der giver den.", "emne": "Indhyllingskurver"}, {"q": "Konkurrenten sænker prisen fra 9.000 til 8.500 kr., og e_kryds = 1,8. Hvor mange procent falder din afsætning? (Afrund til hele procent.)", "tal": 10.0, "tol": 0.5, "enhed": "%", "losning": "ΔP/P = −500/9.000 = −5,56 %. Afsætning: 1,8 · 5,56 % = 10,0 %.", "f": "Positivt e_kryds: varerne er substitutter, så konkurrentens prisfald trækker kunder fra dig.", "emne": "Afsætning og elasticitet"}, {"valg": ["DB pr. stk.", "DIFB pr. maskintime", "Omsætning pr. produkt", "Laveste VE"], "rigtig": 1, "q": "Maskintimerne er knappe. Hvad prioriterer du efter?", "f": "Det er timerne, der begrænser, så hver time skal bruges der, hvor den giver mest DB.", "emne": "Kapacitetsstyring"}, {"valg": ["Fordi censor kræver det", "Så følsomhedsanalyser og målsøgning kan laves ved at ændre én celle", "Fordi Excel ellers regner forkert", "Så arket fylder mindre"], "rigtig": 1, "q": "Hvorfor skal alle forudsætninger stå i ét inputområde i Excel?", "f": "Står tallene direkte i formlerne, skal du rette mange steder for hver følsomhedsberegning, og målsøgning virker ikke.", "emne": "Eksamen, Excel og formelsamling"}, {"q": "Samme maskine (500.000 kr., scrap 120.000 kr., 4 år) afskrives med saldometoden. Hvad er saldoprocenten p i %? (Afrund til hele procent.)", "tal": 30.0, "tol": 0.6, "enhed": "%", "losning": "p = 1 − (120.000/500.000)^(1/4) = 1 − 0,24^0,25 = 1 − 0,700 = 0,30 → 30 %.", "f": "Med p = 30 % falder saldoen 500 → 350 → 245 → 171,5 → 120 (1.000 kr.).", "emne": "Indtægter og omkostninger"}, {"q": "Kassekredit maks. 2.000, likviditetsreserve ultimo 397 og likvid beholdning ultimo 40. Hvad er kassekreditten (trækket) ultimo?", "tal": 1643.0, "tol": 1.0, "enhed": "1.000 kr.", "losning": "2.000 − 397 + 40 = 1.643.", "f": "Reserven er det, der er tilbage på kreditten plus kontanterne. Beholder vi 40 i kassen, skal de også trækkes på kreditten.", "emne": "Budgettering"}, {"valg": ["Med det samme, når det giver underskud", "Kun hvis man derved kan spare reversible KO på mindst 400.000 kr.", "Når DB pr. stk. er lavere end for de andre produkter", "Aldrig"], "rigtig": 1, "q": "Fordelingskalkulationen viser underskud på et produkt med DB = 400.000 kr. Hvornår bør det nedlægges?", "f": "KO forsvinder sjældent med produktet. Nedlægges det alligevel, mister man 400.000 kr. i DB, og de andre produkter skal bære de samme KO (dødsspiralen).", "emne": "Pris- og aktivitetsoptimering"}, {"valg": ["Kun C's DB", "C's DB plus DB fra de 4 D'er, der følger med", "C's DB minus D's DB", "Kun det samlede DB for D"], "rigtig": 1, "q": "Produkt C sælges sammen med 4 stk. af produkt D. Hvad skal med, når C's pris optimeres?", "f": "Komplementære varer: ser man på C alene, vælger man en forkert (for høj) pris.", "emne": "Pris- og aktivitetsoptimering"}, {"q": "Nominel rente 4 %, inflation 2 %. Hvad er den reale rente i %? (2 decimaler)", "tal": 1.96, "tol": 0.01, "enhed": "%", "losning": "i_r = (0,04 − 0,02)/1,02 = 0,0196 = 1,96 %.", "f": "Tommelfingerreglen 4 − 2 = 2 % er tæt på, men den præcise formel dividerer med (1 + q).", "emne": "Investering og TCO"}, {"valg": ["Den reale", "Den nominelle", "Den interne rente", "Lånerenten"], "rigtig": 0, "q": "Hvilken kalkulationsrente bruger du, når alle beløb står i dagens virker det likviditeten?", "f": "Mere gæld til andre = plus. Det er driftsgæld, så det står under driften.", "emne": "Budgettering"}, {"q": "p(x) = 755 − x/10 og VE = 250. Hvad er monopolprisen p*?", "tal": 502.5, "tol": 0.5, "enhed": "kr.", "losning": "p* = (a + VE)/2 = (755 + 250)/2 = 502,5 kr. (x* = 2.525 stk.)", "f": "Genvejen p* = (a + VE)/2 gælder for lineær afsætning og proportionale omkostninger.", "emne": "Pris- og aktivitetsoptimering"}, {"q": "En varmeveksler sparer 7.500 Nm³ gas om året til 5,50 kr./Nm³. Hvad er den årlige besparelse?", "tal": 41250.0, "tol": 1.0, "enhed": "kr.", "losning": "7.500 · 5,50 = 41.250 kr./år.", "f": "Den årlige besparelse er nettoindbetalingen i betalingsrækken.", "emne": "Investering og TCO"}, {"valg": ["Konstant", "Faldende", "Stigende", "Først stigende, så faldende"], "rigtig": 2, "q": "Hvordan forløber DOMK ved progressive variable omkostninger, når mængden stiger?", "f": "Progressive omkostninger skyldes fx overarbejde, fejl og pladsmangel. Hver ekstra enhed bliver dyrere.", "emne": "Indtægter og omkostninger"}, {"valg": ["People, Planet, Profit", "Resultat, likviditet, balance", "Environmental, Social, Governance", "Strategisk, taktisk, operativt"], "rigtig": 0, "q": "Hvad er den tredobbelte bundlinje?", "f": "Den tredobbelte bundlinje måler social, miljømæssig og økonomisk værdi.", "emne": "Bæredygtighed, CSR og ESG"}, {"valg": ["ApS", "I/S", "A/S", "Enkeltmandsvirksomhed"], "rigtig": 2, "q": "Hvilken ejerform har begrænset hæftelse og et kapitalkrav på 400.000 kr.?", "f": "ApS har også begrænset hæftelse, men kun 20.000 kr. i kapitalkrav. I/S og enkeltmandsvirksomhed har personlig, ubegrænset hæftelse.", "emne": "Virksomheden og årsregnskabet"}, {"valg": ["Den er under 10 %", "Den er over 10 %", "Den er præcis 10 %", "Intet"], "rigtig": 1, "q": "Kapitalværdien er positiv ved en kalkulationsrente på 10 %. Hvad ved du så om den interne rente?", "f": "Den interne rente er den rente, hvor KV = 0. Er KV &gt; 0 ved 10 %, skal renten op over 10 %, før KV bliver 0.", "emne": "Investering og TCO"}, {"valg": ["Afskrivninger", "Kontante kapacitetsomkostninger", "Renter", "Salgsfremmende omkostninger"], "rigtig": 1, "q": "Hvad står mellem MFB og IB i resultatbudgettets trappe?", "f": "Omsætning − VO = DB − salgsfremmende = MFB − kontante KO = IB − afskrivninger = resultat før renter.", "emne": "Budgettering"}, {"valg": ["Hjemmemarkedet skal have mere, så reklamen tjenes hjem", "Slet ikke. Den er fast og indgår kun i MFB", "Eksporten skal sænkes med 250.000/DB-pr.-stk.", "Reklamen lægges til VE"], "rigtig": 1, "q": "En reklamekampagne på 250.000 kr. er bestilt. Hvordan påvirker den fordelingen mellem hjemmemarked og eksport?", "f": "Faste omkostninger ændrer ikke, hvor DOMS = DOMK. De trækkes fra bagefter.", "emne": "Pris- og aktivitetsoptimering"}, {"valg": ["Fordi afskrivningerne slutter", "Fordi stigende vedligehold, faldende effektivitet og nyt, bedre udstyr gør det dyrere at fortsætte end at udskifte", "Fordi scrapværdien bliver negativ", "Fordi kalkulationsrenten stiger"], "rigtig": 1, "q": "Hvorfor er den økonomiske levetid ofte kortere end den tekniske?", "f": "Anlægget kan stadig køre, men det kan betale sig at udskifte det.", "emne": "Investering og TCO"}, {"valg": ["Kundegrupperne har forskellig elasticitet", "Grupperne kan holdes adskilt", "Varen skal være uelastisk i alle grupper", "Det skal være lovligt"], "rigtig": 2, "q": "Hvilken betingelse skal <strong>ikke<\/strong> være opfyldt for at kunne prisdifferentiere?", "f": "Pointen er netop, at elasticiteten er <em>forskellig<\/em> i grupperne. Ellers ville samme pris være optimal overalt.", "emne": "Afsætning og elasticitet"}, {"valg": ["CO₂e-udledning", "Sygefravær", "Bestyrelsens sammensætning", "Affaldsmængde"], "rigtig": 1, "q": "Hvilket nøgletal hører under S?", "f": "Social handler om mennesker: ulykker, fravær, diversitet, uddannelse og trivsel.", "emne": "Bæredygtighed, CSR og ESG"}, {"valg": ["At maksimere overskuddet", "At stile efter et tilfredsstillende resultat frem for det størst mulige", "At tilfredsstille alle interessenter lige meget", "At minimere omkostningerne"], "rigtig": 1, "q": "Hvad er satisficering?", "f": "Satisficering er alternativet til gevinstmaksimering. Virksomheden nøjes med et resultat, der er godt nok.", "emne": "Virksomheden og årsregnskabet"}, {"q": "Samme virksomhed har en kapacitet på 84.000 stk. Hvilken pris skal den tage?", "tal": 1150.0, "tol": 0.5, "enhed": "kr.", "losning": "Kapaciteten er mindre end 85.200, så x = 84.000 og p = 1.850 − 84.000/120 = 1.850 − 700 = 1.150 kr.", "f": "Ved knap kapacitet sætter man den pris, der netop sælger hele kapaciteten.", "emne": "Pris- og aktivitetsoptimering"}, {"valg": ["Scrapværdien", "Installation og indkøring", "Afskrivninger", "Ekstra lagerbinding (arbejdskapital)"], "rigtig": 2, "q": "Hvilken post skal <strong>ikke<\/strong> med i en investerings betalingsrække?", "f": "Afskrivninger er ikke betalinger. Købet står allerede i år 0.", "emne": "Investering og TCO"}, {"q": "En besparelse på 90.000 kr./år i 6 år ved r = 12 % (faktor 4,1114). I₀ = 450.000 kr. Hvad er KV? (hele kr.)", "tal": -79973.0, "tol": 30.0, "enhed": "kr.", "losning": "KV = −450.000 + 90.000 · 4,11141 = −450.000 + 370.027 = −79.973 kr.", "f": "Negativ KV: ikke lønsom på de økonomiske tal alene. Bløde værdier kan vende beslutningen.", "emne": "Investering og TCO"}, {"valg": ["Februar", "Marts", "April", "Maj"], "rigtig": 2, "q": "Varer købes i februar med 60 dages kredit og sælges i marts. Hvornår er der en <strong>udbetaling<\/strong>?", "f": "Udgiften er i februar (varen modtages), omkostningen i marts (varen forbruges), og udbetalingen sker, når kreditten udløber 60 dage efter: april.", "emne": "Indtægter og omkostninger"}];

  document.querySelectorAll(".del").forEach(s => s.hidden = s.id !== "d-" + del);
}
tabs.forEach(b => b.addEventListener("click", () => {
  vis(b.dataset.del);
  const u = new URL(location.href); u.searchParams.set("vis", b.dataset.del); history.replaceState(null, "", u);
  window.scrollTo(0, 0);
}));
// tomme dele skjules i fanerne
["noter", "formler"].forEach(d => { if (!document.getElementById("d-" + d).textContent.trim()) tabs.find(b => b.dataset.del === d).hidden = true; });
if (!QUIZ.length) tabs.find(b => b.dataset.del === "quiz").hidden = true;
if (SAMLET) { document.getElementById("tabs").hidden = true; vis("quiz"); }
else { const v = q.get("vis") || "noter", t = tabs.find(b => b.dataset.del === v && !b.hidden) || tabs.find(b => !b.hidden); vis(t ? t.dataset.del : "noter"); }

// tabeller kan scrolles på mobil
document.querySelectorAll(".del table").forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.before(w); w.append(t); });

// quiz
let gemt = {};
try { gemt = JSON.parse(localStorage.getItem(NOGLE) || "{}"); } catch (e) {}
const gem = () => { try { localStorage.setItem(NOGLE, JSON.stringify(gemt)); } catch (e) {} };
// Danske og engelske skrivemåder virker begge: "85.200", "85200", "1.150,5", "0,86", "0.86".
// Et enkelt punktum efterfulgt af tre cifre kan både være tusindtal og decimal, så begge tolkninger prøves.
const tolk = s => { s = String(s).replace(/[\s\u00a0]/g, "").replace("−", "-");
  if (!/^-?[\d.,]+$/.test(s)) return [];
  if (s.includes(",")) return [parseFloat(s.replace(/\./g, "").replace(",", "."))];
  if ((s.match(/\./g) || []).length > 1) return [parseFloat(s.replace(/\./g, ""))];
  const ud = [parseFloat(s)];
  if (/^-?\d+\.\d{3}$/.test(s)) ud.push(parseFloat(s.replace(".", "")));
  return ud; };
const fmt = x => x.toLocaleString("da-DK", { maximumFractionDigits: 4 });

function bygQuiz() {
  const rod = document.getElementById("quiz"); rod.innerHTML = "";
  QUIZ.forEach((s, i) => {
    const el = document.createElement("div"); el.className = "q";
    el.innerHTML = `<div class="nr">Spørgsmål ${i + 1} af ${QUIZ.length}${SAMLET ? `<span class="emnetag">${s.emne}</span>` : ""}</div><div class="tekst">${s.q}</div>`;
    const g = gemt[i];
    if (s.valg) {
      const v = document.createElement("div"); v.className = "valg";
      s.valg.forEach((t, j) => {
        const b = document.createElement("button"); b.innerHTML = t;
        b.addEventListener("click", () => { gemt[i] = { valgt: j, ok: j === s.rigtig }; gem(); bygQuiz(); });
        v.append(b);
      });
      el.append(v);
      if (g) {
        [...v.children].forEach((b, j) => { b.disabled = true; if (j === s.rigtig) b.classList.add("ok"); else if (j === g.valgt) b.classList.add("bad"); });
        el.insertAdjacentHTML("beforeend", `<div class="svar ${g.ok ? "ok" : "bad"}"><b>${g.ok ? "Rigtigt." : "Ikke helt."}</b>${s.f || ""}</div>`);
      }
    } else {
      const f = document.createElement("div"); f.className = "tal";
      f.innerHTML = `<input inputmode="decimal" aria-label="Dit svar" placeholder="Dit svar"> <span class="enhed">${s.enhed || ""}</span> <button class="knap">Tjek</button> <button class="knap stille">Vis facit</button>`;
      const [inp, , tjek, opgiv] = f.children;
      el.append(f);
      const faerdig = g && (g.ok || g.forsog >= 2 || g.opgivet);
      if (g && g.svar != null) inp.value = g.svar;
      if (faerdig) {
        inp.disabled = tjek.disabled = opgiv.disabled = true;
        el.insertAdjacentHTML("beforeend", `<div class="svar ${g.ok ? "ok" : "bad"}"><b>${g.ok ? "Rigtigt." : "Facit: " + fmt(s.tal) + " " + (s.enhed || "")}</b>${s.losning ? s.losning + "<br>" : ""}${s.f || ""}</div>`);
      } else if (g && g.forsog === 1) {
        el.insertAdjacentHTML("beforeend", `<div class="svar hint"><b>Ikke helt. Tjek din opstilling og prøv igen.</b>Du har ét forsøg tilbage.</div>`);
      }
      const svar = () => {
        const xs = tolk(inp.value); if (!xs.length || xs.some(isNaN)) { inp.focus(); return; }
        const ok = xs.some(x => Math.abs(x - s.tal) <= Math.max(s.tol, Math.abs(s.tal) * 1e-9));
        const forsog = ((g && g.forsog) || 0) + 1;
        gemt[i] = { svar: inp.value, ok, forsog }; gem(); bygQuiz();
      };
      tjek.addEventListener("click", svar);
      inp.addEventListener("keydown", e => { if (e.key === "Enter") svar(); });
      opgiv.addEventListener("click", () => { gemt[i] = { svar: inp.value, ok: false, forsog: 2, opgivet: true }; gem(); bygQuiz(); });
    }
    rod.append(el);
  });
  // score
  const faerdige = QUIZ.map((s, i) => gemt[i] && (s.valg || gemt[i].ok || gemt[i].forsog >= 2));
  const antal = faerdige.filter(Boolean).length, rigtige = QUIZ.filter((s, i) => gemt[i] && gemt[i].ok).length;
  const forkerte = QUIZ.map((s, i) => faerdige[i] && !gemt[i].ok ? `<li>${s.q.replace(/<[^>]+>/g, "")}${SAMLET ? ` <em>(${s.emne})</em>` : ""}</li>` : "").join("");
  document.getElementById("score").innerHTML = antal === 0 ? "" : `<div class="score">
    <h2>${rigtige} af ${QUIZ.length} rigtige${antal < QUIZ.length ? ` · ${QUIZ.length - antal} mangler` : ""}</h2>
    ${forkerte ? `<p>Tag med i repetitionen:</p><ul>${forkerte}</ul>` : antal === QUIZ.length ? "<p>Alle rigtige. Tag quizzen igen om et par uger.</p>" : ""}
    <button class="knap stille" id="nulstil">Start forfra</button></div>`;
  const n = document.getElementById("nulstil");
  if (n) n.addEventListener("click", () => { gemt = {}; gem(); bygQuiz(); window.scrollTo(0, document.getElementById("d-quiz").offsetTop - 70); });
}
if (QUIZ.length) bygQuiz();
</script>
</body>
</html>
