<script>
const QUIZ = [{"q": "En motor optager 440 W og afgiver 299 W ved 50 o/s. Hvad er akselmomentet? (Nm)", "tal": 0.952, "tol": 0.005, "enhed": "Nm", "losning": "M = P2 / ω = 299,2 / (2π · 50) = 299,2 / 314,16 = 0,952 Nm.", "f": "Brug den afgivne effekt og ω i rad/s.", "emne": "DC-motoren"}, {"q": "22 paneler i serie med 27,4 V hver og 4 strenge i parallel med 7,3 A pr. streng. Hvad er anlæggets effekt? (kW)", "tal": 17.6, "tol": 0.1, "enhed": "kW", "losning": "U = 22 · 27,4 = 602,8 V. I = 4 · 7,3 = 29,2 A. P = 17,6 kW.", "f": "Serie lægger spændinger sammen, parallel lægger strømme sammen.", "emne": "Halvledere, dioder og solceller"}, {"q": "Hvor lang er en periode ved 50 Hz? (ms)", "tal": 20.0, "tol": 0.1, "enhed": "ms", "losning": "T = 1 / 50 = 0,02 s = 20 ms.", "f": "T = 1 / f.", "emne": "Vekselspænding, strøm og effekt (enfaset)"}, {"valg": ["I2 = I_23 + I_12", "I2 = I_23 − I_12", "I2 = I_12 − I_31", "I2 = I_31 − I_23"], "rigtig": 1, "q": "Hvad er den rigtige netstrøm i L2 ud fra trekantens grenstrømme?", "f": "I hjørne 2 løber I_23 ud og I_12 ind. Sliden har en trykfejl her.", "emne": "Y-Δ-transformation og stjernelast uden nul"}, {"q": "En motor optager 5.155 W og afgiver 4.000 W. Hvad er virkningsgraden? (%)", "tal": 77.6, "tol": 0.2, "enhed": "%", "losning": "η = 4.000 / 5.155 = 0,776 = 77,6 %.", "f": "η = P2 / P1. Tabene er 1.155 W.", "emne": "Ledere, effekt og energi"}, {"q": "En motor afgiver 15 kW på akslen ved 1.460 o/min. Hvad er momentet? (Nm)", "tal": 98.1, "tol": 0.5, "enhed": "Nm", "losning": "ω = 2π · 1.460 / 60 = 152,9 rad/s. M = 15.000 / 152,9 = 98,1 Nm.", "f": "Husk at regne o/min om til rad/s.", "emne": "Ledere, effekt og energi"}, {"valg": ["Spændingen", "Strømmen", "Modstanden", "Effekten"], "rigtig": 2, "q": "Hvad svarer reluktansen R_m til i en elektrisk kreds?", "f": "N · I = Φ · R_m svarer til U = I · R.", "emne": "Magnetisme"}, {"q": "Med R1 = 100 Ω, X_L = 78,5 Ω i den ene gren og R2 = 80 Ω, X_C = 159 Ω i den anden på 100 V: hvad er den samlede strøm? (A)", "tal": 0.871, "tol": 0.01, "enhed": "A", "losning": "I1 = 0,786∠−38,2° = 0,618 − j0,486. I2 = 0,561∠63,3° = 0,252 + j0,502. I = 0,870 + j0,016, |I| = 0,871 A.", "f": "Den induktive og den kapacitive strøm ophæver næsten hinanden, så I er næsten i fase med U.", "emne": "Blandede AC-kredse"}, {"valg": ["Med uret", "Mod uret", "Parallelt med lederen", "Der er intet felt"], "rigtig": 0, "q": "Strømmen løber ind i papiret. Hvilken vej går feltet om lederen?", "f": "Proptrækkerreglen: skru ind i papiret, så drejer proptrækkeren med uret.", "emne": "Magnetfelt, håndregler og induktion"}, {"valg": ["Altid den rigtige effektivværdi", "Middelværdien gange 1,11, som kan være forkert", "Spidsværdien", "Nul"], "rigtig": 1, "q": "Hvad viser et ikke-true-RMS instrument på en forvrænget kurve?", "f": "Formfaktoren 1,11 passer kun til ren sinus.", "emne": "Vekselspænding, strøm og effekt (enfaset)"}, {"valg": ["cos φ = 1", "cos φ = 0,866", "cos φ = 0,5", "cos φ = 0"], "rigtig": 2, "q": "Ved hvilken effektfaktor viser det ene wattmeter i Aron-koblingen 0?", "f": "cos(30° + 60°) = cos 90° = 0. Under 0,5 bliver visningen negativ.", "emne": "3-faset symmetrisk belastning"}, {"valg": ["Vinklen mellem U og I", "Vinklen mellem fluxen Φ og strømmen I, som skyldes jerntabet", "Vinklen mellem U og Φ", "Spolens effektfaktor"], "rigtig": 1, "q": "Hvad viser vinklen α i vektordiagrammet for en jernspole?", "f": "Uden jerntab ville Φ ligge i fase med I. tan α = R_Fe / X_L,eff.", "emne": "Magnetisme"}, {"q": "En symmetrisk stjerne har 30 Ω pr. gren. Hvad er hver gren i den ækvivalente trekant? (Ω)", "tal": 90.0, "tol": 0.1, "enhed": "Ω", "losning": "R_Δ = 3 · R_Y = 90 Ω.", "f": "Det er den samme regel, der giver P_Δ = 3 · P_Y for samme modstande.", "emne": "Y-Δ-transformation og stjernelast uden nul"}, {"valg": ["Hysteresetabet", "Hvirvelstrømstabet", "Kobbertabet", "Det mekaniske tab"], "rigtig": 1, "q": "Hvilket tab mindskes ved at lamellere jernkernen?", "f": "De isolerede plader afbryder hvirvelstrømmenes vej i kernen.", "emne": "Magnetisme"}, {"q": "En flux på 0,4 mWb går gennem et tværsnit på 4 cm². Hvad er B? (T)", "tal": 1.0, "tol": 0.01, "enhed": "T", "losning": "B = Φ / A = 0,4·10⁻³ / 4·10⁻⁴ = 1,0 T.", "f": "B = Φ / A.", "emne": "Magnetisme"}, {"q": "To kondensatorer på 10 µF og 40 µF sidder i serie. Hvad er den samlede kapacitans? (µF)", "tal": 8.0, "tol": 0.05, "enhed": "µF", "losning": "C = (1/10 + 1/40)⁻¹ = (0,125)⁻¹ = 8 µF.", "f": "Kondensatorer i serie regnes som modstande i parallel.", "emne": "Kondensatoren"}, {"valg": ["Strømmen i den første gren", "Den fælles spænding U", "Den samlede strøm", "Spændingen over den første modstand"], "rigtig": 1, "q": "Hvad er reference i vektordiagrammet for to seriegrene, der sidder i parallel?", "f": "Grenene har samme spænding, så U er reference.", "emne": "Blandede AC-kredse"}, {"valg": ["Den stiger", "Den falder", "Den er uændret", "Den bliver nul"], "rigtig": 1, "q": "Med 80/125/45 Ω uden nul er U_X0 ca. 68 V. Hvad sker der med den samlede effekt i forhold til med nul?", "f": "Spændingen flyttes fra de små modstande (som tog mest effekt) over på den store. P falder fra 2,28 kW til 2,08 kW.", "emne": "Y-Δ-transformation og stjernelast uden nul"}, {"q": "Hvor stor spænding skal der ca. til, før en siliciumdiode leder?", "tal": 0.7, "tol": 0.1, "enhed": "V", "losning": "Knæspændingen for silicium er ca. 0,6–0,7 V.", "f": "Under den spænding er strømmen næsten nul.", "emne": "Halvledere, dioder og solceller"}, {"valg": ["Kun vinklen bliver forkert", "Grenen opfører sig som en spole, så både strømme, Z og cos φ bliver forkerte", "Ingen, størrelsen er den samme", "Kun U_cd bliver forkert"], "rigtig": 1, "q": "Hvilken fejl giver det, hvis du skriver X_C med plus i en gren?", "f": "Fortegnet bestemmer, om strømmen ligger før eller efter. Hele vektorsummen ændrer sig.", "emne": "Blandede AC-kredse"}, {"q": "En motor på 3 × 400 V trækker 9,3 A med cos φ = 0,8. Hvad er P1? (W)", "tal": 5155.0, "tol": 10.0, "enhed": "W", "losning": "P1 = √3 · 400 · 9,3 · 0,8 = 5.155 W.", "f": "Brug netværdier i √3-formlen.", "emne": "3-faset symmetrisk belastning"}, {"q": "R = 85 Ω, X_L = 62,8 Ω og X_C = 123,2 Ω i serie. Hvad er |Z|? (Ω)", "tal": 104.2, "tol": 0.5, "enhed": "Ω", "losning": "|Z| = √(85² + (62,8 − 123,2)²) = √(7225 + 3648) = √10873 = 104,3 Ω.", "f": "Reaktanserne trækkes fra hinanden, før de kvadreres.", "emne": "AC-kredse"}, {"q": "En spole har L = 2 H og R = 100 Ω. Hvad er tidskonstanten? (ms)", "tal": 20.0, "tol": 0.1, "enhed": "ms", "losning": "τ = L / R = 2 / 100 = 0,02 s = 20 ms.", "f": "Efter 5τ = 100 ms har strømmen nået sin slutværdi.", "emne": "Magnetfelt, håndregler og induktion"}, {"q": "Ohmmeteret viser 205, 170 og 125 Ω mellem klemmerne 1–2, 2–3 og 3–1 på en stjerne. Hvad er R1? (Ω)", "tal": 80.0, "tol": 0.5, "enhed": "Ω", "losning": "Summen af alle tre er (205 + 170 + 125)/2 = 250 Ω. R1 = 250 − R2 − R3 = 250 − 170 = 80 Ω.", "f": "Mellem to klemmer måles to stjernemodstande i serie.", "emne": "Y-Δ-transformation og stjernelast uden nul"}, {"q": "10 A resistivt på L1–N og 10 A resistivt på L2–N. Hvad er nulstrømmen? (A)", "tal": 10.0, "tol": 0.05, "enhed": "A", "losning": "|10∠0° + 10∠−120°| = |10 − 5 − j8,66| = |5 − j8,66| = 10 A.", "f": "To lige store strømme med 120° imellem giver en sum af samme størrelse.", "emne": "Usymmetrisk belastning med nul"}, {"q": "En leder på 0,2 m med 10 A står vinkelret i et felt på 0,8 T. Hvor stor er kraften? (N)", "tal": 1.6, "tol": 0.01, "enhed": "N", "losning": "F = B · I · l = 0,8 · 10 · 0,2 = 1,6 N.", "f": "F = B · I · l, når lederen står vinkelret på feltet.", "emne": "Magnetfelt, håndregler og induktion"}, {"q": "Samme Aron-visninger (1.880 W og −280 W). Hvad er Q? (var)", "tal": 3741.0, "tol": 10.0, "enhed": "var", "losning": "Q = √3 · (1.880 − (−280)) = √3 · 2.160 = 3.741 var.", "f": "Q = √3 · (W2 − W1) gælder ved symmetrisk last.", "emne": "3-faset symmetrisk belastning"}, {"valg": ["R_L = 0", "R_L = 2 · R_Th", "R_L = R_Th", "R_L = ∞"], "rigtig": 2, "q": "Ved hvilken belastning får R_L maksimal effekt fra en Thevenin-kilde?", "f": "Effekttilpasning: R_L = R_Th. Virkningsgraden er så kun 50 %.", "emne": "DC-kredse"}, {"valg": ["Den aktive effekt P", "Den reaktive effekt Q", "Den tilsyneladende effekt S (altså strømmen)", "Middelværdien af spændingen"], "rigtig": 2, "q": "Hvad skal et kabel dimensioneres efter?", "f": "Strømmen I = S/U giver varmen i kablet, uanset om den er aktiv eller reaktiv.", "emne": "Vekselspænding, strøm og effekt (enfaset)"}, {"q": "En Y-koblet vandvarmer på 15 kW mister L3. Hvor meget effekt afgiver den nu? (kW)", "tal": 7.5, "tol": 0.1, "enhed": "kW", "losning": "R = (400/√3)² / 5.000 = 230,9² / 5.000 = 10,67 Ω. Uden L3 sidder to modstande i serie på 400 V: P = 400² / 21,33 = 7.500 W.", "f": "Den tredje modstand er strømløs.", "emne": "Y-Δ-transformation og stjernelast uden nul"}, {"valg": ["1.000 W/m², celletemperatur 25 °C, AM 1,5", "800 W/m², omgivelsestemperatur 20 °C, vind 1 m/s", "1.000 W/m², omgivelsestemperatur 20 °C, AM 1", "Den højeste effekt panelet kan give"], "rigtig": 0, "q": "Hvad betyder STC?", "f": "Det andet svar er NOCT. Bemærk at STC er celletemperatur, NOCT er omgivelsestemperatur.", "emne": "Halvledere, dioder og solceller"}, {"valg": ["Resistansen", "Spolen", "Kondensatoren", "Ingen af dem"], "rigtig": 2, "q": "I hvilken komponent ligger strømmen 90° før spændingen?", "f": "ICE: i en kondensator (C) kommer I før E.", "emne": "AC-kredse"}, {"q": "Et komfur bruger 8,8 kW i 2 timer. Hvor meget energi er det i MJ?", "tal": 63.36, "tol": 0.1, "enhed": "MJ", "losning": "8,8 · 2 = 17,6 kWh. 17,6 · 3,6 = 63,36 MJ.", "f": "1 kWh = 3,6 MJ.", "emne": "Ledere, effekt og energi"}, {"valg": ["Kun ved symmetrisk last med adgang til et nulpunkt", "Ved al last i et 4-ledernet", "Ved al last i et 3-ledernet", "Kun ved rent resistiv last"], "rigtig": 0, "q": "Hvornår må 1-wattmetermetoden bruges?", "f": "P = 3 · W forudsætter, at alle faser trækker samme effekt.", "emne": "3-faset symmetrisk belastning"}, {"q": "En strøm på 9 A deler sig mellem 6 Ω og 3 Ω i parallel. Hvor stor er strømmen i 6 Ω-modstanden? (A)", "tal": 3.0, "tol": 0.01, "enhed": "A", "losning": "I_6 = 9 · 3 / (6 + 3) = 3 A. Kontrol: U = 3 · 6 = 18 V, og 18 / 3 = 6 A i den anden. 3 + 6 = 9 A.", "f": "Den modsatte modstand står i tælleren.", "emne": "DC-kredse"}, {"q": "Spolen har en kobberresistans på 130 Ω. Hvad er jerntabet? (W)", "tal": 46.9, "tol": 0.5, "enhed": "W", "losning": "P_Cu = 130 · 1,25² = 203,1 W. P_Fe = 250 − 203,1 = 46,9 W.", "f": "Den målte effekt er kobbertab plus jerntab.", "emne": "Vekselspænding, strøm og effekt (enfaset)"}, {"q": "En shuntmotor på 220 V har R_sh = 1.200 Ω og trækker 2,0 A. Hvad er ankerstrømmen? (A)", "tal": 1.817, "tol": 0.005, "enhed": "A", "losning": "I_sh = 220 / 1.200 = 0,183 A. I_a = 2,0 − 0,183 = 1,817 A.", "f": "Kirchhoff: netstrømmen deler sig i shunt- og ankerstrøm.", "emne": "DC-motoren"}, {"valg": ["Spændingerne står med en vinkel til hinanden og lægges sammen vektorielt", "Voltmetrene er unøjagtige", "Der går strøm i voltmetrene", "Spolen er kapacitiv"], "rigtig": 0, "q": "Tre voltmetre viser U1 = 55 V over R, U2 = 75 V over spolen og U3 = 125 V i alt. Hvorfor er 55 + 75 ikke 125?", "f": "U over R er i fase med I, men U over spolen er drejet. Den vektorielle sum er mindre end den aritmetiske.", "emne": "AC-kredse"}, {"valg": ["Forholdet E_Th / R_Th, så du kan finde R_Th ud fra E_Th og I_k", "Den maksimale effekt i belastningen", "Batteriets kapacitet", "Strømmen ved effekttilpasning"], "rigtig": 0, "q": "Hvad viser en Thevenin-kildes kortslutningsstrøm dig?", "f": "I_k = E_Th / R_Th, så R_Th = E_Th / I_k. Det bruges i Lab 2.", "emne": "DC-kredse"}, {"q": "En seriemotor på 460 V med 0,85 Ω i anker og felt skal have startstrømmen begrænset til 39,5 A. ΔU_b = 2 V. Hvor stor skal igangsætteren være? (Ω)", "tal": 10.7, "tol": 0.1, "enhed": "Ω", "losning": "R = (460 − 2) / 39,5 − 0,85 = 11,59 − 0,85 = 10,74 Ω.", "f": "Ved start er E = 0.", "emne": "DC-motoren"}, {"valg": ["Strømmen løber ind i papiret", "Strømmen løber ud af papiret", "Der er ingen strøm", "Lederen er jordet"], "rigtig": 0, "q": "Hvad betyder et kryds (⊗) i en leder på en tegning?", "f": "Du ser pilens fjer bagfra. En prik (⊙) er pilens spids, altså strøm ud af papiret.", "emne": "Magnetfelt, håndregler og induktion"}, {"q": "En leder på 0,5 m bevæges med 4 m/s vinkelret gennem et felt på 1,2 T. Hvad er den inducerede spænding? (V)", "tal": 2.4, "tol": 0.01, "enhed": "V", "losning": "E = B · l · v = 1,2 · 0,5 · 4 = 2,4 V.", "f": "Dobbelt hastighed giver dobbelt spænding.", "emne": "Magnetfelt, håndregler og induktion"}, {"valg": ["Du afbryder dem", "Du kortslutter dem, men beholder deres indre modstand", "Du fjerner både kilden og dens indre modstand", "Du vender deres polaritet"], "rigtig": 1, "q": "Hvordan behandler du de andre spændingskilder, når du regner med superposition?", "f": "En ideel spændingskilde har 0 Ω, så den erstattes af en kortslutning. Den indre modstand bliver siddende.", "emne": "DC-kredse"}, {"q": "Et kobberkabel har S = 10 mm² og R = 8,75 mΩ. Hvor langt er det? (m)", "tal": 5.0, "tol": 0.05, "enhed": "m", "losning": "l = R · S / ρ = 8,75·10⁻³ · 10 / 0,0175 = 5,0 m.", "f": "R = ρ · l / S omskrevet til l.", "emne": "Ledere, effekt og energi"}, {"valg": ["Regn U_X0 = U_i0 − U_iX for alle tre faser og se, at de giver det samme", "Læg de tre fasespændinger sammen", "Tjek at strømmene er lige store", "Det kan ikke kontrolleres"], "rigtig": 0, "q": "Hvordan kontrollerer du din beregning af stjernepunktets forskydning?", "f": "Stjernepunktet har kun én placering, så alle tre veje skal give samme vektor.", "emne": "Y-Δ-transformation og stjernelast uden nul"}, {"q": "Et batteri har E = 12,6 V og U_kl = 11,9 V ved 50 A. Hvad er den indre modstand? (mΩ)", "tal": 14.0, "tol": 0.5, "enhed": "mΩ", "losning": "R_i = (12,6 − 11,9) / 50 = 0,7 / 50 = 0,014 Ω = 14 mΩ.", "f": "Spændingsfaldet over R_i er forskellen mellem EMK og klemspænding.", "emne": "Ledere, effekt og energi"}, {"q": "Et panel giver 27,4 V og 7,3 A ved 850 W/m². Arealet er 1,627 m². Hvad er virkningsgraden? (%)", "tal": 14.46, "tol": 0.1, "enhed": "%", "losning": "η = 27,4 · 7,3 / (850 · 1,627) = 200 / 1.383 = 0,1446 = 14,46 %.", "f": "Effekt ud delt med lysets effekt ind på hele arealet.", "emne": "Halvledere, dioder og solceller"}, {"q": "Luft og PVC (ε_r = 7) ligger i lige tykke lag i en kondensator. Hvor mange gange større er feltstyrken i luften end i PVC?", "tal": 7.0, "tol": 0.1, "enhed": "", "losning": "D = Q/A er ens i begge lag. E = D / (ε₀ · ε_r), så E_luft / E_PVC = 7 / 1 = 7.", "f": "Det svageste dielektrikum får den største feltstyrke.", "emne": "Kondensatoren"}, {"q": "Hvad er spidsværdien af en sinusspænding på 230 V? (V)", "tal": 325.0, "tol": 1.0, "enhed": "V", "losning": "U_max = 230 · √2 = 325,3 V.", "f": "230 V er effektivværdien.", "emne": "Vekselspænding, strøm og effekt (enfaset)"}, {"valg": ["63,2 %", "86,5 %", "95,0 %", "50 %"], "rigtig": 1, "q": "Hvor mange procent er kondensatoren opladet efter 2τ?", "f": "1 − e⁻² = 0,865.", "emne": "Kondensatoren"}, {"valg": ["μ_r stiger kraftigt", "μ_r falder, så mere strøm næsten ikke giver mere flux", "Jerntabet forsvinder", "B falder til nul"], "rigtig": 1, "q": "Hvad sker der, når jernet går i mætning?", "f": "Over ca. 1,2–1,6 T flader B-H-kurven ud.", "emne": "Magnetisme"}, {"q": "Et pyranometer med K = 148 mV/(kW/m²) viser 125,8 mV. Hvad er indstrålingen? (W/m²)", "tal": 850.0, "tol": 5.0, "enhed": "W/m²", "losning": "asr = 125,8 / 148 = 0,85 kW/m² = 850 W/m².", "f": "Spændingen er proportional med indstrålingen.", "emne": "Halvledere, dioder og solceller"}, {"q": "Hvilken vinkel har strømmen i en last med cos φ = 0,65 (induktiv) på L1–N, når U_1N er 0°? (°)", "tal": -49.5, "tol": 0.3, "enhed": "°", "losning": "φ = cos⁻¹ 0,65 = 49,46°. Strømmen ligger efter: −49,5°.", "f": "Induktiv last: strømmen ligger φ efter spændingen.", "emne": "Usymmetrisk belastning med nul"}, {"q": "Tre stjernemodstande er 80, 125 og 45 Ω. Hvad er R12 i den ækvivalente trekant? (Ω)", "tal": 427.2, "tol": 0.5, "enhed": "Ω", "losning": "R12 = (80·125 + 125·45 + 45·80) / 45 = 19.225 / 45 = 427,2 Ω.", "f": "Nævneren er stjernemodstanden over for grenen (R30).", "emne": "Y-Δ-transformation og stjernelast uden nul"}, {"q": "En last på 2 kW har cos φ = 0,60 og skal kompenseres til 0,95 på 230 V. Hvor stor skal Q_C være? (var)", "tal": 2009.0, "tol": 15.0, "enhed": "var", "losning": "tan φ₁ = tan(cos⁻¹ 0,6) = 1,333 og tan φ₂ = tan(18,19°) = 0,3287. Q_C = 2000 · (1,333 − 0,3287) = 2009 var.", "f": "Q_C = P · (tan φ₁ − tan φ₂).", "emne": "Kondensatoren"}, {"valg": ["Ja, fx ved 3. harmoniske fra elektronik, som er i fase i alle tre faser og lægges sammen i nullen", "Nej, aldrig", "Kun hvis nullen er afbrudt", "Kun ved rent resistiv last"], "rigtig": 0, "q": "Kan nulstrømmen blive større end den største fasestrøm?", "f": "Derfor dimensioneres nullen i nyere installationer med elektronik ofte fuldt.", "emne": "Usymmetrisk belastning med nul"}, {"q": "Hvad er strømvarmetabet i 8,75 mΩ ved 50 A? (W)", "tal": 21.9, "tol": 0.2, "enhed": "W", "losning": "P = R · I² = 0,00875 · 2.500 = 21,9 W.", "f": "Tabet vokser med kvadratet på strømmen.", "emne": "Ledere, effekt og energi"}, {"valg": ["L1–N", "L2–N", "L3–N", "Det er lige meget"], "rigtig": 2, "q": "Den induktive last på L1–N har strømmen ∠ −49,5°. På hvilken fase skal et varmelegeme sidde for at give mindst nulstrøm?", "f": "Varmelegemets strøm skal pege så modsat som muligt (130,5°). L3–N (120°) er tættest.", "emne": "Usymmetrisk belastning med nul"}, {"q": "En parallelkreds har Z_eb = 30 + j10 Ω og sidder i serie med R1 = 20 Ω og X_L1 = 15 Ω. Hvad er |Z_fa|? (Ω)", "tal": 55.9, "tol": 0.3, "enhed": "Ω", "losning": "Z_fa = 20 + (30 + j10) + j15 = 50 + j25. |Z_fa| = √(50² + 25²) = √3125 = 55,9 Ω.", "f": "Serieled lægges sammen komplekst: realdele for sig, imaginærdele for sig.", "emne": "Blandede AC-kredse"}, {"valg": ["Den vender", "Den er uændret", "Den bliver nul", "Den fordobles"], "rigtig": 1, "q": "Både strømmens retning og feltets retning vendes. Hvad sker der med kraften?", "f": "Én vending vender kraften. To vendinger ophæver hinanden.", "emne": "Magnetfelt, håndregler og induktion"}, {"valg": ["For at relæet trækker hurtigere", "For at undgå en høj spændingsspids, når strømmen afbrydes", "For at beskytte mod forkert polaritet", "For at mindske strømforbruget"], "rigtig": 1, "q": "Hvorfor sætter man en friløbsdiode over en relæspole?", "f": "Dioden giver spolens strøm en vej, så di/dt bliver lille, og e = −L · di/dt bliver lille.", "emne": "Magnetfelt, håndregler og induktion"}, {"q": "Hvad er X_C for en kondensator på 75 µF ved 50 Hz? (Ω)", "tal": 42.44, "tol": 0.1, "enhed": "Ω", "losning": "X_C = 1 / (2π · 50 · 75·10⁻⁶) = 1 / 0,02356 = 42,44 Ω.", "f": "X_C falder, når frekvensen stiger.", "emne": "AC-kredse"}, {"valg": ["1,5 V og 4000 mAh", "3 V og 2000 mAh", "3 V og 4000 mAh", "1,5 V og 2000 mAh"], "rigtig": 1, "q": "To ens 1,5 V-celler på 2000 mAh kobles i serie. Hvad får du?", "f": "I serie lægges spændingerne sammen, mens den samme strøm går gennem begge celler, så kapaciteten er uændret.", "emne": "DC-kredse"}, {"q": "Varmelegemer trækker 10 A (cos φ = 1), og en motor trækker 9,3 A (cos φ = 0,8) i samme fase. Hvad er netstrømmen? (A)", "tal": 18.3, "tol": 0.1, "enhed": "A", "losning": "I_w = 10 + 9,3 · 0,8 = 17,44 A. I_wl = 9,3 · 0,6 = 5,58 A. I = √(17,44² + 5,58²) = 18,3 A.", "f": "Strømme med forskellig vinkel lægges sammen vektorielt.", "emne": "3-faset symmetrisk belastning"}, {"q": "En kreds har E_Th = 29 V og R_Th = 6,42 Ω. Hvad er U_ab med en belastning på 5 Ω? (V)", "tal": 12.7, "tol": 0.1, "enhed": "V", "losning": "U_ab = 29 · 5 / (6,42 + 5) = 145 / 11,42 = 12,70 V.", "f": "Spændingsdeler mellem R_Th og R_L.", "emne": "DC-kredse"}, {"q": "To modstande på 6 Ω og 3 Ω sidder i parallel. Hvad er erstatningsmodstanden? (Ω)", "tal": 2.0, "tol": 0.01, "enhed": "Ω", "losning": "R = 6 · 3 / (6 + 3) = 18 / 9 = 2 Ω.", "f": "En parallelkobling er altid mindre end den mindste modstand.", "emne": "DC-kredse"}, {"valg": ["En lampe mellem L1 og N", "En 2-faset transformer mellem L2 og L3", "Et varmelegeme mellem L3 og N", "En stikkontakt mellem L2 og N"], "rigtig": 1, "q": "Hvilken last bidrager IKKE til strømmen i nullen?", "f": "En 2-faset last har ingen forbindelse til nul. Strømmen løber ud i den ene fase og tilbage i den anden.", "emne": "Usymmetrisk belastning med nul"}, {"valg": ["Fasen med mindst impedans", "Fasen med størst impedans", "Alle får 230 V", "L1"], "rigtig": 1, "q": "En usymmetrisk Y-last uden nul: hvilken fase får den højeste spænding?", "f": "Stjernepunktet trækkes mod den mindste impedans, så den største får mest spænding.", "emne": "Y-Δ-transformation og stjernelast uden nul"}, {"q": "Solen står 60° fra lodret. Hvad er AM?", "tal": 2.0, "tol": 0.01, "enhed": "", "losning": "AM = 1 / cos 60° = 1 / 0,5 = 2.", "f": "Lyset går gennem dobbelt så meget luft som ved lodret sol.", "emne": "Halvledere, dioder og solceller"}, {"q": "Samme spole fører 0,24 A. Hvor meget energi er der i magnetfeltet? (J)", "tal": 0.0576, "tol": 0.001, "enhed": "J", "losning": "W = ½ · L · I² = 0,5 · 2 · 0,24² = 0,0576 J.", "f": "Energien skal et sted hen ved udkobling: i en gnist eller i friløbsdioden og spolens modstand.", "emne": "Magnetfelt, håndregler og induktion"}, {"q": "En spole optager 1,25 A og 250 W ved 230 V. Hvad er effektfaktoren?", "tal": 0.87, "tol": 0.01, "enhed": "", "losning": "S = 230 · 1,25 = 287,5 VA. cos φ = 250 / 287,5 = 0,870.", "f": "λ = P / S.", "emne": "Vekselspænding, strøm og effekt (enfaset)"}, {"valg": ["Den samlede strøm fra nettet", "Den aktive effekt P og wattstrømmen", "Den reaktive effekt fra nettet", "Den tilsyneladende effekt"], "rigtig": 1, "q": "Hvilken størrelse er uændret, når du fasekompenserer en motor?", "f": "Konden  "f": "E = U − I_a · R − ΔU_b.", "emne": "DC-motoren"}, {"valg": ["Den halveres", "Den bliver en fjerdedel", "Den fordobles", "Den er uændret"], "rigtig": 1, "q": "Afstanden mellem de to ladninger fordobles. Hvad sker der med kraften?", "f": "F ∝ 1/r², så dobbelt afstand giver (1/2)² = 1/4.", "emne": "Kondensatoren"}, {"valg": ["At vende strømmen i ankerlederne, så momentet altid har samme retning", "At ensrette forsyningsspændingen", "At styre omdrejningstallet", "At ophæve ankerreaktionen"], "rigtig": 0, "q": "Hvad er kommutatorens opgave?", "f": "Når en leder går fra en nordpol til en sydpol, skal strømmen vende, ellers vender kraften.", "emne": "DC-motoren"}, {"q": "R = 100 Ω og C = 470 µF. Hvad er tidskonstanten? (ms)", "tal": 47.0, "tol": 0.5, "enhed": "ms", "losning": "τ = R · C = 100 · 470·10⁻⁶ = 0,047 s = 47 ms.", "f": "Efter 5τ = 235 ms er kondensatoren praktisk talt opladet.", "emne": "Kondensatoren"}, {"q": "P = 1.837 W og Q = 1.384 var. Hvad er S? (VA)", "tal": 2300.0, "tol": 5.0, "enhed": "VA", "losning": "S = √(1.837² + 1.384²) = 2.300 VA.", "f": "P og Q er kateter i effekttrekanten. S er hypotenusen.", "emne": "Vekselspænding, strøm og effekt (enfaset)"}, {"q": "Hvad er middelværdien af 230 V sinus (over en halv periode)? (V)", "tal": 207.0, "tol": 1.0, "enhed": "V", "losning": "U_mid = 2/π · 325,3 = 207,1 V.", "f": "Middelværdien er 0,637 af spidsværdien.", "emne": "Vekselspænding, strøm og effekt (enfaset)"}];

let gemt = {};
try { gemt = JSON.parse(localStorage.getItem(NOGLE) || "{}"); } catch (e) {}
const gem = () => { try { localStorage.setItem(NOGLE, JSON.stringify(gemt)); } catch (e) {} };
// Danske og engelske skrivemåder virker begge: "85.200", "85200", "1.150,5", "0,86", "0.86".
// Et enkelt punktum efterfulgt af tre cifre kan både være tusindtal og decimal, så begge tolkninger prøves.
const tolk = s => { s = String(s).replace(/[\s\u00a0]/g, "").replace("−", "-");
  if (!/^-?[\d.,]+$/.test(s)) return [];
  if (s.includes(",")) return [parseFloat(s.replace(/\./g, "").replace(",", "."))];
  if ((s.match(/\./g) || []).length > 1) return [parseFloat(s.replace(/\./g, ""))];
  const ud = [parseFloat(s)];
  if (/^-?\d+\.\d{3}$/.test(s)) ud.push(parseFloat(s.replace(".", "")));
  return ud; };
const fmt = x => x.toLocaleString("da-DK", { maximumFractionDigits: 4 });

function bygQuiz() {
  const rod = document.getElementById("quiz"); rod.innerHTML = "";
  QUIZ.forEach((s, i) => {
    const el = document.createElement("div"); el.className = "q";
    el.innerHTML = `<div class="nr">Spørgsmål ${i + 1} af ${QUIZ.length}${SAMLET ? `<span class="emnetag">${s.emne}</span>` : ""}</div><div class="tekst">${s.q}</div>`;
    const g = gemt[i];
    if (s.valg) {
      const v = document.createElement("div"); v.className = "valg";
      s.valg.forEach((t, j) => {
        const b = document.createElement("button"); b.innerHTML = t;
        b.addEventListener("click", () => { gemt[i] = { valgt: j, ok: j === s.rigtig }; gem(); bygQuiz(); });
        v.append(b);
      });
      el.append(v);
      if (g) {
        [...v.children].forEach((b, j) => { b.disabled = true; if (j === s.rigtig) b.classList.add("ok"); else if (j === g.valgt) b.classList.add("bad"); });
        el.insertAdjacentHTML("beforeend", `<div class="svar ${g.ok ? "ok" : "bad"}"><b>${g.ok ? "Rigtigt." : "Ikke helt."}</b>${s.f || ""}</div>`);
      }
    } else {
      const f = document.createElement("div"); f.className = "tal";
      f.innerHTML = `<input inputmode="decimal" aria-label="Dit svar" placeholder="Dit svar"> <span class="enhed">${s.enhed || ""}</span> <button class="knap">Tjek</button> <button class="knap stille">Vis facit</button>`;
      const [inp, , tjek, opgiv] = f.children;
      el.append(f);
      const faerdig = g && (g.ok || g.forsog >= 2 || g.opgivet);
      if (g && g.svar != null) inp.value = g.svar;
      if (faerdig) {
        inp.disabled = tjek.disabled = opgiv.disabled = true;
        el.insertAdjacentHTML("beforeend", `<div class="svar ${g.ok ? "ok" : "bad"}"><b>${g.ok ? "Rigtigt." : "Facit: " + fmt(s.tal) + " " + (s.enhed || "")}</b>${s.losning ? s.losning + "<br>" : ""}${s.f || ""}</div>`);
      } else if (g && g.forsog === 1) {
        el.insertAdjacentHTML("beforeend", `<div class="svar hint"><b>Ikke helt. Tjek din opstilling og prøv igen.</b>Du har ét forsøg tilbage.</div>`);
      }
      const svar = () => {
        const xs = tolk(inp.value); if (!xs.length || xs.some(isNaN)) { inp.focus(); return; }
        const ok = xs.some(x => Math.abs(x - s.tal) <= Math.max(s.tol, Math.abs(s.tal) * 1e-9));
        const forsog = ((g && g.forsog) || 0) + 1;
        gemt[i] = { svar: inp.value, ok, forsog }; gem(); bygQuiz();
      };
      tjek.addEventListener("click", svar);
      inp.addEventListener("keydown", e => { if (e.key === "Enter") svar(); });
      opgiv.addEventListener("click", () => { gemt[i] = { svar: inp.value, ok: false, forsog: 2, opgivet: true }; gem(); bygQuiz(); });
    }
    rod.append(el);
  });
  // score
  const faerdige = QUIZ.map((s, i) => gemt[i] && (s.valg || gemt[i].ok || gemt[i].forsog >= 2));
  const antal = faerdige.filter(Boolean).length, rigtige = QUIZ.filter((s, i) => gemt[i] && gemt[i].ok).length;
  const forkerte = QUIZ.map((s, i) => faerdige[i] && !gemt[i].ok ? `<li>${s.q.replace(/<[^>]+>/g, "")}${SAMLET ? ` <em>(${s.emne})</em>` : ""}</li>` : "").join("");
  document.getElementById("score").innerHTML = antal === 0 ? "" : `<div class="score">
    <h2>${rigtige} af ${QUIZ.length} rigtige${antal < QUIZ.length ? ` · ${QUIZ.length - antal} mangler` : ""}</h2>
    ${forkerte ? `<p>Tag med i repetitionen:</p><ul>${forkerte}</ul>` : antal === QUIZ.length ? "<p>Alle rigtige. Tag quizzen igen om et par uger.</p>" : ""}
    <button class="knap stille" id="nulstil">Start forfra</button></div>`;
  const n = document.getElementById("nulstil");
  if (n) n.addEventListener("click", () => { gemt = {}; gem(); bygQuiz(); window.scrollTo(0, document.getElementById("d-quiz").offsetTop - 70); });
}
if (QUIZ.length) bygQuiz();
</script>
</body>
</html>
