<script>
const QUIZ = [{"q": "En motor yder 1.000 kW med η = 0,45, og H_n = 42.700 kJ/kg. Hvad er brændstofforbruget? (kg/h)", "tal": 187.4, "tol": 1.0, "enhed": "kg/h", "losning": "Φ_b = 1.000 / 0,45 = 2.222 kW. ṁ = 2.222 / 42.700 = 0,05204 kg/s = 187,4 kg/h.", "f": "Del effekten med virkningsgraden, og så med brændværdien.", "emne": "Energi, effekt og virkningsgrad"}, {"q": "Hvad er den største mulige virkningsgrad for en varmemaskine mellem 400 °C og 40 °C? (%, 1 decimal)", "tal": 53.5, "tol": 0.3, "enhed": "%", "losning": "η = 1 − 313,15 / 673,15 = 1 − 0,4652 = 0,535 = 53,5 %.", "f": "Carnot med temperaturer i kelvin.", "emne": "Energi, effekt og virkningsgrad"}, {"valg": ["Modstanden stiger med temperaturen", "Modstanden falder, når temperaturen stiger", "Spændingen stiger med temperaturen", "Modstanden er konstant"], "rigtig": 1, "q": "Hvad betyder NTC?", "f": "Negative Temperature Coefficient. En PTC gør det modsatte.", "emne": "Termometre og temperaturmåling"}, {"q": "En stålstang på 3 m (E = 210.000 MPa) har σ = 140 MPa. Hvor meget forlænges den? (mm)", "tal": 2.0, "tol": 0.02, "enhed": "mm", "losning": "ε = 140 / 210.000 = 0,000667. ΔL = 0,000667 · 3.000 = 2,0 mm.", "f": "ΔL = σ · L₀ / E.", "emne": "Stivhed og materialelære"}, {"valg": ["Præcis, men ikke nøjagtig", "Nøjagtig, men ikke præcis", "Både præcis og nøjagtig", "Hverken præcis eller nøjagtig"], "rigtig": 0, "q": "Målinger ligger tæt samlet, men alle 2 °C ved siden af den sande værdi. Hvordan beskrives det?", "f": "Lille spredning (præcis), men en systematisk fejl (ikke nøjagtig).", "emne": "Måling og måleusikkerhed"}, {"valg": ["Energi kan hverken opstå eller forsvinde", "Varme strømmer af sig selv fra koldt til varmt", "To legemer, der hver er i termisk ligevægt med et tredje, er i ligevægt med hinanden", "Ved 0 K står alle molekyler helt stille"], "rigtig": 2, "q": "Hvad siger termodynamikkens 0. hovedsætning?", "f": "<ol start=\"0\">\n<li>hovedsætning er grundlaget for temperaturmåling: termometret kommer i ligevægt med det, det måler.<\/li>\n<\/ol>", "emne": "Temperatur og temperaturskalaer"}, {"valg": ["0 °C", "ca. 4 °C", "20 °C", "100 °C"], "rigtig": 1, "q": "Ved hvilken temperatur har vand den største massefylde?", "f": "Vands anomali. Is fylder ca. 9 % mere end vand.", "emne": "Varmeudvidelse"}, {"q": "Fire målinger: 20, 22, 21 og 21 °C. Hvad er middelværdien? (°C)", "tal": 21.0, "tol": 0.01, "enhed": "°C", "losning": "(20 + 22 + 21 + 21) / 4 = 84 / 4 = 21 °C.", "f": "Middelværdien er summen divideret med antallet.", "emne": "Måling og måleusikkerhed"}, {"q": "1 kg luft udvider sig ved konstant tryk 2 bar fra 0,4 til 0,6 m³. Hvor stort er arbejdet? (kJ)", "tal": 40.0, "tol": 0.5, "enhed": "kJ", "losning": "W = p · ΔV = 200.000 · 0,2 = 40.000 J = 40 kJ.", "f": "Isobar: arbejdet er et rektangel i pV-diagrammet.", "emne": "Idealgasloven og tilstandsændringer"}, {"q": "Luft i en lukket flaske på 20 bar(a) og 20 °C opvarmes til 80 °C. Hvad bliver trykket? (bar(a), 2 decimaler)", "tal": 24.09, "tol": 0.05, "enhed": "bar", "losning": "p₂ = 20 · 353,15 / 293,15 = 24,09 bar(a).", "f": "Isokor: p/T er konstant, og T skal i kelvin.", "emne": "Idealgasloven og tilstandsændringer"}, {"valg": ["Fordi metallerne ruster", "Fordi spændingen afhænger af forskellen mellem målestedet og tilslutningsstedet", "Fordi signalet er for stort", "Fordi termoelementet er ulineært"], "rigtig": 1, "q": "Hvorfor skal et termoelement have koldt loddested-kompensering?", "f": "Termospændingen er proportional med temperaturforskellen. Instrumentet skal lægge klemmetemperaturen til.", "emne": "Termometre og temperaturmåling"}, {"q": "Hvor meget energi skal der til at fordampe 2 kg vand ved 100 °C? (kJ)", "tal": 4514.0, "tol": 10.0, "enhed": "kJ", "losning": "Q = 2 · 2.257 = 4.514 kJ.", "f": "Fordampningsvarmen er stor sammenlignet med opvarmningen.", "emne": "Faseovergange og vanddamp"}, {"q": "Et manometer viser 6 bar. Hvad er det absolutte tryk ca.? (bar(a), 1 decimal)", "tal": 7.0, "tol": 0.05, "enhed": "bar", "losning": "p_abs = 6 + 1,013 = 7,0 bar(a).", "f": "Manometre viser overtryk.", "emne": "Tryk"}, {"q": "En dieselmotor har kompressionsforhold 16. Luften er 40 °C ved start. Hvad bliver temperaturen efter adiabatisk kompression? (°C, κ = 1,4)", "tal": 676.0, "tol": 5.0, "enhed": "°C", "losning": "T₂ = 313,15 · 16^0,4 = 313,15 · 3,031 = 949 K = 676 °C.", "f": "Husk at regne i kelvin og trække 273,15 fra til sidst.", "emne": "Idealgasloven og tilstandsændringer"}, {"q": "Hvad er 12.570 kJ i kWh? (2 decimaler)", "tal": 3.49, "tol": 0.02, "enhed": "kWh", "losning": "12.570 / 3.600 = 3,49 kWh.", "f": "1 kWh = 3.600 kJ.", "emne": "Varme og varmekapacitet"}, {"q": "Samme kraft på en aluminiumsstang og en stålstang med samme mål. Hvor mange gange mere strækker aluminium sig? (E_stål = 210, E_Al = 70 GPa)", "tal": 3.0, "tol": 0.05, "enhed": "", "losning": "210 / 70 = 3.", "f": "Tøjningen er omvendt proportional med E.", "emne": "Stivhed og materialelære"}, {"q": "En varmeveksler i modstrøm har Δt₁ = 30 K og Δt₂ = 10 K. Hvad er Δt_m? (K, 1 decimal)", "tal": 18.2, "tol": 0.2, "enhed": "K", "losning": "Δt_m = (30 − 10) / ln(30/10) = 20 / 1,0986 = 18,2 K.", "f": "Den logaritmiske middelværdi er altid lidt mindre end den aritmetiske (20 K).", "emne": "Varmetransmission"}, {"valg": ["Fordi det er billigt og koger ved 100 °C", "Fordi det har høj specifik varmekapacitet og kan optage meget varme pr. kg", "Fordi det leder strøm", "Fordi det udvider sig meget"], "rigtig": 1, "q": "Hvorfor er vand et godt kølemiddel?", "f": "4,19 kJ/(kg·K) er ca. ni gange mere end stål.", "emne": "Varme og varmekapacitet"}, {"q": "Et Pt100 måler 138,5 Ω. Hvad er temperaturen? (°C)", "tal": 100.0, "tol": 0.5, "enhed": "°C", "losning": "t = (138,5/100 − 1) / 0,00385 = 0,385 / 0,00385 = 100 °C.", "f": "Pt100 stiger 0,385 Ω pr. grad.", "emne": "Termometre og temperaturmåling"}, {"q": "En stang med tværsnit 100 mm² belastes med 20 kN. Hvad er spændingen? (MPa)", "tal": 200.0, "tol": 0.5, "enhed": "MPa", "losning": "σ = 20.000 N / 100 mm² = 200 N/mm² = 200 MPa.", "f": "N/mm² er det samme som MPa.", "emne": "Stivhed og materialelære"}, {"valg": ["Den tilførte varme", "Nettoarbejdet pr. cyklus", "Tabet", "Temperaturstigningen"], "rigtig": 1, "q": "Hvad viser arealet inden i en lukket kurve i et pV-diagram?", "f": "Ekspansionsarbejde minus kompressionsarbejde.", "emne": "Idealgasloven og tilstandsændringer"}, {"valg": ["0", "p · V", "m · c_v · Δt", "Det afhænger af trykket"], "rigtig": 0, "q": "Hvor stort er volumenændringsarbejdet i en isokor proces?", "f": "Volumen ændrer sig ikke, så der er intet areal under kurven.", "emne": "Idealgasloven og tilstandsændringer"}, {"valg": ["Trykket bliver 3^1,4 gange større", "Trykket bliver 3 gange større", "Trykket er uændret", "Temperaturen stiger"], "rigtig": 1, "q": "Hvad sker der i en isoterm kompression til en tredjedel af volumen?", "f": "p · V er konstant, når T er konstant.", "emne": "Idealgasloven og tilstandsændringer"}, {"q": "Hvor meget energi skal der til at varme 50 kg vand fra 10 °C til 70 °C? (kJ)", "tal": 12570.0, "tol": 20.0, "enhed": "kJ", "losning": "Q = 50 · 4,19 · 60 = 12.570 kJ.", "f": "Q = m · c · Δt.", "emne": "Varme og varmekapacitet"}, {"valg": ["For at gøre dem lettere", "Fordi den blanke overflade har lav emission og udstråler mindre varme", "For at lede varmen væk", "Fordi aluminium isolerer godt"], "rigtig": 1, "q": "Hvorfor beklæder man isolering på rør med blank aluminium?", "f": "Lav ε betyder lav udstråling. Aluminium beskytter også isoleringen mod olie og vand.", "emne": "Varmetransmission"}, {"q": "Hvor meget energi skal der til at smelte 5 kg is ved 0 °C? (kJ)", "tal": 1670.0, "tol": 5.0, "enhed": "kJ", "losning": "Q = 5 · 334 = 1.670 kJ.", "f": "Under smeltningen er temperaturen konstant 0 °C.", "emne": "Faseovergange og vanddamp"}, {"q": "Hvad er 20 °C i kelvin? (K, 2 decimaler)", "tal": 293.15, "tol": 0.01, "enhed": "K", "losning": "T = 20 + 273,15 = 293,15 K.", "f": "Læg // faner
const tabs = [...document.querySelectorAll("#tabs button")];
function vis(del) {
  if (!document.getElementById("d-" + del)) del = "noter";
  tabs.forEach(b => b.setAttribute("aria-selected", b.dataset.del === del));
  document.querySelectorAll(".del").forEach(s => s.hidden = s.id !== "d-" + del);
}
tabs.forEach(b => b.addEventListener("click", () => {
  vis(b.dataset.del);
  const u = new URL(location.href); u.searchParams.set("vis", b.dataset.del); history.replaceState(null, "", u);
  window.scrollTo(0, 0);
}));
// tomme dele skjules i fanerne
["noter", "formler"].forEach(d => { if (!document.getElementById("d-" + d).textContent.trim()) tabs.find(b => b.dataset.del === d).hidden = true; });
if (!QUIZ.length) tabs.find(b => b.dataset.del === "quiz").hidden = true;
if (SAMLET) { document.getElementById("tabs").hidden = true; vis("quiz"); }
else { const v = q.get("vis") || "noter", t = tabs.find(b => b.dataset.del === v && !b.hidden) || tabs.find(b => !b.hidden); vis(t ? t.dataset.del : "noter"); }

// tabeller kan scrolles på mobil
document.querySelectorAll(".del table").forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.before(w); w.append(t); });

// quiz
let gemt = {};
try { gemt = JSON.parse(localStorage.getItem(NOGLE) || "{}"); } catch (e) {}
const gem = () => { try { localStorage.setItem(NOGLE, JSON.stringify(gemt)); } catch (e) {} };
// Danske og engelske skrivemåder virker begge: "85.200", "85200", "1.150,5", "0,86", "0.86".
// Et enkelt punktum efterfulgt af tre cifre kan både være tusindtal og decimal, så begge tolkninger prøves.
const tolk = s => { s = String(s).replace(/[\s\u00a0]/g, "").replace("−", "-");
  if (!/^-?[\d.,]+$/.test(s)) return [];
  if (s.includes(",")) return [parseFloat(s.replace(/\./g, "").replace(",", "."))];
  if ((s.match(/\./g) || []).length > 1) return [parseFloat(s.replace(/\./g, ""))];
  const ud = [parseFloat(s)];
  if (/^-?\d+\.\d{3}$/.test(s)) ud.push(parseFloat(s.replace(".", "")));
  return ud; };
const fmt = x => x.toLocaleString("da-DK", { maximumFractionDigits: 4 });

function bygQuiz() {
  const rod = document.getElementById("quiz"); rod.innerHTML = "";
  QUIZ.forEach((s, i) => {
    const el = document.createElement("div"); el.className = "q";
    el.innerHTML = `<div class="nr">Spørgsmål ${i + 1} af ${QUIZ.length}${SAMLET ? `<span class="emnetag">${s.emne}</span>` : ""}</div><div class="tekst">${s.q}</div>`;
    const g = gemt[i];
    if (s.valg) {
      const v = document.createElement("div"); v.className = "valg";
      s.valg.forEach((t, j) => {
        const b = document.createElement("button"); b.innerHTML = t;
        b.addEventListener("click", () => { gemt[i] = { valgt: j, ok: j === s.rigtig }; gem(); bygQuiz(); });
        v.append(b);
      });
      el.append(v);
      if (g) {
        [...v.children].forEach((b, j) => { b.disabled = true; if (j === s.rigtig) b.classList.add("ok"); else if (j === g.valgt) b.classList.add("bad"); });
        el.insertAdjacentHTML("beforeend", `<div class="svar ${g.ok ? "ok" : "bad"}"><b>${g.ok ? "Rigtigt." : "Ikke helt."}</b>${s.f || ""}</div>`);
      }
    } else {
      const f = document.createElement("div"); f.className = "tal";
      f.innerHTML = `<input inputmode="decimal" aria-label="Dit svar" placeholder="Dit svar"> <span class="enhed">${s.enhed || ""}</span> <button class="knap">Tjek</button> <button class="knap stille">Vis facit</button>`;
      const [inp, , tjek, opgiv] = f.children;
      el.append(f);
      const faerdig = g && (g.ok || g.forsog >= 2 || g.opgivet);
      if (g && g.svar != null) inp.value = g.svar;
      if (faerdig) {
        inp.disabled = tjek.disabled = opgiv.disabled = true;
        el.insertAdjacentHTML("beforeend", `<div class="svar ${g.ok ? "ok" : "bad"}"><b>${g.ok ? "Rigtigt." : "Facit: " + fmt(s.tal) + " " + (s.enhed || "")}</b>${s.losning ? s.losning + "<br>" : ""}${s.f || ""}</div>`);
      } else if (g && g.forsog === 1) {
        el.insertAdjacentHTML("beforeend", `<div class="svar hint"><b>Ikke helt. Tjek din opstilling og prøv igen.</b>Du har ét forsøg tilbage.</div>`);
      }
      const svar = () => {
        const xs = tolk(inp.value); if (!xs.length || xs.some(isNaN)) { inp.focus(); return; }
        const ok = xs.some(x => Math.abs(x - s.tal) <= Math.max(s.tol, Math.abs(s.tal) * 1e-9));
        const forsog = ((g && g.forsog) || 0) + 1;
        gemt[i] = { svar: inp.value, ok, forsog }; gem(); bygQuiz();
      };
      tjek.addEventListener("click", svar);
      inp.addEventListener("keydown", e => { if (e.key === "Enter") svar(); });
      opgiv.addEventListener("click", () => { gemt[i] = { svar: inp.value, ok: false, forsog: 2, opgivet: true }; gem(); bygQuiz(); });
    }
    rod.append(el);
  });
  // score
  const faerdige = QUIZ.map((s, i) => gemt[i] && (s.valg || gemt[i].ok || gemt[i].forsog >= 2));
  const antal = faerdige.filter(Boolean).length, rigtige = QUIZ.filter((s, i) => gemt[i] && gemt[i].ok).length;
  const forkerte = QUIZ.map((s, i) => faerdige[i] && !gemt[i].ok ? `<li>${s.q.replace(/<[^>]+>/g, "")}${SAMLET ? ` <em>(${s.emne})</em>` : ""}</li>` : "").join("");
  document.getElementById("score").innerHTML = antal === 0 ? "" : `<div class="score">
    <h2>${rigtige} af ${QUIZ.length} rigtige${antal < QUIZ.length ? ` · ${QUIZ.length - antal} mangler` : ""}</h2>
    ${forkerte ? `<p>Tag med i repetitionen:</p><ul>${forkerte}</ul>` : antal === QUIZ.length ? "<p>Alle rigtige. Tag quizzen igen om et par uger.</p>" : ""}
    <button class="knap stille" id="nulstil">Start forfra</button></div>`;
  const n = document.getElementById("nulstil");
  if (n) n.addEventListener("click", () => { gemt = {}; gem(); bygQuiz(); window.scrollTo(0, document.getElementById("d-quiz").offsetTop - 70); });
}
if (QUIZ.length) bygQuiz();
</script>
</body>
</html>
