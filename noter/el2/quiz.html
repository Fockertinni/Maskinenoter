<script>
const QUIZ = [{"valg": ["En lille reaktiv strøm", "Effektpendling", "Kortslutning", "Ingenting, AVR'en retter det"], "rigtig": 2, "q": "Hvad giver indkobling med forkert fasefølge?", "f": "Derfor tjekkes fasefølgen ved nyopstilling og efter ændringer.", "emne": "Synkronisering og paralleldrift"}, {"q": "En 1.000 kVA, 400 V transformer har e_k = 6 %. Hvad er I_k3? (kA, 1 decimal)", "tal": 24.1, "tol": 0.1, "enhed": "kA", "losning": "I_N = 1.000.000 / (√3 · 400) = 1.443 A. I_k3 = 1.443 · 100 / 6 = 24.060 A = 24,1 kA.", "f": "Tavlen skal være kortslutningsfast for mindst denne strøm.", "emne": "Kortslutning og koblingsciffer"}, {"valg": ["For at måle frekvensen", "Fordi inrush-strøm er rig på 2. harmoniske og ellers ville give fejludløsning", "For at undgå 3. harmoniske i nettet", "Fordi kortslutningsstrømme kun har 2. harmoniske"], "rigtig": 1, "q": "Hvorfor blokerer et differentialrelæ på 2. harmoniske?", "f": "En ægte indre fejl har næsten ingen 2. harmoniske, inrush har mange.", "emne": "Kortslutning og koblingsciffer"}, {"valg": ["En fuld kortslutning gennem isolationen", "En lille udladning, der kun delvist bryder isolationen igennem", "En jordfejl i et IT-net", "En udladning af en kondensator"], "rigtig": 1, "q": "Hvad er en partiel udladning?", "f": "PD nedbryder isolationen gradvist og ender i et gennemslag.", "emne": "Tilstandsbaseret vedligehold"}, {"q": "Hvad er virkningsgraden ved fuld last og cos φ = 1 for samme transformer (2 kVA)? (%, 1 decimal)", "tal": 94.3, "tol": 0.1, "enhed": "%", "losning": "η = 2.000 / (2.000 + 40 + 80) = 0,943 = 94,3 %.", "f": "Ved fuld last er x = 1, så kobbertabet er hele P_k.", "emne": "Transformer"}, {"valg": ["Beskyttelse mod støv", "Beskyttelse mod vand", "Mekanisk slagstyrke", "Isolationsklasse"], "rigtig": 1, "q": "Hvad betyder 2. ciffer i IP55?", "f": "<ol>\n<li>ciffer er faste genstande og støv, 2. ciffer er vand.<\/li>\n<\/ol>", "emne": "Jording, målebroer og fordelingssystemer"}, {"valg": ["Overstrømsrelæet", "Bakeffektrelæet", "Underfrekvensrelæet", "Differentialrelæet"], "rigtig": 1, "q": "Hvilket relæ udløser, hvis generatoren udkobles under negativ P?", "f": "Negativ P betyder motordrift, hvor nettet driver generatoren.", "emne": "Synkronisering og paralleldrift"}, {"valg": ["De deler lasten ligeligt", "Transformeren med 4 % tager mest last", "Transformeren med 6 % tager mest last", "Der løber en cirkulationsstrøm i tomgang"], "rigtig": 1, "q": "To transformere i paralleldrift har e_k = 4 % og 6 %. Hvad sker der?", "f": "Den med lavest impedans (e_k) tager mest. Cirkulationsstrøm i tomgang skyldes forskelligt omsætningsforhold.", "emne": "Kortslutning og koblingsciffer"}, {"valg": ["Den største 3-fasede ved transformeren", "Den mindste, ofte 1-faset i enden af kablet", "Stødstrømmen", "Inrush-strømmen"], "rigtig": 1, "q": "Hvilken kortslutningsstrøm bestemmer, om sikringen når at udløse?", "f": "Den største bestemmer kortslutningsfastheden, den mindste bestemmer udløsningen.", "emne": "Kortslutning og koblingsciffer"}, {"valg": ["Kortslutte sekundæren", "Åbne sekundærkredsen", "Jorde den ene sekundærklemme", "Koble flere strømspoler i serie"], "rigtig": 1, "q": "Hvad må du aldrig gøre med en strømtransformer i drift?", "f": "Åben sekundær giver farlig højspænding og overophedning. Kortslut den først.", "emne": "Transformer"}, {"q": "En Wheatstone-bro er i balance med R_2 = 100 Ω, R_3 = 470 Ω og R_4 = 200 Ω. Hvad er R_x? (Ω)", "tal": 235.0, "tol": 0.5, "enhed": "Ω", "losning": "R_x = R_2 · R_3 / R_4 = 100 · 470 / 200 = 235 Ω.", "f": "Ved balance er der ingen strøm i nulinstrumentet.", "emne": "Jording, målebroer og fordelingssystemer"}, {"q": "Samme Q_C leveres af et Y-koblet batteri på 3 × 400 V. Hvad er C pr. fase? (µF, 1 decimal)", "tal": 20.2, "tol": 0.3, "enhed": "µF", "losning": "C_Y = Q_C / (3 · ω · U_f²) = 1.009 / (3 · 314,16 · 230²) = 20,2 µF.", "f": "I Δ ville det kun kræve en tredjedel, ca. 6,7 µF.", "emne": "Asynkronmotor"}, {"q": "En 4-polet generator kører 1.440 o/min. Hvilken frekvens giver den? (Hz)", "tal": 48.0, "tol": 0.1, "enhed": "Hz", "losning": "f = p · n / 60 = 2 · 1.440 / 60 = 48 Hz.", "f": "Frekvensen følger omdrejningstallet direkte.", "emne": "Synkrongenerator"}, {"valg": ["0, 4 og 8", "7, og 1 og 5 ved at bytte to faser på begge sider", "Kun 11", "Alle ulige cifre"], "rigtig": 1, "q": "Hvilke koblingscifre kan parallelkobles med en Dyn11 ved at ombytte klemmer?", "f": "11 er i gruppe IV (7, 11), som kan kobles med gruppe III (1, 5).", "emne": "Kortslutning og koblingsciffer"}, {"valg": ["50", "65", "80", "100"], "rigtig": 2, "q": "Hvad er den mindste anbefalede farvegengivelse (Ra) på en arbejdsplads?", "f": "Ra ≥ 80.", "emne": "Lysteknik"}, {"valg": ["Ved at bytte fase og nul i stikket", "Ved at bytte tilledningerne på enten hoved- eller hjælpeviklingen", "Ved at fjerne kondensatoren", "Det kan ikke lade sig gøre"], "rigtig": 1, "q": "Hvordan vender du omdrejningsretningen på en 1-faset kondensatormotor?", "f": "Det er faseforskydningen mellem de to viklinger, der bestemmer retningen.", "emne": "Asynkronmotor"}, {"valg": ["Et højere omdrejningstal end synkront", "Reaktiv effekt til magnetiseringen", "En dæmpervikling", "Børster"], "rigtig": 1, "q": "Hvad har en asynkrongenerator brug for, som en synkrongenerator laver selv?", "f": "Den trækker Q fra nettet eller fra kondensatorer i ø-drift. Den skal også køre over synkron hastighed, men det er driften, ikke en mangel.", "emne": "Synkrongenerator"}, {"valg": ["Den bestemmer frekvensen", "Uden den kan en selvmagnetiseret generator ikke bygge spænding op", "Den beskytter mod kortslutning", "Den sænker THDu"], "rigtig": 1, "q": "Hvorfor er remanent spænding vigtig?", "f": "Mister generatoren remanensen, skal feltet \"flashes\" med DC.", "emne": "Synkrongenerator"}, {"q": "En generator har 5 % frekvensstatik og 52,5 Hz i tomgang. Hvad er frekvensen ved fuld last? (Hz)", "tal": 50.0, "tol": 0.05, "enhed": "Hz", "losning": "5 % af 50 Hz = 2,5 Hz. 52,5 − 2,5 = 50 Hz.", "f": "Statikken regnes i forhold til nominel frekvens.", "emne": "Synkronisering og paralleldrift"}, {"valg": ["Den kan køre direkte på nettet", "Ingen rotortab og derfor højere virkningsgrad", "Højere effektfaktor", "Den har permanente magneter"], "rigtig": 1, "q": "Hvad er reluktansmotorens fordel i forhold til asynkronmotoren?", "f": "Rotoren har hverken vikling eller magneter og kører synkront uden slip.", "emne": "Frekvensomformer"}, {"q": "En 2 kVA transformer på 400 V. Hvad er I_N? (A, 2 decimaler)", "tal": 2.89, "tol": 0.01, "enhed": "A", "losning": "I_N = S_N / (√3 · U_N) = 2.000 / (√3 · 400) = 2,89 A.", "f": "Brug altid √3 og netspændingen ved 3-faset.", "emne": "Transformer"}, {"q": "En 4-polet motor kører 1.440 o/min på 50 Hz. Hvad er slippet? (%)", "tal": 4.0, "tol": 0.05, "enhed": "%", "losning": "n_1 = 1.500 o/min. s = (1.500 − 1.440) / 1.500 = 0,04 = 4 %.", "f": "Slip regnes i forhold til den synkrone hastighed.", "emne": "Asynkronmotor"}, {"valg": ["Fordi generatoren laver flere harmoniske end nettet i land", "Fordi nettets impedans er stor, så de harmoniske strømme giver store spændingsfald", "Fordi skibe kører 60 Hz", "Fordi der er flere LED-lamper"], "rigtig": 1, "q": "Hvorfor er THDu størst på et skib i ø-drift på én generator?", "f": "U_h = I_h · h · X_net. Et svagt net har stor X_net.", "emne": "Frekvensomformer"}, {"valg": ["Den bliver √3 gange mindre", "Den bliver 3 gange mindre", "Den er uændret", "Den bliver 3 gange større"], "rigtig": 1, "q": "Samme tre modstande kobles i stjerne i stedet. Hvad sker der med effekten?", "f": "Hver modstand får 230 V i stedet for 400 V, og effekten følger U²: (1/√3)² = 1/3.", "emne": "Trefaset belastning"}, {"valg": ["S (tilsyneladende effekt)", "P (aktiv effekt)", "Q (reaktiv effekt)", "Magnetiseringsstrømmen"], "rigtig": 1, "q": "Hvad skal drivmaskinen dimensioneres efter?", "f": "Generatoren dimensioneres efter S (strøm og opvarmning), drivmaskinen efter P.", "emne": "Synkrongenerator"}, {"valg": ["Fordi det giver point i rapporten", "Fordi flere dele af udstyret ikke er beskyttet mod overbelastning og kortslutning", "Fordi RCD'en ellers udløser", "Fordi tangamperemeteret ikke kan måle over 1 A"], "rigtig": 1, "q": "Hvorfor skal du beregne max-strømme i forberedelsen til en øvelse?", "f": "Generatorens magnetisering, DC-generatorerne og øvelsestransformeren har ingen værn, der stopper dig.", "emne": "Faget, laboratoriet og rapporter"}, {"valg": ["Den giver hovedpine", "Roterende maskiner kan se ud, som om de står stille", "Den overbelaster nullen", "Den ødelægger lysstofrørene"], "rigtig": 1, "q": "Hvorfor er stroboskopeffekt farlig i et maskinrum?", "f": "Lys, der flimrer med 100 Hz, kan \"fryse\" en aksel, der drejer med et multiplum af frekvensen.", "emne": "Lysteknik"}, {"q": "En motor afgiver 1.500 W ved 1.440 o/min. Hvad er momentet? (Nm, 1 decimal)", "tal": 9.9, "tol": 0.1, "enhed": "Nm", "losning": "M = 9,55 · P_2 / n = 9,55 · 1.500 / 1.440 = 9,95 Nm.", "f": "9,55 = 60 / (2π).", "emne": "Asynkronmotor"}, {"valg": ["TN-S", "TT", "IT", "TN-C"], "rigtig": 2, "q": "Hvilket fordelingssystem bruges typisk om bord på skibe?", "f": "IT-nettet kan fortsætte driften ved første jordfejl, og IMD'en alarmerer.", "emne": "Jording, målebroer og fordelingssystemer"}, {"q": "Ved 55/60/65 % måles 41,0 / 41,6 / 42,5 Ω. Er 3 %-kravet opfyldt? Angiv afvigelsen. (%, 1 decimal)", "tal": 3.7, "tol": 0.1, "enhed": "%", "losning": "(42,5 − 41,0) / 41,0 · 100 % = 3,7 %. Kravet er ikke opfyldt, så afstanden a fordobles.", "f": "Afvigelsen regnes i forhold til den mindste værdi.", "emne": "Jording, målebroer og fordelingssystemer"}, {"valg": ["1-wattmetermetoden", "2-wattmetermetoden (Aron)", "3-wattmetermetoden med N", "Ingen af dem"], "rigtig": 1, "q": "Hvilken wattmetermetode må du bruge på en usymmetrisk last i et 3-ledernet uden nul?", "f": "Aron virker for vilkårlig last, fordi I1 + I2 + I3 = 0 i et 3-ledernet.", "emne": "Trefaset belastning"}, {"valg": ["Halv startstrøm og fuldt startmoment", "⅓ startstrøm og ⅓ startmoment", "⅓ startstrøm og fuldt startmoment", "√3 lavere strøm og uændret moment"], "rigtig": 1, "q": "Hvad giver stjerne-trekantstart i forhold til direkte start?", "f": "Viklingen får 1/√3 af spændingen, og strøm og moment i nettet falder begge til en tredjedel.", "emne": "Asynkronmotor"}, {"q": "Samme lampe. Hvad er E på bordet 1,5 m til siden? (lx)", "tal": 128.0, "tol": 1.0, "enhed": "lx", "losning": "r = √(2² + 1,5²) = 2,5 m, cos α = 2 / 2,5 = 0,8. E = 1.000 · 0,8³ / 2² = 1.000 · 0,512 / 4 = 128 lx.", "f": "E falder både fordi afstanden vokser, og fordi lyset rammer skråt.", "emne": "Lysteknik"}, {"valg": ["Den tager mere P", "Den leverer mere Q og bliver overmagnetiseret", "Frekvensen stiger", "Den går i motordrift"], "rigtig": 1, "q": "Hvad sker der, når du øger magnetiseringen på en generator i paralleldrift?", "f": "Magnetiseringen styrer Q. I ø-drift ville spændingen stige i stedet.", "emne": "Synkronisering og paralleldrift"}, {"valg": ["Resistiv", "Induktiv", "Kapacitiv", "Det er ens for alle"], "rigtig": 1, "q": "Hvilken last giver det største spændingsfald ved konstant magnetisering?", "f": "Ankerfeltet modvirker hovedfeltet næsten direkte ved induktiv last.", "emne": "Synkrongenerator"}, {"q": "Ved kortslutningsforsøget skal der 20 V til for at drive I_N gennem en 400 V transformer. Hvad er e_k? (%)", "tal": 5.0, "tol": 0.05, "enhed": "%", "losning": "e_k = 20 / 400 · 100 % = 5 %.", "f": "e_k bestemmer også kortslutningsstrømmen: I_k3 = 20 · I_N.", "emne": "Transformer"}, {"valg": ["Skinnen er overdimensioneret", "Lav emissivitet, så kameraet ser reflekteret stråling", "Der løber ingen strøm", "Kameraet er defekt"], "rigtig": 1, "q": "En blank kobberskinne viser lav temperatur på IR-kameraet. Hvad er den mest sandsynlige forklaring?", "f": "Mål på tape, maling eller isolering, eller indstil emissiviteten.", "emne": "Tilstandsbaseret vedligehold"}, {"valg": ["Trykker nødstop og går i gang", "Skruer til 0 V og måler, at spændingen er væk", "Fjerner PE-ledningen først", "Beder underviseren slå RCD'en fra"], "rigtig": 1, "q": "Hvad gør du, før du ændrer en opstilling, der forsynes fra en variotransformer?", "f": "Tilslutning, ændring og nedtagning må kun ske i spændingsløs tilstand, og det skal måles.", "emne": "Faget, laboratoriet og rapporter"}, {"q": "Hvad er rotorfrekvensen i samme motor? (Hz)", "tal": 2.0, "tol": 0.05, "enhed": "Hz", "losning": "f_2 = s · f_1 = 0,04 · 50 = 2 Hz.", "f": "Rotorfrekvensen er lav i drift og 50 Hz ved start.", "emne": "Asynkronmotor"}, {"q": "En generator har 6 poler. Hvilket omdrejningstal giver 50 Hz? (o/min)", "tal": 1000.0, "tol": 1.0, "enhed": "o/min", "losning": "p = 3 polpar. n = 60 · f / p = 60 · 50 / 3 = 1.000 o/min.", "f": "Husk at p er polpar, ikke poler.", "emne": "Synkrongenerator"}, {"q": "Hvad er I_k2 for samme transformer? (A, 1 decimal)", "tal": 50.0, "tol": 0.3, "enhed": "A", "losning": "I_k2 = 0,866 · 57,7 = 50,0 A.", "f": "Den 2-fasede strøm er altid √3/2 af den 3-fasede ved stiv forsyning.", "emne": "Kortslutning og koblingsciffer"}, {"valg": ["På 24 V styrestrøm", "På 230 V belysning", "På højspændingsgeneratorer, -motorer og -kabler (3,3–11 kV)", "På batterier"], "rigtig": 2, "q": "Hvor er PD-måling mest relevant om bord?", "f": "PD kræver høj feltstyrke i isolationen.", "emne": "Tilstandsbaseret vedligehold"}, {"q": "En symmetrisk trekantlast har 320 Ω i hver gren på et 400 V-net. Hvad er den samlede effekt? (W)", "tal": 1500.0, "tol": 5.0, "enhed": "W", "losning": "Hver gren får 400 V: P_gren = 400² / 320 = 500 W. P = 3 · 500 = 1.500 W.", "f": "I Δ ligger netspændingen direkte over hver impedans.", "emne": "Trefaset belastning"}, {"valg": ["Den falder kraftigt", "Den er uændret", "Den stiger, begrænset af mætning", "Den bliver nul"], "rigtig": 2, "q": "Hvad sker der med klemspændingen ved kapacitiv last og konstant I_m?", "f": "Ankerfeltet understøtter hovedfeltet.", "emne": "Synkrongenerator"}, {"valg": ["Fasen med mindst impedans", "Fasen med størst impedans", "Alle får 230 V", "Den fase, der er sluttet til L1"], "rigtig": 1, "q": "En usymmetrisk Y-last kører uden nul. Hvilken fase får den højeste spænding?", "f": "Stjernepunktet trækkes mod den fase, der har mindst impedans, så den store impedans får mest spænding.", "emne": "Trefaset belastning"}, {"q": "Frekvensomformeren optager 1.000 W og afgiver 960 W. Motoren giver 3,8 Nm ved 1.500 o/min. Hvad er den samlede virkningsgrad? (%, hele tal)", "tal": 60.0, "tol": 1.0, "enhed": "%", "losning": "P_2 = 3,8 · 2π · 1.500 / 60 = 597 W. η_samlet = 597 / 1.000 = 0,60 = 60 %. (η_FO = 0,96, η_motor = 0,62.)", "f": "η_samlet = η_FO · η_motor.", "emne": "Frekvensomformer"}, {"q": "e_r = 4 % og e_x = 3 %. Hvor stort er det procentvise spændingsfald ved fuld last og cos φ = 0,8 induktiv? (%)", "tal": 5.0, "tol": 0.05, "enhed": "%", "losning": "ε = 1 · (4 · 0,8 + 3 · 0,6) = 3,2 + 1,8 = 5,0 %.", "f": "sin φ = 0,6, når cos φ = 0,8.", "emne": "Transformer"}, {"q": "En resistiv strøm på 2,17 A og en induktiv strøm på 2,30 A løber i samme linje. Hvad er linjestrømmen? (A, 2 decimaler)", "tal": 3.16, "tol": 0.02, "enhed": "A", "losning": "I = √(2,17² + 2,30²) = √(4,71 + 5,29) = √10,0 = 3,16 A.", "f": "Strømmene står 90° på hinanden, så de lægges sammen vektorielt.", "emne": "Trefaset belastning"}, {"valg": ["Den subtransiente", "Den transiente", "Den stationære", "Nominel strøm"], "rigtig": 0, "q": "Hvilken kortslutningsstrøm dimensioneres afbrydere efter?", "f": "Den subtransiente strøm i de første perioder er størst.", "emne": "Synkronisering og paralleldrift"}, {"q": "P_0 = 40 W og P_k = 80 W. Ved hvilken belastningsgrad x er virkningsgraden størst? (2 decimaler)", "tal": 0.71, "tol": 0.01, "enhed": "", "losning": "x = √(P_0 / P_k) = √0,5 = 0,71.", "f": "Her er kobbertabet x² · P_k lig med jerntabet.", "emne": "Transformer"}, {"valg": ["IMD'en alarmerer igen, intet andet", "Der opstår en fase-fase-kortslutning gennem skroget", "Spændingen falder til 230 V", "RCD'en udløser altid"], "rigtig": 1, "q": "Hvad sker der ved en anden jordfejl på en anden fase i et IT-net?", "f": "Derfor skal første fejl findes hurtigt.", "emne": "Jording, målebroer og fordelingssystemer"}, {"valg": ["Fordi kameraet ellers ikke virker", "Fordi opvarmningen stiger med I², så fejl ved lav last er svære at se", "Fordi tavlen ellers er spændingsløs", "Fordi emissiviteten ændrer sig med lasten"], "rigtig": 1, "q": "Hvorfor bør termografering ske over ca. 40 % last?", "f": "En dårlig forbindelse afsætter I²R, som vokser kraftigt med strømmen.", "emne": "Tilstandsbaseret vedligehold"}, {"valg": ["Fordi den har flest vindinger", "Fordi det er lettere at isolere HS-viklingen, når den ligger yderst", "Fordi den skal køles af olien", "Det er tilfældigt"], "rigtig": 1, "q": "Hvorfor ligger LS-viklingen inderst på kernen?", "f": "Den høje spænding holdes længst væk fra den jordede kerne.", "emne": "Transformer"}, {"valg": ["Kun temperaturen", "Normalfoto, last, ΔT, vurdering af alvoren og anbefalet handling", "Kameraets serienummer", "Tavlens IP-klasse"], "rigtig": 1, "q": "Hvad skal en termograferingsrapport indeholde ud over IR-billedet?", "f": "Uden lasten og ΔT kan man ikke vurdere alvoren.", "emne": "Tilstandsbaseret vedligehold"}, {"valg": ["Wattmeteret er koblet forkert", "cos φ er under 0,5", "Lasten er kapacitiv", "Der er en jordfejl"], "rigtig": 1, "q": "Ved symmetrisk last viser det ene wattmeter i Aron-koblingen negativt. Hvad betyder det?", "f": "W_a = U·I·cos(30° + φ) bliver negativ, når φ &gt; 60°. Visningen skal tælles med fortegn.", "emne": "Trefaset belastning"}, {"q": "En styret 6-puls bro på 400 V har tændvinklen α = 60°. Hvad er U_d? (V)", "tal": 270.0, "tol": 1.0, "enhed": "V", "losning": "U_d = 1,35 · 400 · cos 60° = 1,35 · 400 · 0,5 = 270 V.", "f": "Ved α &gt; 90° bliver U_d negativ, og broen vekselretter.", "emne": "Frekvensomformer"}, {"q": "Strømmen har I_5 = 20 %, I_7 = 14 %, I_11 = 9 % og I_13 = 7 % af grundtonen. Hvad er THDi? (%, 1 decimal)", "tal": 26.9, "tol": 0.2, "enhed": "%", "losning": "THDi = √(20² + 14² + 9² + 7²) = √(400 + 196 + 81 + 49) = √726 = 26,9 %.", "f": "De harmoniske lægges sammen kvadratisk.", "emne": "Frekvensomformer"}, {"q": "Luftgabseffekten er 1.700 W og slippet 4 %. Hvad er rotorkobbertabet? (W)", "tal": 68.0, "tol": 1.0, "enhed": "W", "losning": "P_Cu2 = s · P_δ = 0,04 · 1.700 = 68 W.", "f": "Jo større slip, jo større rotortab.", "emne": "Asynkronmotor"}, {"valg": ["Frekvensen stiger tydeligt", "Generatoren tager mere aktiv effekt, frekvensen ændres næsten ikke", "Generatoren leverer mere reaktiv effekt", "Spændingen stiger"], "rigtig": 1, "q": "Hvad sker der, når du øger governorens setpunkt på en generator i paralleldrift med et stort net?", "f": "Nettet holder frekvensen. Mere drivmoment giver større lastvinkel og mere P.", "emne": "Synkronisering og paralleldrift"}, {"q": "En spole skal have X_L = 100 Ω ved 50 Hz. Hvad er L? (H, 3 decimaler)", "tal": 0.318, "tol": 0.002, "enhed": "H", "losning": "L = X_L / (2πf) = 100 / 314,16 = 0,318 H.", "f": "X_L = 2πfL.", "emne": "Trefaset belastning"}, {"q": "En pumpe køres 20 % langsommere med frekvensomformer. Hvor stor bliver effekten i forhold til før? (%, hele tal)", "tal": 51.0, "tol": 1.0, "enhed": "%", "losning": "P ∝ n³: 0,8³ = 0,512 = 51 %.", "f": "Derfor sparer frekvensomformere meget energi på pumper og blæsere.", "emne": "Frekvensomformer"}, {"valg": ["Mod generatoren", "Mod nettet", "Det er ligegyldigt", "Op ad"], "rigtig": 1, "q": "Hvordan skal tangamperemeterets pil vende, når du måler på en generator, der leverer til nettet?", "f": "Pilen skal pege mod forbrugeren, og for en generator er nettet forbrugeren. Så bliver P positiv ved levering.", "emne": "Faget, laboratoriet og rapporter"}, {"valg": ["Type AC", "Type A", "Type B", "Ingen, der er kun sikringer"], "rigtig": 2, "q": "Hvilken type RCD sidder foran prøvestandene i stærkstrømslaboratoriet?", "f": "Type B registrerer også glat DC-fejlstrøm, som kan opstå efter frekvensomformere og ensrettere.", "emne": "Faget, laboratoriet og rapporter"}, {"valg": ["Det falder 10 %", "Det falder ca. 19 %", "Det er uændret", "Det stiger"], "rigtig": 1, "q": "Spændingen falder 10 %. Hvad sker der med motorens moment?", "f": "M ∝ U², og 0,9² = 0,81.", "emne": "Asynkronmotor"}, {"valg": ["0 A", "Summen af de tre strømme som tal", "Nulstrømmen", "√3 gange fasestrømmen"], "rigtig": 0, "q": "Du sætter tang om L1, L2 og L3 i et 3-ledernet. Hvad viser den?", "f": "Kirchhoffs 1. lov: uden nul skal den samlede strøm ind være nul.", "emne": "Trefaset belastning"}, {"q": "En lampe med I = 1.000 cd hænger 2 m over bordet. Hvad er E lige under lampen? (lx)", "tal": 250.0, "tol": 1.0, "enhed": "lx", "losning": "E = I / h² = 1.000 / 2² = 250 lx.", "f": "Afstandskvadratloven.", "emne": "Lysteknik"}, {"valg": ["2., 4., 6. …", "3., 9., 15. …", "5., 7., 11., 13. …", "Alle ulige"], "rigtig": 2, "q": "Hvilke harmoniske giver en 6-puls ensretter?", "f": "h = 6k ± 1.", "emne": "Frekvensomformer"}, {"valg": ["Lab 1", "Lab 2", "Lab 3", "Lab 7"], "rigtig": 2, "q": "Hvilken labøvelse skal rapporteres på engelsk?", "f": "Lab 3 (asynkronmotoren) skrives på engelsk, max 2 sider.", "emne": "Faget, laboratoriet og rapporter"}, {"valg": ["Momentet stiger", "Spændingen kan ikke stige mere, så fluxen og momentet falder (feltsvækning)", "Motoren mætter", "Slippet bliver negativt"], "rigtig": 1, "q": "Hvad sker der over 50 Hz ved U/f-styring?", "f": "Mellemkredsspændingen begrænser udgangsspændingen.", "emne": "Frekvensomformer"}, {"valg": ["Fordi den glemmer √3", "Fordi den lægger tallene sammen uden at tage hensyn til vinklen mellem strøm og impedans", "Fordi Z ikke kan måles", "Fordi den kun gælder for DC"], "rigtig": 1, "q": "Hvorfor er ΔU = I · Z den forkerte metode?", "f": "Kun den del af I·Z, der ligger i retning af U, ændrer spændingens størrelse.", "emne": "Transformer"}, {"valg": ["Udskift efter et fast antal driftstimer", "Grib ind, når målinger viser en udvikling", "Reparér, når det går i stykker", "Udskift alt ved hvert værftsophold"], "rigtig": 1, "q": "Hvilken strategi er tilstandsbaseret vedligehold?", "f": "CBM bygger på målinger af den faktiske tilstand.", "emne": "Tilstandsbaseret vedligehold"}, {"q": "En 2 kVA transformer på 400 V har e_k = 5 %. Hvad er I_k3 på sekundærsiden? (A, 1 decimal)", "tal": 57.7, "tol": 0.3, "enhed": "A", "losning": "I_N = 2.000 / (√3 · 400) = 2,887 A. I_k3 = 2,887 · 100 / 5 = 57,7 A.", "f": "Med e_k = 5 % bliver kortslutningsstrømmen 20 gange I_N.", "emne": "Kortslutning og koblingsciffer"}, {"q": "En spole måles til 50 V, 2 A og 40 W. Hvad er X_L? (Ω, 1 decimal)", "tal": 22.9, "tol": 0.1, "enhed": "Ω", "losning": "Z = 25 Ω, R = 40 / 4 = 10 Ω, X_L = √(625 − 100) = 22,9 Ω.", "f": "Wattmeteret måler kun effekten i R.", "emne": "Jording, målebroer og fordelingssystemer"}, {"valg": ["Lumen", "Candela", "Lux", "cd/m²"], "rigtig": 2, "q": "Hvilken enhed har belysningsstyrke?", "f": "Lux er lumen pr. kvadratmeter, altså hvor meget lys der rammer en flade.", "emne": "Lysteknik"}, {"q": "Hvor mange grader ligger sekundærspændingen efter primærspændingen i en Dyn5?", "tal": 150.0, "tol": 0.5, "enhed": "°", "losning": "5 · 30° = 150° bagud.", "f": "Hvert ciffer er 30°.", "emne": "Kortslutning og koblingsciffer"}, {"q": "I_1 = 10 A og THDi = 50 %. Hvad er I_RMS? (A, 2 decimaler)", "tal": 11.18, "tol": 0.02, "enhed": "A", "losning": "I_RMS = 10 · √(1 + 0,5²) = 10 · 1,118 = 11,18 A.", "f": "Harmoniske øger strømmen uden at give nyttig effekt.", "emne": "Frekvensomformer"}, {"valg": ["Glødelampe", "Halogen", "Lysstofrør", "LED"], "rigtig": 3, "q": "Hvilken lyskilde har det højeste lysudbytte?", "f": "LED ligger på ca. 100–200 lm/W.", "emne": "Lysteknik"}, {"q": "Et rum på 60 m² har 12 armaturer à 4.000 lm, UF = 0,6 og MF = 0,8. Hvad er E_m? (lx)", "tal": 384.0, "tol": 1.0, "enhed": "lx", "losning": "E_m = 12 · 4.000 · 0,6 · 0,8 / 60 = 384 lx.", "f": "MF tager højde for snavs og aldring af lyskilderne.", "emne": "Lysteknik"}, {"valg": ["Generatoren er for hurtig", "Generatoren er for langsom", "Fasefølgen er forkert", "Spændingen er for høj"], "rigtig": 1, "q": "Synkronoskopet drejer mod uret. Hvad betyder det?", "f": "Med uret betyder generatoren hurtigst. Skru lidt op for hastigheden.", "emne": "Synkronisering og paralleldrift"}, {"valg": ["2 m", "5 m", "Ca. 10 m", "62 m"], "rigtig": 2, "q": "Spydet er 2 m dybt. Hvor langt væk skal strømspyddet stå?", "f": "a ≈ 5 × d = 10 m. Spændingsspyddet står så ved 5,5, 6 og 6,5 m.", "emne": "Jording, målebroer og fordelingssystemer"}, {"q": "P = 1,2 kW, cos φ skal hæves fra 0,65 til 0,95. Hvor stor Q_C kræves? (var, hele tal)", "tal": 1009.0, "tol": 10.0, "enhed": "var", "losning": "tan φ₁ = 1,169, tan φ₂ = 0,329. Q_C = 1.200 · (1,169 − 0,329) = 1.009 var.", "f": "Q_C er forskellen i reaktiv effekt før og efter.", "emne": "Asynkronmotor"}, {"valg": ["25 V", "50 V", "120 V", "230 V"], "rigtig": 1, "q": "Hvad er grænsen for vedvarende berøringsspænding (AC)?", "f": "DS/HD 60364-4-41. Beskyttelsen skal udkoble hurtigt nok til, at den ikke overskrides.", "emne": "Jording, målebroer og fordelingssystemer"}, {"q": "Tomgangseffekten er 40 W ved 400 V. Hvad er den ved 200 V? (W)", "tal": 10.0, "tol": 0.1, "enhed": "W", "losning": "P_0 = 40 · (200 / 400)² = 40 · 0,25 = 10 W.", "f": "Jerntabet følger U².", "emne": "Transformer"}, {"valg": ["Egne noter og rapporter", "Lærebøger og UV-materialer fra CN, papir, blyant, passer og lommeregner", "Kun lommeregner", "Alt undtagen computer"], "rigtig": 1, "q": "Hvad må du medbringe til eksamen i Elektroteknik 2?", "f": "Egne noter og rapporter må ikke medbringes.", "emne": "Faget, laboratoriet og rapporter"}, {"valg": ["Når viseren står ved kl. 6", "Lige før kl. 12, mens viseren drejer langsomt med uret", "Når viseren står stille ved kl. 3", "Når lamperne lyser kraftigst"], "rigtig": 1, "q": "Hvornår trykker du indkobling?", "f": "Afbryderen har en lukketid, så man trykker lidt før kl. 12. Ved mørkkobling skal lamperne være mørke.", "emne": "Synkronisering og paralleldrift"}];
const NOGLE = "mn-el2-quiz", SAMLET = "1" === "1";
const q = new URLSearchParams(location.search);

// tilbage-link til den side man kom fra
const fra = q.get("fra");
if (fra && /^[a-z0-9-]+$/.test(fra)) {
  const a = document.getElementById("tilbage");
  a.href = "../../index.html#" + fra;
  a.textContent = "‹ " + (q.get("navn") || "Tilbage");
}

// faner
const tabs = [...document.querySelectorAll("#tabs button")];
function vis(del) {
  if (!document.getElementById("d-" + del)) del = "noter";
  tabs.forEach(b => b.setAttribute("aria-selected", b.dataset.del === del));
  document.querySelectorAll(".del").forEach(s => s.hidden = s.id !== "d-" + del);
}
tabs.forEach(b => b.addEventListener("click", () => {
  vis(b.dataset.del);
  const u = new URL(location.href); u.searchParams.set("vis", b.dataset.del); history.replaceState(null, "", u);
  window.scrollTo(0, 0);
}));
// tomme dele skjules i fanerne
["noter", "formler"].forEach(d => { if (!document.getElementById("d-" + d).textContent.trim()) tabs.find(b => b.dataset.del === d).hidden = true; });
if (!QUIZ.length) tabs.find(b => b.dataset.del === "quiz").hidden = true;
if (SAMLET) { document.getElementById("tabs").hidden = true; vis("quiz"); }
else { const v = q.get("vis") || "noter", t = tabs.find(b => b.dataset.del === v && !b.hidden) || tabs.find(b => !b.hidden); vis(t ? t.dataset.del : "noter"); }

// tabeller kan scrolles på mobil
document.querySelectorAll(".del table").forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.before(w); w.append(t); });

// quiz
let gemt = {};
try { gemt = JSON.parse(localStorage.getItem(NOGLE) || "{}"); } catch (e) {}
const gem = () => { try { localStorage.setItem(NOGLE, JSON.stringify(gemt)); } catch (e) {} };
// Danske og engelske skrivemåder virker begge: "85.200", "85200", "1.150,5", "0,86", "0.86".
// Et enkelt punktum efterfulgt af tre cifre kan både være tusindtal og decimal, så begge tolkninger prøves.
const tolk = s => { s = String(s).replace(/[\s\u00a0]/g, "").replace("−", "-");
  if (!/^-?[\d.,]+$/.test(s)) return [];
  if (s.includes(",")) return [parseFloat(s.replace(/\./g, "").replace(",", "."))];
  if ((s.match(/\./g) || []).length > 1) return [parseFloat(s.replace(/\./g, ""))];
  const ud = [parseFloat(s)];
  if (/^-?\d+\.\d{3}$/.test(s)) ud.push(parseFloat(s.replace(".", "")));
  return ud; };
const fmt = x => x.toLocaleString("da-DK", { maximumFractionDigits: 4 });

function bygQuiz() {
  const rod = document.getElementById("quiz"); rod.innerHTML = "";
  QUIZ.forEach((s, i) => {
    const el = document.createElement("div"); el.className = "q";
    el.innerHTML = `<div class="nr">Spørgsmål ${i + 1} af ${QUIZ.length}${SAMLET ? `<span class="emnetag">${s.emne}</span>` : ""}</div><div class="tekst">${s.q}</div>`;
    const g = gemt[i];
    if (s.valg) {
      const v = document.createElement("div"); v.className = "valg";
      s.valg.forEach((t, j) => {
        const b = document.createElement("button"); b.innerHTML = t;
        b.addEventListener("click", () => { gemt[i] = { valgt: j, ok: j === s.rigtig }; gem(); bygQuiz(); });
        v.append(b);
      });
      el.append(v);
      if (g) {
        [...v.children].forEach((b, j) => { b.disabled = true; if (j === s.rigtig) b.classList.add("ok"); else if (j === g.valgt) b.classList.add("bad"); });
        el.insertAdjacentHTML("beforeend", `<div class="svar ${g.ok ? "ok" : "bad"}"><b>${g.ok ? "Rigtigt." : "Ikke helt."}</b>${s.f || ""}</div>`);
      }
    } else {
      const f = document.createElement("div"); f.className = "tal";
      f.innerHTML = `<input inputmode="decimal" aria-label="Dit svar" placeholder="Dit svar"> <span class="enhed">${s.enhed || ""}</span> <button class="knap">Tjek</button> <button class="knap stille">Vis facit</button>`;
      const [inp, , tjek, opgiv] = f.children;
      el.append(f);
      const faerdig = g && (g.ok || g.forsog >= 2 || g.opgivet);
      if (g && g.svar != null) inp.value = g.svar;
      if (faerdig) {
        inp.disabled = tjek.disabled = opgiv.disabled = true;
        el.insertAdjacentHTML("beforeend", `<div class="svar ${g.ok ? "ok" : "bad"}"><b>${g.ok ? "Rigtigt." : "Facit: " + fmt(s.tal) + " " + (s.enhed || "")}</b>${s.losning ? s.losning + "<br>" : ""}${s.f || ""}</div>`);
      } else if (g && g.forsog === 1) {
        el.insertAdjacentHTML("beforeend", `<div class="svar hint"><b>Ikke helt. Tjek din opstilling og prøv igen.</b>Du har ét forsøg tilbage.</div>`);
      }
      const svar = () => {
        const xs = tolk(inp.value); if (!xs.length || xs.some(isNaN)) { inp.focus(); return; }
        const ok = xs.some(x => Math.abs(x - s.tal) <= Math.max(s.tol, Math.abs(s.tal) * 1e-9));
        const forsog = ((g && g.forsog) || 0) + 1;
        gemt[i] = { svar: inp.value, ok, forsog }; gem(); bygQuiz();
      };
      tjek.addEventListener("click", svar);
      inp.addEventListener("keydown", e => { if (e.key === "Enter") svar(); });
      opgiv.addEventListener("click", () => { gemt[i] = { svar: inp.value, ok: false, forsog: 2, opgivet: true }; gem(); bygQuiz(); });
    }
    rod.append(el);
  });
  // score
  const faerdige = QUIZ.map((s, i) => gemt[i] && (s.valg || gemt[i].ok || gemt[i].forsog >= 2));
  const antal = faerdige.filter(Boolean).length, rigtige = QUIZ.filter((s, i) => gemt[i] && gemt[i].ok).length;
  const forkerte = QUIZ.map((s, i) => faerdige[i] && !gemt[i].ok ? `<li>${s.q.replace(/<[^>]+>/g, "")}${SAMLET ? ` <em>(${s.emne})</em>` : ""}</li>` : "").join("");
  document.getElementById("score").innerHTML = antal === 0 ? "" : `<div class="score">
    <h2>${rigtige} af ${QUIZ.length} rigtige${antal < QUIZ.length ? ` · ${QUIZ.length - antal} mangler` : ""}</h2>
    ${forkerte ? `<p>Tag med i repetitionen:</p><ul>${forkerte}</ul>` : antal === QUIZ.length ? "<p>Alle rigtige. Tag quizzen igen om et par uger.</p>" : ""}
    <button class="knap stille" id="nulstil">Start forfra</button></div>`;
  const n = document.getElementById("nulstil");
  if (n) n.addEventListener("click", () => { gemt = {}; gem(); bygQuiz(); window.scrollTo(0, document.getElementById("d-quiz").offsetTop - 70); });
}
if (QUIZ.length) bygQuiz();
</script>
</body>
