<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mine noter og modeller fra maskinmesteruddannelsen.">
<meta name="color-scheme" content="dark">
<title>Maskinenoter</title>
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: ét valg pr. skærm. Forside = skib + semesterbar. Semester -> fag -> emne -> dele, alle som rolige app-felter. Systemskrift, meget luft. */
:root {
  /* Hele siden har vandets farve (bevidst ét mørkt udtryk, uanset lys/mørk indstilling) */
  --bg: #0a131c; --surface: #122130; --fg: #eef2f6; --muted: #9aa7b4; --line: #23354a; --hover: #182a3c;
  --accent: #f08a35; --focus: #5ea2ff;
  --hero: #0a131c; --hero-2: #14283b; --hero-fg: #f5f5f7; --hero-muted: #9aa7b4; --glass: rgba(255,255,255,.08); --glass-line: rgba(255,255,255,.14);
  --bar: rgba(10,19,28,.78);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.28);
  /* app-farver: virker på både lys og mørk baggrund */
  --c-el: #e0a100; --c-energi: #e2552f; --c-motor: #c8501d; --c-auto: #12928f; --c-oekonomi: #6b57c9; --c-ledelse: #7c5cd6;
  --c-studie: #5b6f82; --c-vaerksted: #6d7a86; --c-praktik: #2f6fb5; --c-koel: #2a8fd0;
  --c-noter: #2f6fd6; --c-formler: #7a56d1; --c-labnoter: #b0477f; --c-eksamen: #d4483b; --c-simulation: #e2671c; --c-modeller: #14958f; --c-forstaaelse: #d19a00; --c-quiz: #2e9b4f;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: radial-gradient(90% 70% at 70% 0%, var(--hero-2), var(--hero) 70%) fixed var(--bg); color: var(--fg); font: 17px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

/* ---------- Forside ---------- */
.hero { position: relative; overflow: hidden; color: var(--hero-fg);
  margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px);
  min-height: clamp(560px, 100vh, 980px); display: grid;
  background: transparent; }
.hero .wrap { position: relative; z-index: 2; width: 100%; max-width: 1240px; display: grid; grid-template-rows: auto 1fr auto; padding-block: 1.5rem 3rem; }
.mark { display: inline-flex; align-items: center; gap: .55rem; font-weight: 600; font-size: 1rem; letter-spacing: -.01em; text-decoration: none; color: var(--hero-fg); justify-self: start; }
.mark svg { width: 24px; height: 24px; }
.hero h1 { align-self: end; margin: 0 0 2.25rem; font-weight: 700; font-size: clamp(3rem, 8.5vw, 7rem); line-height: .95; letter-spacing: -.045em; }
.hero h1 span { display: block; color: var(--hero-muted); font-weight: 500; font-size: .28em; letter-spacing: -.01em; margin-top: .9rem; }
.sembar-label { font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--hero-muted); margin: 0 0 .7rem; }
.sembar { display: inline-flex; gap: 6px; padding: 6px; border-radius: 20px; background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); flex-wrap: wrap; max-width: 100%; }
.sembar a { position: relative; display: grid; place-items: center; width: 58px; height: 52px; border-radius: 14px; text-decoration: none; color: var(--hero-fg); font-weight: 600; font-size: 1.05rem; font-variant-numeric: tabular-nums; transition: background .2s; }
.sembar a:hover { background: rgba(255,255,255,.12); }
.sembar a.now { background: var(--hero-fg); color: var(--hero); }
.sembar a.now::after { content: ""; position: absolute; bottom: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.sembar a small { font-size: .62rem; font-weight: 600; opacity: .55; margin-right: 1px; }
.ship { position: absolute; z-index: 1; right: 6%; top: -14%; height: 128%; aspect-ratio: 1 / 5; transform: rotate(-34deg); transform-origin: 50% 50%; pointer-events: none; filter: drop-shadow(0 30px 50px rgba(0,0,0,.55)); }
.ship svg { display: block; width: 100%; height: 100%; }
.beacon { position: absolute; left: 50%; top: 61%; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); translate: -50% -50%; }
@media (prefers-reduced-motion: no-preference) {
  .beacon { animation: beacon 2.6s ease-out infinite; }
  .ship { animation: drift 1.4s cubic-bezier(.2,.7,.2,1) both; }
}
@keyframes beacon { 0% { box-shadow: 0 0 0 0 rgba(240,138,53,.6); } 70%, 100% { box-shadow: 0 0 0 20px rgba(240,138,53,0); } }
@keyframes drift { from { translate: 40px -30px; opacity: .6; } }

/* ---------- Undersider ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.topbar .wrap { display: flex; align-items: center; gap: 1.25rem; min-height: 52px; }
.topbar .mark { color: var(--fg); }
.crumbs { display: flex; align-items: center; gap: .4rem; font-size: .92rem; color: var(--muted); min-width: 0; overflow: hidden; white-space: nowrap; }
.crumbs a { text-decoration: none; color: var(--muted); }
.crumbs a:hover { color: var(--fg); }
.crumbs .sep { opacity: .5; }
.crumbs .here { color: var(--fg); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.screen { padding-block: clamp(1.75rem, 4vw, 3rem) 5rem; }
@media (prefers-reduced-motion: no-preference) { .screen { animation: in .35s ease both; } }
@keyframes in { from { opacity: 0; translate: 0 8px; } }
.screen h1 { overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; margin: 0; font-weight: 700; font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: 1.05; letter-spacing: -.035em; text-wrap: balance; }
.meta { margin: .6rem 0 0; color: var(--muted); font-size: 1rem; display: flex; gap: .9rem; flex-wrap: wrap; }
.meta a { color: var(--accent); text-decoration: none; }
.meta a:hover { text-decoration: underline; }
.intro { margin: 1.1rem 0 0; max-width: 56ch; font-size: 1.2rem; line-height: 1.5; color: var(--muted); }
.tiles { margin-top: clamp(2rem, 5vw, 3rem); display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 16px; }
.tile { display: grid; justify-items: center; align-content: start; gap: .85rem; padding: 1.6rem 1rem 1.35rem; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); text-decoration: none; color: var(--fg); text-align: center; transition: transform .2s ease, box-shadow .2s ease; }
a.tile:hover { transform: translateY(-3px); background: var(--hover); box-shadow: 0 2px 4px rgba(0,0,0,.3), 0 18px 40px rgba(0,0,0,.35); }
.tile { border: 1px solid var(--line); }
.tile .app { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; background: var(--c, var(--c-studie)); color: #fff; box-shadow: inset 0 -2px 0 rgba(0,0,0,.12); }
.tile .app svg { width: 30px; height: 30px; }
.tile .name { max-width: 100%; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; font-size: .98rem; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; text-wrap: balance; }
.tile.off { opacity: .38; box-shadow: none; background: transparent; border: 1px dashed var(--line); }
.quiet { margin-top: 3rem; display: inline-flex; align-items: center; gap: .6rem; padding: .7rem 1.1rem; border-radius: 999px; color: var(--muted); text-decoration: none; font-size: .95rem; border: 1px solid var(--line); }
a.quiet:hover { color: var(--fg); background: var(--hover); }
.quiet svg { width: 18px; height: 18px; }
.quiet em { font-style: normal; font-size: .78rem; padding: .1rem .5rem; border-radius: 999px; background: var(--hover); }
.back { display: inline-block; margin-top: 2rem; color: var(--accent); text-decoration: none; font-weight: 500; }
.back:hover { text-decoration: underline; }

@media (max-width: 720px) {
  .ship { right: -12%; top: -6%; height: 112%; opacity: .55; }
  .sembar { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 3px; padding: 4px; width: 100%; }
  .sembar a { width: auto; height: 46px; font-size: .95rem; border-radius: 11px; }
  .sembar a small { display: none; }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .topbar .mark span { display: none; }
}
/* Skibet som header på undersider */
.shiphead { color: var(--hero-fg); overflow: hidden; margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px);
  background: transparent; }
.shiphead .topbar { position: relative; top: auto; background: none; border: 0; backdrop-filter: none; -webkit-backdrop-filter: none; }
.shiphead .topbar .mark { color: var(--hero-fg); }
.shiphead .crumbs, .shiphead .crumbs a { color: var(--hero-muted); }
.shiphead .crumbs a:hover, .shiphead .crumbs .here { color: var(--hero-fg); }
.hship-wrap { display: grid; place-items: center; padding-block: .25rem 1.6rem; }
.hship { --L: clamp(300px, 62vw, 860px); position: relative; width: var(--L); aspect-ratio: 5 / 1; }
.hship-inner { position: absolute; left: 50%; top: 50%; width: calc(var(--L) / 5); height: var(--L); transform: translate(-50%, -50%) rotate(-90deg); filter: drop-shadow(0 18px 28px rgba(0,0,0,.5)); }
.hship-inner svg, .flyship svg { display: block; width: 100%; height: 100%; }
/* Skibet på venstre side inde i et fag */
:root { --sl: min(calc(100vh - 120px), 720px); --sw: calc(var(--sl) / 5); }
.sship { display: none; }
#app.side .hship-wrap { display: none; }
#app.side .sship { display: block; position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 84px); height: var(--sl); width: var(--sw);
  left: max(24px, calc((100vw - (1080px + var(--sw) + 64px)) / 2 + 24px)); transform: rotate(180deg); filter: drop-shadow(0 18px 28px rgba(0,0,0,.5)); }
.sship svg { display: block; width: 100%; height: 100%; }
#app.side .screen { max-width: calc(1080px + var(--sw) + 64px); padding-left: calc(var(--sw) + 88px); }
#landing .hero .wrap { transition: opacity .5s ease; }
.gennemse { position: fixed; z-index: 70; right: 16px; bottom: 16px; padding: .5rem .85rem; border-radius: 999px; background: var(--accent); color: #1a0e04; font: 600 .82rem/1.2 var(--sans); text-decoration: none; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
#landing.sejler .hero .wrap { opacity: 0; }
.flyship { position: fixed; z-index: 60; pointer-events: none; transform-origin: 50% 50%; filter: drop-shadow(0 26px 44px rgba(0,0,0,.5)); }
@media (prefers-reduced-motion: no-preference) {
  .hship.sail .hship-inner { animation: sail 1.1s cubic-bezier(.2,.7,.2,1) both; }
}
@keyframes sail { from { transform: translate(calc(-50% - 70px), -50%) rotate(-90deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>


<div id="landing" hidden>
  <section class="hero">
    <div class="ship" id="ship" aria-hidden="true"></div>
    <div class="wrap">
      <a class="mark" href="#start" aria-label="Maskinenoter forside"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="#f08a35"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Maskinenoter</a>
      <h1>Maskinenoter<span>Maskinmesteruddannelsen</span></h1>
      <div>
        <p class="sembar-label" id="sembar-label">Semester</p>
        <nav class="sembar" id="sembar" aria-labelledby="sembar-label"></nav>
      </div>
    </div>
  </section>
</div>

<div id="app" hidden>
  <header class="shiphead">
    <div class="topbar">
      <div class="wrap">
      <a class="mark" href="#start" aria-label="Maskinenoter forside"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="#f08a35"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Maskinenoter</span></a>
      <nav class="crumbs" id="crumbs" aria-label="Du er her"></nav>
    </div>
    </div>
    <div class="hship-wrap"><div class="hship" id="hship" aria-hidden="true"></div></div>
    <div class="sship" id="sship" aria-hidden="true"></div>
  </header>
  <main class="wrap screen" id="screen"></main>
</div>
<a class="gennemse" id="gennemse" href="?gennemse=nej" hidden>Gennemsyn: du ser også skjult indhold · Slå fra</a>

<script>
/* =====================================================================
   INDHOLD  (se README.md for hvordan man tilføjer semestre, fag og emner)
   Semester -> fag -> emner -> dele. En del er et link eller null.
   ===================================================================== */
const NU = 5; // det semester jeg er på lige nu

// Genvej til EL2-emner med labøvelse: teorinoter, formler og quiz fra noter/el2/<id>.html (bygget af byg.py),
// plus eksamenssiden (noter/el2/<id>-eksamen.html), simulatoren og forståelsesdelen fra lab nr. n
const el2Lab = (n, id) => ({
  eksamen:     `noter/el2/${id}-eksamen.html`,
  noter:       `noter/el2/${id}.html?vis=noter`,
  formler:     `noter/el2/${id}.html?vis=formler`,
  simulation:  `modeller/el2/lab${n}.html?vis=sim`,
  forstaaelse: `modeller/el2/lab${n}-noter.html?vis=forstaa`,
  quiz:        `noter/el2/${id}.html?vis=quiz`,
});

// Genvej til PA1-emner: noter (med modeller), forståelse og quiz i noter/pa1/<id>.html
const pa1 = id => ({
  noter:       `noter/pa1/${id}.html?vis=noter`,
  forstaaelse: `noter/pa1/${id}.html?vis=forstaa`,
  quiz:        `noter/pa1/${id}.html?vis=test`,
});

// Genvej til emner bygget af noter/kilde/byg.py: noter, formler og quiz i noter/<fag>/<id>.html
const emne = (fag, id, formler = true) => ({
  noter:   `noter/${fag}/${id}.html?vis=noter`,
  formler: formler ? `noter/${fag}/${id}.html?vis=formler` : null,
  quiz:    `noter/${fag}/${id}.html?vis=quiz`,
});

const SEMESTRE = [
  { n: 1, fag: [
    { id: "vaerksted", navn: "Værkstedsskole", ikon: "vaerksted", emner: [] } ] },
  { n: 2, fag: [
    { id: "vaerksted", navn: "Værkstedsskole", ikon: "vaerksted", emner: [] },
    { id: "praktik", navn: "Virksomhedspraktik", ikon: "praktik", emner: [] } ] },
  { n: 3, fag: [
    { id: "praktik", navn: "Virksomhedspraktik", ikon: "praktik", emner: [] } ] },
  { n: 4, fag: [
    { id: "el1", navn: "Elektroteknik 1", ikon: "el", emner: [] },
    { id: "term", navn: "Grundlæggende termodynamik", ikon: "energi", quiz: "noter/term/quiz.html",
      emner: [
        { id: "temperatur", navn: "Temperatur og temperaturskalaer", ikon: "termometer",
          intro: "Hvad temperatur er, 0. hovedsætning, Celsius, Kelvin og Fahrenheit, og hvorfor gasformler altid skal have kelvin.",
          dele: { eksamen: "noter/term/temperatur-eksamen.html", ...emne("term", "temperatur") } },
        { id: "termometre", navn: "Termometre og temperaturmåling", ikon: "termometer",
          intro: "Væsketermometer, bimetal, termistor, Pt100, termoelement og IR: måleprincip, måleområde og usikkerhed.",
          dele: { eksamen: "noter/term/termometre-eksamen.html", ...emne("term", "termometre") } },
        { id: "maaling", navn: "Måling og måleusikkerhed", ikon: "maal",
          intro: "Systematiske og tilfældige fejl, middelværdi, spredning, standardusikkerhed, kalibrering og sporbarhed.",
          dele: { eksamen: "noter/term/maaling-eksamen.html", ...emne("term", "maaling") } },
        { id: "tryk", navn: "Tryk", ikon: "tryk",
          intro: "Absolut tryk og overtryk, enheder, hydrostatisk tryk, manometre og Pascals lov i hydraulik.",
          dele: { eksamen: "noter/term/tryk-eksamen.html", ...emne("term", "tryk") } },
        { id: "udvidelse", navn: "Varmeudvidelse", ikon: "udvid",
          intro: "Lineær udvidelse og volumenudvidelse, bimetal, termiske spændinger og kompensatorer.",
          dele: { eksamen: "noter/term/udvidelse-eksamen.html", ...emne("term", "udvidelse") } },
        { id: "varme", navn: "Varme og varmekapacitet", ikon: "flamme",
          intro: "Q = m · c · Δt, varmeeffekt i en strøm, blandingstemperatur og kalorimetri.",
          dele: { eksamen: "noter/term/varme-eksamen.html", ...emne("term", "varme") } },
        { id: "damp", navn: "Faseovergange og vanddamp", ikon: "kedel",
          intro: "Latent varme, opvarmningskurven, kogepunkt og tryk, dampkvalitet og entalpi.",
          dele: { eksamen: "noter/term/damp-eksamen.html", ...emne("term", "damp") } },
        { id: "gas", navn: "Idealgasloven og tilstandsændringer", ikon: "gas",
          intro: "p · V = m · R · T, isobar, isokor, isoterm og adiabatisk, pV-diagrammet og arbejde.",
          dele: { eksamen: "noter/term/gas-eksamen.html", ...emne("term", "gas") } },
        { id: "energi", navn: "Energi, effekt og virkningsgrad", ikon: "energi",
          intro: "1. og 2. hovedsætning, brændværdi, specifikt brændstofforbrug, virkningsgrad i en kæde og Carnot.",
          dele: { eksamen: "noter/term/energi-eksamen.html", ...emne("term", "energi") } },
        { id: "varmetransmission", navn: "Varmetransmission", ikon: "varmeovf",
          intro: "Ledning, konvektion og stråling, U-værdi og isolering, og varmevekslere.",
          dele: { eksamen: "noter/term/varmetransmission-eksamen.html", ...emne("term", "varmetransmission") } },
        { id: "stivhed", navn: "Stivhed og materialelære", ikon: "stiv",
          intro: "Spænding og tøjning, Hookes lov, Young's modulus, spændings-tøjningskurven og trækprøven.",
          dele: { eksamen: "noter/term/stivhed-eksamen.html", ...emne("term", "stivhed") } },
        { id: "formelsamling", navn: "Samlet formelsamling", ikon: "formler",
          intro: "Alle formler fra faget samlet på ét sted og ordnet efter emne.",
          dele: { formler: "noter/term/formelsamling.html?vis=formler" } },
      ] },
    { id: "stud", navn: "Studiekompetence og metode", ikon: "studie", emner: [] } ] },
  { n: 5, quiz: null, fag: [
    { id: "el2", navn: "Elektroteknik 2", ikon: "el", quiz: "noter/el2/quiz.html",
      laeringsmaal: "https://www.teknikaqms.dk/showpage.php?pageid=485818",
      emner: [
        { id: "faget", navn: "Faget, laboratoriet og rapporter", ikon: "sikkerhed",
          intro: "Hvad faget kræver til eksamen, de ni sikkerhedsregler i stærkstrømslaboratoriet, udstyret på bænkene og hvordan målerapporter og rapporter skal skrives.",
          dele: emne("el2", "faget", false) },
        { id: "trefaset", navn: "Trefaset belastning", ikon: "trefase",
          intro: "Stjerne og trekant, effekt i 3-fasede systemer, usymmetrisk last med og uden nul, og de tre wattmetermetoder. Labøvelse 1.",
          dele: el2Lab(1, "trefaset") },
        { id: "generator", navn: "Synkrongenerator", ikon: "generator",
          intro: "Opbygning og magnetisering, ankerreaktion og vektordiagram, magnetiserings- og belastningskarakteristik, remanens og THDu. Labøvelse 2.",
          dele: el2Lab(2, "generator") },
        { id: "asynkron", navn: "Asynkronmotor", ikon: "motor",
          intro: "Slip, effektbalance og tab, momentkurven, startmetoder, fasekompensering med kondensatorer og 1-fasede motorer. Labøvelse 3.",
          dele: el2Lab(3, "asynkron") },
        { id: "jording", navn: "Jording, målebroer og fordelingssystemer", ikon: "jord",
          intro: "Målebroer, jordelektrodens overgangsmodstand og 55/60/65 %-kravet, TN, TT og IT, personfaren og spændingsfald i installationer. Labøvelse 4.",
          dele: el2Lab(4, "jording") },
        { id: "transformer", navn: "Transformer", ikon: "transformer",
          intro: "Ækvivalentskemaet, tomgangs- og kortslutningsforsøget, virkningsgrad, spændingsfald på tre måder og måletransformere. Labøvelse 5.",
          dele: el2Lab(5, "transformer") },

/* =====================================================================
   FRIGIVET INDHOLD
   Kun de dele, der står i FRIGIVET, vises på den live side. Resten er skjult, indtil det er gennemgået.
   Frigiv én del for alle emner:   tilføj den her, fx "noter".
   Frigiv dele for ét emne:        skriv  frigivet: ["noter", "quiz"]  på emnet i SEMESTRE.
   Frigiv quizzen for et helt fag: skriv  frigivet: ["quiz"]  på faget.
   Se alt (også det skjulte):      åbn siden med  ?gennemse  bagerst i adressen. ?gennemse=nej slår det fra igen.
   ===================================================================== */
const FRIGIVET = ["eksamen", "kort", "noter", "formler", "simulation", "modeller", "forstaaelse", "quiz"];
const GENNEMSE = (() => {
  const q = new URLSearchParams(location.search).get("gennemse");
  try {
    if (q === "nej") localStorage.removeItem("gennemse");
    else if (q !== null) localStorage.setItem("gennemse", "1");
    return localStorage.getItem("gennemse") === "1";
  } catch (e) { return q !== null && q !== "nej"; }
})();
if (!GENNEMSE) for (const s of SEMESTRE) {
  if (!FRIGIVET.includes("quiz")) s.quiz = null;
  for (const f of s.fag) {
    const fagOk = k => FRIGIVET.includes(k) || (f.frigivet || []).includes(k);
    if (!fagOk("quiz")) f.quiz = null;
    for (const e of f.emner) if (e.dele) for (const k of Object.keys(e.dele))
      if (!fagOk(k) && !(e.frigivet || []).includes(k)) e.dele[k] = null;
  }
}

/* Rækkefølge og navne på delene på en emneside */
if (GENNEMSE) addEventListener("DOMContentLoaded", () => { $("#gennemse").hidden = false; });
const DELE = [
  ["eksamen", "Alt du skal bruge til eksamen"],
  ["kort", "Prøvespørgsmål med svar"],

];

  pumpe: '<circle cx="11" cy="13" r="7"/><circle cx="11" cy="13" r="2"/><path d="M11 6h10v4.5"/>',

  smoering: '<path d="M3 11.5h11.5l4.5-3.5 2.5 1.2-5.5 7.3H5Z"/><path d="M7.5 11.5V8.5h4.5v3"/><path d="M20.5 14.5c.6.9.9 1.5.9 2a.9.9 0 0 1-1.8 0c0-.5.3-1.1.9-2Z"/>',

  kedel: '<rect x="5" y="2.5" width="14" height="19" rx="3.5"/><path d="M12 9c1.9 2.1 2.7 3.4 2.7 4.8a2.7 2.7 0 0 1-5.4 0c0-1.4.8-2.7 2.7-4.8Z"/>',

  noter: '<path d="M7 2.5h7.5l4.5 4.5v14.5H7Z"/><path d="M14.5 2.5V7H19M10 12h6M10 16h6"/>',
  formler: '<path d="M17 4.5H7l6 7.5-6 7.5h10"/>',
  labnoter: '<path d="M9.5 2.5h5M10.5 2.5v6L5 19a1.7 1.7 0 0 0 1.5 2.5h11A1.7 1.7 0 0 0 19 19l-5.5-10.5v-6"/><path d="M7.5 15h9"/>',
  simulation: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  modeller: '<path d="M12 2.5 4 7v10l8 4.5 8-4.5V7l-8-4.5Z"/><path d="M4 7l8 4.5L20 7M12 11.5v10"/>',
  forstaaelse: '<path d="M9 18h6M10 21.5h4M12 2.5a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 2.5Z"/>',
  termometer: '<path d="M10 14.5V5a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0Z"/><path d="M12 9v7.5"/><path d="M16.5 6h2M16.5 9h2M16.5 12h2"/>',
  maal: '<path d="M3 18.5 18.5 3l2.5 2.5L5.5 21Z"/><path d="m7 15 1.5 1.5M10 12l2 2M13 9l1.5 1.5M16 6l2 2"/>',
  tryk: '<circle cx="12" cy="13" r="8"/><path d="M12 13 16 8.5"/><path d="M7 16.5h10M12 3v2"/>',
  udvid: '<path d="M7 9.5h10v5H7Z"/><path d="M2.5 12h3M18.5 12h3M4 10l-1.5 2L4 14M20 10l1.5 2L20 14"/>',
  gas: '<path d="M6 3.5v17h12v-17"/><path d="M6 9h12M12 9V3.5"/><circle cx="9.5" cy="14" r="1"/><circle cx="14" cy="16.5" r="1"/><circle cx="14.5" cy="12.5" r="1"/>',
  varmeovf: '<path d="M10 3v18M14 3v18"/><path d="M3 8c1.2-1.3 2.3-1.3 3.5 0M3 13c1.2-1.3 2.3-1.3 3.5 0M17.5 8c1.2-1.3 2.3-1.3 3.5 0M17.5 13c1.2-1.3 2.3-1.3 3.5 0"/>',
  stiv: '<path d="M12 2.5v3M12 18.5v3"/><path d="M9 5.5h6v13H9Z"/><path d="M9 10.5c1.5 1 4.5 1 6 0"/>',
  quiz: '<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.6 2.6L16 9.6"/>',
};
const FARVE = { el: "el", energi: "energi", motoranlaeg: "motor", auto: "auto", oekonomi: "oekonomi", ledelse: "ledelse", studie: "studie",
  vaerksted: "vaerksted", praktik: "praktik", koel: "koel", noter: "noter", formler: "formler", eksamen: "eksamen", kort: "eksamen", labnoter: "labnoter", simulation: "simulation",
  modeller: "modeller", forstaaelse: "forstaaelse", quiz: "quiz" };
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IKON[k] || IKON.studie}</svg>`;
const farve = (ikon, fallback) => `var(--c-${FARVE[ikon] || fallback || "studie"})`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* =====================================================================
   SKIBET (tegnet, ingen billedfiler)
   ===================================================================== */
function rnd(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function shipSVG() {
  const r = rnd(7); let h = "";
  for (let y = 175; y < 830; y += 47) for (const x of [42, 106]) {
    h += `<rect x="${x}" y="${y}" width="52" height="39" fill="#333d48" stroke="#5f6b78" stroke-width="1.5"/>`;
    for (let k = 1; k < 4; k++) h += `<line x1="${x + 4}" x2="${x + 48}" y1="${y + k * 9.75}" y2="${y + k * 9.75}" stroke="#4a5562" stroke-width="1"/>`;
    if (r() > .55) h += `<rect x="${(x + 4 + r() * 38).toFixed(1)}" y="${(y + 3 + r() * 28).toFixed(1)}" width="5" height="5" fill="#e0741b"/>`;
  }
  let det = ""; for (let i = 0; i < 26; i++) det += `<rect x="${(36 + r() * 126).toFixed(1)}" y="${(150 + r() * 700).toFixed(1)}" width="${(2 + r() * 4).toFixed(1)}" height="${(2 + r() * 3).toFixed(1)}" fill="${r() > .5 ? "#e0741b" : "#cfd6dc"}"/>`;
  return `<svg viewBox="0 0 200 1000">
    <path d="M28 52 Q28 8 70 6 L130 6 Q172 8 172 52 L172 800 Q172 915 100 996 Q28 915 28 800 Z" fill="#4a5561" stroke="#7d8996" stroke-width="2"/>
    <path d="M36 140 L164 140 L164 800 Q164 905 100 978 Q36 905 36 800 Z" fill="#262f39"/>
    <rect x="44" y="18" width="112" height="104" fill="#aeb8c2" stroke="#e1e6ea" stroke-width="2"/>
    <rect x="56" y="30" width="88" height="62" fill="#8995a1"/>
    ${[0, 1, 2, 3, 4, 5].map(i => `<rect x="${60 + i * 14}" y="98" width="9" height="14" fill="#38424d"/>`).join("")}
    <rect x="86" y="40" width="28" height="30" fill="#5b6672"/><circle cx="100" cy="55" r="7" fill="#e0741b"/>
    ${h}
    <rect x="97" y="140" width="6" height="760" fill="#8f9aa6"/>
    <rect x="66" y="140" width="3" height="720" fill="#6d7884"/><rect x="131" y="140" width="3" height="720" fill="#6d7884"/>
    <path d="M70 870 L130 870 L100 940 Z" fill="#333d48" stroke="#5f6b78" stroke-width="1.5"/>
    ${det}
  </svg><span class="beacon"></span>`;
}

/* =====================================================================
   VISNING
   ===================================================================== */
const $ = s => document.querySelector(s);
const harIndhold = fag => fag.emner && fag.emner.length > 0;
const delAntal = e => DELE.filter(([k]) => e.dele && e.dele[k]).length;

function tile({ href, navn, ikon, c }) {
  const inner = `<span class="app" style="--c:${c}">${svg(ikon)}</span><span class="name">${esc(navn)}</span>`;
  return href ? `<a class="tile" href="${href}">${inner}</a>` : `<div class="tile off" aria-disabled="true">${inner}</div>`;
}
function quizKnap(href, tekst, findes) {
  const ico = svg("quiz");
  return findes
    ? `<a class="quiet" href="${href}">${ico}${esc(tekst)}</a>`
    : `<a class="quiet" href="${href}">${ico}${esc(tekst)}<em>Kommer senere</em></a>`;
}
function setCrumbs(items) {
  $("#crumbs").innerHTML = items.map((c, i) => i < items.length - 1
    ? `<a href="#${c[1]}">${esc(c[0])}</a><span class="sep">/</span>`
    : `<span class="here" aria-current="page">${esc(c[0])}</span>`).join("");
}
const roligt = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let foersteApp = true;
const kanSide = () => innerWidth >= 900;
function visApp(titel, html, crumbs, mode = "top") {
  const A = $("#app");
  if (mode === "side" && !kanSide()) mode = "top";
  // Kommer vi fra forsiden, sejler skibet af sted og lægger sig vandret som header
  const sejl = !$("#landing").hidden && $("#ship").firstChild && !roligt() && mode === "top";
  let fra = null;
  if (sejl) { const sh = $("#ship"), r = sh.getBoundingClientRect(); fra = { cx: r.left + r.width / 2, cy: r.top + r.height / 2, w: sh.offsetWidth, h: sh.offsetHeight }; }
  // Skifter vi mellem header og venstre side, sejler skibet derhen
  const forMode = A.classList.contains("side") ? "side" : "top";
  const skift = !A.hidden && forMode !== mode && !roligt();
  const kilde = skift ? skibPlads(forMode) : null;
  const hs = $("#hship"), ss = $("#sship");
  if (!hs.firstChild) hs.innerHTML = `<div class="hship-inner">${shipSVG()}</div>`;
  if (!ss.firstChild) ss.innerHTML = shipSVG();
  hs.classList.toggle("sail", foersteApp && !sejl && mode === "top"); foersteApp = false;
  A.classList.toggle("side", mode === "side");
  setCrumbs(crumbs);
  const s = $("#screen"); s.innerHTML = html;
  s.style.animation = "none"; void s.offsetWidth; s.style.animation = "";
  s.style.animationDelay = sejl ? "3.9s" : skift ? "3.2s" : "";
  document.title = titel + " · Maskinenoter";
  if (skift) { window.scrollTo(0, 0); omSkib(kilde, mode); return; }
  if (!sejl) { $("#landing").hidden = true; $("#landing").classList.remove("sejler"); A.hidden = false; return; }
  sejlTur(fra);
}
/* Hvor står skibet lige nu (header eller venstre side) */
function skibPlads(mode) {
  const el = mode === "side" ? $("#sship") : $("#hship .hship-inner"), r = el.getBoundingClientRect();
  return { el, cx: r.left + r.width / 2, cy: r.top + r.height / 2, w: el.offsetWidth, h: el.offsetHeight };
}
/* Header -> venstre side: ud til højre, ned langs siden, hen langs bunden og op i venstre side. Og tilbage igen. */
function omSkib(fra, mode) {
  const vw = innerWidth, vh = innerHeight;
  fra.el.style.visibility = "hidden";
  const til = skibPlads(mode); til.el.style.visibility = "hidden";
  const f = document.createElement("div"); f.className = "flyship"; f.innerHTML = shipSVG(); document.body.appendChild(f);
  Object.assign(f.style, { left: (fra.cx - fra.w / 2) + "px", top: (fra.cy - fra.h / 2) + "px", width: fra.w + "px", height: fra.h + "px" });
  const m = Math.min(1, (vh * .5) / fra.h), slut = til.h / fra.h;
  const rute = mode === "side" ? [
    { p: [fra.cx, fra.cy], k: [1, 0], s: 1 },
    { p: [vw * .86, vh * .46], k: [0, 1], s: m },
    { p: [vw * .52, vh * .86], k: [-1, 0], s: m },
    { p: [til.cx, til.cy], k: [0, -1], s: slut },
  ] : [
    { p: [fra.cx, fra.cy], k: [0, -1], s: 1 },
    { p: [til.cx, til.cy], k: [1, 0], s: slut },
  ];
  const anim = f.animate(rute2kf(rute, 26, fra.cx, fra.cy), { duration: mode === "side" ? 3800 : 2600, easing: "cubic-bezier(.45, .05, .25, 1)", fill: "forwards" });
  const faerdig = () => { fra.el.style.visibility = ""; til.el.style.visibility = ""; f.remove(); };
  anim.onfinish = faerdig; anim.oncancel = faerdig;
}
/* Skibets rute: punkter med kurs (enhedsvektor). Mellem punkterne tegnes en blød kurve (Hermite),
   og stævnen peger altid i sejlretningen. */
function rute2kf(pkt, n, cx, cy) {
  const pts = [];
  for (let i = 0; i < pkt.length - 1; i++) {
    const A = pkt[i], B = pkt[i + 1], d = Math.hypot(B.p[0] - A.p[0], B.p[1] - A.p[1]) * 1.1;
    for (let j = (i ? 1 : 0); j <= n; j++) {
      const t = j / n, t2 = t * t, t3 = t2 * t;
      const h00 = 2 * t3 - 3 * t2 + 1, h10 = t3 - 2 * t2 + t, h01 = -2 * t3 + 3 * t2, h11 = t3 - t2;
      const g00 = 6 * t2 - 6 * t, g10 = 3 * t2 - 4 * t + 1, g01 = -6 * t2 + 6 * t, g11 = 3 * t2 - 2 * t;
      const x = h00 * A.p[0] + h10 * d * A.k[0] + h01 * B.p[0] + h11 * d * B.k[0];
      const y = h00 * A.p[1] + h10 * d * A.k[1] + h01 * B.p[1] + h11 * d * B.k[1];
      const dx = g00 * A.p[0] + g10 * d * A.k[0] + g01 * B.p[0] + g11 * d * B.k[0];
      const dy = g00 * A.p[1] + g10 * d * A.k[1] + g01 * B.p[1] + g11 * d * B.k[1];
      pts.push({ x, y, v: Math.atan2(-dx, dy) * 180 / Math.PI, sk: A.s + (B.s - A.s) * (t2 * (3 - 2 * t)) });
    }
  }
  // gør vinklen sammenhængende, så skibet ikke snurrer rundt, og fordel tiden efter sejlet distance
  let len = 0;
  for (let i = 1; i < pts.length; i++) {
    while (pts[i].v - pts[i - 1].v > 180) pts[i].v -= 360;
    while (pts[i].v - pts[i - 1].v < -180) pts[i].v += 360;
    len += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); pts[i].l = len;
  }
  pts[0].l = 0;
  return pts.map(q => ({ offset: q.l / len, transform: `translate(${q.x - cx}px, ${q.y - cy}px) rotate(${q.v}deg) scale(${q.sk})` }));
}
function sejlTur(fra) {
  const L = $("#landing"), A = $("#app"), vw = innerWidth, vh = innerHeight;
  // mål headerens plads, før forsiden skjules
  A.hidden = false; A.style.visibility = "hidden";
  const maal = $("#hship .hship-inner"), r = maal.getBoundingClientRect(), a0 = A.getBoundingClientRect().top;
  const tcx = r.left + r.width / 2, tcy = r.top - a0 + r.height / 2, slutSkala = maal.offsetHeight / fra.h;
  A.hidden = true; A.style.visibility = "";
  L.classList.add("sejler"); $("#ship").style.visibility = "hidden";
  const f = document.createElement("div"); f.className = "flyship"; f.innerHTML = shipSVG(); document.body.appendChild(f);
  Object.assign(f.style, { left: (fra.cx - fra.w / 2) + "px", top: (fra.cy - fra.h / 2) + "px", width: fra.w + "px", height: fra.h + "px" });
  setTimeout(() => { L.hidden = true; L.classList.remove("sejler"); $("#ship").style.visibility = ""; A.hidden = false; $("#hship").style.visibility = "hidden"; }, 520);
  const lille = Math.min(.5, (vh * .55) / fra.h);   // så skibet kan vende på skærmen
  const N = (x, y) => { const m = Math.hypot(x, y); return [x / m, y / m]; };
  const rad = 34 * Math.PI / 180;
  const rute = [
    { p: [fra.cx, fra.cy], k: [Math.sin(rad), Math.cos(rad)], s: 1 },
    { p: [vw * .80, vh * .74], k: N(-.45, 1), s: lille },
    { p: [vw * .50, vh * .84], k: [-1, 0], s: lille },
    { p: [vw * .17, vh * .58], k: [0, -1], s: lille },
    { p: [vw * .26, vh * .30], k: N(.75, -.66), s: lille },
    { p: [tcx, tcy], k: [1, 0], s: slutSkala },
  ];
  const anim = f.animate(rute2kf(rute, 24, fra.cx, fra.cy), { duration: 4600, easing: "cubic-bezier(.45, .05, .25, 1)", fill: "forwards" });
  const slut = () => { $("#hship").style.visibility = ""; f.remove(); };
  anim.onfinish = slut; anim.oncancel = slut;
}
function forside() {
  $("#app").hidden = true; $("#landing").hidden = false;
  document.title = "Maskinenoter";
  if (!$("#ship").firstChild) $("#ship").innerHTML = shipSVG();
  $("#sembar").innerHTML = SEMESTRE.map(s =>
    `<a href="#m${s.n}" class="${s.n === NU ? "now" : ""}" aria-label="${s.n}. semester${s.n === NU ? ", nuværende" : ""}"><span><small>M</small>${s.n}</span></a>`).join("");
}
function semesterSide(s) {
  visApp(`M${s.n}`, `
    <h1>${s.n}. semester</h1>
    <div class="tiles">${s.fag.map(f => tile({ href: harIndhold(f) ? `#m${s.n}-${f.id}` : null, navn: f.navn, ikon: f.ikon, c: farve(f.ikon) })).join("")}</div>
    ${s.n >= 4 ? quizKnap(`#m${s.n}-quiz`, `Quiz for hele ${s.n}. semester`, !!s.quiz) : ""}`,
    [[`M${s.n}`]]);
}
function fagSide(s, f) {
  visApp(f.navn, `
    <h1>${esc(f.navn)}</h1>
    ${f.laeringsmaal ? `<p class="meta"><a href="${f.laeringsmaal}" target="_blank" rel="noopener">Læringsmål ↗</a></p>` : ""}
    <div class="tiles">${f.emner.map(e => tile({ href: delAntal(e) ? `#m${s.n}-${f.id}-${e.id}` : null, navn: e.navn, ikon: e.ikon, c: farve(f.ikon) })).join("")}</div>
    ${quizKnap(`#m${s.n}-${f.id}-quiz`, `Quiz for hele ${f.navn}`, !!f.quiz)}`,
    [[`M${s.n}`, `m${s.n}`], [f.navn]], "side");
}
function emneSide(s, f, e) {
  const fra = `m${s.n}-${f.id}-${e.id}`;
  const link = (url, navn) => url + (url.includes("?") ? "&" : "?") + `fra=${fra}&navn=${encodeURIComponent(e.navn)}&del=${encodeURIComponent(navn)}`;
  visApp(e.navn, `
    <h1>${esc(e.navn)}</h1>
    ${e.intro ? `<p class="intro">${esc(e.intro)}</p>` : ""}
    <div class="tiles">${DELE.filter(([k]) => e.dele[k]).map(([k, navn]) => tile({ href: link(e.dele[k], navn), navn, ikon: k, c: farve(k) })).join("")}</div>`,
    [[`M${s.n}`, `m${s.n}`], [f.navn, `m${s.n}-${f.id}`], [e.navn]], "side");
}
function quizSide(s, f) {
  const hvad = f ? f.navn : `${s.n}. semester`;
  const tilbage = f ? `#m${s.n}-${f.id}` : `#m${s.n}`;
  const url = f ? f.quiz : s.quiz;
  if (url) { location.href = url; return; }
  visApp(`Quiz · ${hvad}`, `
    <h1>Quiz for ${esc(hvad)}</h1>
    <p class="intro">Kommer senere.</p>
    <a class="back" href="${tilbage}">‹ Tilbage</a>`,
    f ? [[`M${s.n}`, `m${s.n}`], [f.navn, `m${s.n}-${f.id}`], ["Quiz"]] : [[`M${s.n}`, `m${s.n}`], ["Quiz"]], f ? "side" : "top");
}

function rute() {
  const h = decodeURIComponent(location.hash.slice(1));
  const [m, fagId, emneId] = h.split("-");
  const s = /^m\d$/.test(m || "") && SEMESTRE.find(x => x.n === +m.slice(1));
  if (!s) return forside();
  if (!fagId) return semesterSide(s);
  if (fagId === "quiz") return quizSide(s, null);
  const f = s.fag.find(x => x.id === fagId);
  if (!f) return semesterSide(s);
  if (!emneId) return harIndhold(f) ? fagSide(s, f) : semesterSide(s);
  if (emneId === "quiz") return quizSide(s, f);
  const e = f.emner.find(x => x.id === emneId);
  return e ? emneSide(s, f, e) : fagSide(s, f);
}
window.addEventListener("hashchange", () => { rute(); window.scrollTo(0, 0); });
rute();
</script>
