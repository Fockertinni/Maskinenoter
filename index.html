<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Noter, modeller, simulatorer og tests til maskinmesteruddannelsen, samlet efter semester og fag.">
<title>Maskinenoter.dk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;125,800&family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: tre niveauer. Forside (landing page med mørkt kontrolpanel-hero og semesterkort) -> semester (fagkort) -> fag (laboratorieøvelser og noter). Fag er farvekodet efter fagområde. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --surface2: #f5f7f9; --fg: #121b24; --muted: #586776; --line: #d5dce3;
  --hero: #0c1822; --hero2: #16304a; --hero-fg: #e8eef3; --hero-muted: #9db0c2; --hero-line: rgba(255,255,255,.07);
  --accent: #d96a12; --accent-soft: #fbe7d6; --on-accent: #ffffff;
  --el: #b88400; --el-soft: #fbf1d2;
  --energi: #cf4b2a; --energi-soft: #fbe2da;
  --auto: #0f8a8a; --auto-soft: #d6f0ef;
  --ledelse: #6b55c4; --ledelse-soft: #e7e2f8;
  --studie: #4f6578; --studie-soft: #e3e9ee;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --wide: "Archivo", "Arial Black", system-ui, sans-serif;
  --frame1: #c9ced6; --frame2: #eef0f3; --frame-line: rgba(255,255,255,.85); --pline: rgba(255,255,255,.14);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1218; --surface: #121c25; --surface2: #17232e; --fg: #e3e9ee; --muted: #93a3b1; --line: #24323e;
  --hero: #071017; --hero2: #12283c; --hero-fg: #e8eef3; --hero-muted: #8fa3b5; --hero-line: rgba(255,255,255,.05);
  --accent: #f28a33; --accent-soft: #3a2412; --on-accent: #1a0d03;
  --el: #f0bf2e; --el-soft: #33290c; --energi: #f0704d; --energi-soft: #3a1b13;
  --auto: #3cc2c0; --auto-soft: #0f2f30; --ledelse: #a493f0; --ledelse-soft: #251f42; --studie: #9db0c1; --studie-soft: #1d2a35;
  --frame1: #1a242e; --frame2: #2b3640; --frame-line: rgba(255,255,255,.12);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1218; --surface: #121c25; --surface2: #17232e; --fg: #e3e9ee; --muted: #93a3b1; --line: #24323e;
  --hero: #071017; --hero2: #12283c; --hero-fg: #e8eef3; --hero-muted: #8fa3b5; --hero-line: rgba(255,255,255,.05);
  --accent: #f28a33; --accent-soft: #3a2412; --on-accent: #1a0d03;
  --el: #f0bf2e; --el-soft: #33290c; --energi: #f0704d; --energi-soft: #3a1b13;
  --auto: #3cc2c0; --auto-soft: #0f2f30; --ledelse: #a493f0; --ledelse-soft: #251f42; --studie: #9db0c1; --studie-soft: #1d2a35;
  --frame1: #1a242e; --frame2: #2b3640; --frame-line: rgba(255,255,255,.12);
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--body); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap > * { min-width: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* ---------- Mørk top (hero på forsiden, smal bjælke på undersider) ---------- */
.top {
  margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px);
  color: var(--hero-fg);
  background:
    linear-gradient(var(--hero-line) 1px, transparent 1px) 0 0 / 32px 32px,
    linear-gradient(90deg, var(--hero-line) 1px, transparent 1px) 0 0 / 32px 32px,
    radial-gradient(120% 100% at 85% 0%, var(--hero2), var(--hero) 70%);
}
.top .wrap { padding-block: 1.1rem 1.25rem; display: grid; gap: 1.25rem; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: .6rem; font: 700 1.2rem var(--display); letter-spacing: .02em; text-decoration: none; }
.logo svg { width: 30px; height: 30px; flex: none; }
.logo .wordmark span { color: #f28a33; }
.nav { display: flex; gap: 1.1rem; font: 600 .95rem var(--display); letter-spacing: .04em; }
.nav a { text-decoration: none; color: var(--hero-muted); }
.nav a:hover { color: var(--hero-fg); }

.hero-body { display: grid; gap: 1.1rem; max-width: 760px; padding-block: 2.5rem 2.25rem; }
.eyebrow { font: 500 .78rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #f28a33; }
.hero-body h1 { font: 800 clamp(2.5rem, 7.5vw, 4.8rem)/.95 var(--display); margin: 0; text-wrap: balance; }
.hero-body h1 em { font-style: normal; color: #f28a33; }
.hero-body p { margin: 0; color: var(--hero-muted); font-size: 1.12rem; max-width: 56ch; }
.cta { display: flex; gap: .75rem; flex-wrap: wrap; }
.btn { font: 700 1rem var(--display); letter-spacing: .04em; text-decoration: none; padding: .75rem 1.25rem; border-radius: 10px; border: 2px solid transparent; cursor: pointer; }
.btn.primary { background: #f28a33; color: #1a0d03; }
.btn.primary:hover { background: #ff9c4a; }
.btn.ghost { border-color: rgba(255,255,255,.2); color: var(--hero-fg); background: transparent; }
.btn.ghost:hover { border-color: rgba(255,255,255,.5); }
.search { position: relative; max-width: 620px; display: block; }
.search svg { position: absolute; left: 14px; top: 50%; translate: 0 -50%; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; font: inherit; font-size: 1.05rem; padding: .9rem 1rem .9rem 2.8rem; border-radius: 10px; border: 2px solid transparent; background: var(--surface); color: var(--fg); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.search input:focus { outline: none; border-color: var(--accent); }
.stats { display: flex; gap: 2rem; flex-wrap: wrap; padding-top: .5rem; }
.stats div { display: grid; }
.stats b { font: 700 1.9rem/1 var(--display); color: var(--hero-fg); font-variant-numeric: tabular-nums; }
.stats span { font: 500 .74rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--hero-muted); }

/* Brødkrummer og sidehoved på undersider */
.crumbs { display: flex; gap: .45rem; flex-wrap: wrap; align-items: center; font: 500 .82rem var(--mono); color: var(--hero-muted); }
.crumbs a { text-decoration: none; color: var(--hero-muted); }
.crumbs a:hover { color: var(--hero-fg); text-decoration: underline; }
.crumbs .sep { opacity: .5; }
.crumbs .here { color: var(--hero-fg); }
.page-head { display: grid; gap: .5rem; padding-block: 1.25rem 1.25rem; }
.page-head .kicker { font: 500 .78rem var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--c, #f28a33); }
.page-head h1 { font: 800 clamp(2rem, 6vw, 3.4rem)/1 var(--display); margin: 0; text-wrap: balance; }
.page-head p { margin: 0; color: var(--hero-muted); max-width: 60ch; }
.chips { display: flex; gap: .5rem; flex-wrap: wrap; padding-top: .25rem; }
.chip { font: 500 .78rem var(--mono); padding: .25rem .65rem; border-radius: 999px; border: 1px solid rgba(255,255,255,.15); color: var(--hero-fg); text-decoration: none; }
a.chip:hover { border-color: #f28a33; color: #f28a33; }

/* ---------- Indhold ---------- */
main .wrap { padding-block: 2.5rem 3.5rem; display: grid; gap: 3rem; }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.1rem; }
.sec-head h2 { font: 700 clamp(1.6rem, 3.5vw, 2.1rem)/1.05 var(--display); margin: 0; text-wrap: balance; }
.sec-head p { margin: .3rem 0 0; color: var(--muted); max-width: 62ch; }
.pill { font: 500 .75rem var(--mono); padding: .25rem .6rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }

/* Semesterkort */
.semGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
.sem { position: relative; display: grid; grid-template-rows: auto 1fr auto; gap: .9rem; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.25rem; text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; overflow: hidden; }
.sem:hover { border-color: var(--accent); transform: translateY(-2px); }
.sem .head { display: flex; justify-content: space-between; align-items: start; gap: .75rem; }
.sem .m { font: 800 3.2rem/.85 var(--display); letter-spacing: -.01em; }
.sem .status { font: 500 .7rem var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: .25rem .55rem; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.sem.done .status { background: var(--surface2); }
.sem.now { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.sem.now .status { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.sem.now .m { color: var(--accent); }
.sem ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .3rem; align-content: start; }
.sem li { display: flex; gap: .55rem; align-items: center; font-size: .95rem; }
.sem li i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.sem .foot { display: flex; justify-content: space-between; align-items: center; gap: .5rem; font: 500 .8rem var(--mono); color: var(--muted); border-top: 1px dashed var(--line); padding-top: .7rem; }
.sem .foot .go { font: 700 .95rem var(--display); letter-spacing: .04em; color: var(--accent); }
.sem .foot .has { color: var(--fg); font-weight: 600; }
.early { margin: 1rem 0 0; color: var(--muted); font-size: .92rem; }

/* Fagkort */
.fagGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
.fag { position: relative; display: grid; grid-template-rows: auto auto 1fr auto; gap: .55rem; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.2rem 1.15rem 1rem; text-decoration: none; color: inherit; overflow: hidden; transition: border-color .15s, transform .15s; }
.fag::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--c); }
.fag:hover { border-color: var(--c); transform: translateY(-2px); }
.ico { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; background: var(--cs); color: var(--c); }
.ico svg { width: 22px; height: 22px; }
.fag b { font: 700 1.3rem/1.15 var(--display); }
.area { font: 500 .72rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
.fag .row { display: flex; justify-content: space-between; align-items: center; gap: .5rem; font: 500 .8rem var(--mono); color: var(--muted); border-top: 1px dashed var(--line); padding-top: .6rem; }
.fag .has { color: var(--fg); font-weight: 600; }
.valgfag { margin-top: 1rem; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; color: var(--muted); font-size: .95rem; }
.valgfag span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: .25rem .75rem; color: var(--fg); }
.a-el { --c: var(--el); --cs: var(--el-soft); }
.a-energi { --c: var(--energi); --cs: var(--energi-soft); }
.a-auto { --c: var(--auto); --cs: var(--auto-soft); }
.a-ledelse { --c: var(--ledelse); --cs: var(--ledelse-soft); }
.a-studie { --c: var(--studie); --cs: var(--studie-soft); }

/* Materialekort */
.mats { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1rem; }
.mat { display: grid; grid-template-rows: auto auto 1fr auto auto; gap: .6rem; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.15rem; text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; min-width: 0; }
.mat:hover { border-color: var(--c); transform: translateY(-2px); }
.mat .row1 { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.mat .num { font: 600 1.6rem/1 var(--mono); color: var(--c); }
.kind { font: 500 .7rem var(--mono); letter-spacing: .08em; text-transform: uppercase; background: var(--cs); color: var(--c); padding: .2rem .5rem; border-radius: 4px; display: inline-flex; gap: .35rem; align-items: center; }
.kind::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.mat h3 { margin: 0; font: 700 1.2rem/1.15 var(--display); text-wrap: balance; }
.mat p { margin: 0; color: var(--muted); font-size: .95rem; }
.tags { display: flex; flex-wrap: wrap; gap: .3rem; align-self: end; }
.tags span { font: 400 .74rem var(--mono); border: 1px solid var(--line); background: var(--surface2); border-radius: 4px; padding: .05rem .4rem; color: var(--muted); }
.mat .go { font: 700 .95rem var(--display); letter-spacing: .04em; color: var(--accent); }
.mat .where { font: 500 .74rem var(--mono); color: var(--muted); }
.mat.overview { border-style: dashed; }
.mat { position: relative; cursor: pointer; }
.mat h3 a { text-decoration: none; color: inherit; }
.mat h3 a::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.mat h3 a:focus-visible { outline: none; }
.mat:has(h3 a:focus-visible) { outline: 2px solid var(--accent); outline-offset: 3px; }
.parts { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: .35rem; border-top: 1px dashed var(--line); padding-top: .65rem; }
.parts a { font: 600 .8rem var(--body); text-decoration: none; padding: .2rem .6rem; border-radius: 999px; background: var(--cs); color: var(--fg); border: 1px solid transparent; }
.parts a:hover { border-color: var(--c); }
.intro-lab { margin: 0 0 1rem; display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; color: var(--muted); font-size: .95rem; }
.intro-lab b { font-weight: 600; color: var(--fg); }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 1.75rem 1.25rem; color: var(--muted); display: grid; gap: .25rem; }
.empty b { color: var(--fg); font: 700 1.1rem var(--display); }

.about { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
.about div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.25rem; }
.about h3 { font: 700 1.25rem var(--display); margin: 0 0 .35rem; }
.about p { margin: 0; color: var(--muted); }
.back { font: 700 1rem var(--display); letter-spacing: .04em; color: var(--accent); text-decoration: none; }
.back:hover { text-decoration: underline; }
footer { background: var(--hero); color: var(--hero-muted); }
footer .wrap { padding-block: 1.5rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-size: .88rem; }

/* ---------- Landing page: ramme med perspektivlinjer, mørkt panel, skib på skrå ---------- */
header.landing { background: var(--bg); }
.stage { position: relative; overflow: hidden;
  margin-top: calc(-1 * env(safe-area-inset-top, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + clamp(16px, 4vw, 56px)); padding-bottom: clamp(16px, 4vw, 56px);
  padding-left: max(16px, 4vw, env(safe-area-inset-left, 0px)); padding-right: max(16px, 4vw, env(safe-area-inset-right, 0px));
  background: linear-gradient(120deg, var(--frame1), var(--frame2)); }
.persp { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.persp line { stroke: var(--frame-line); stroke-width: 1; }
.panel { position: relative; isolation: isolate; max-width: 1240px; margin: 0 auto; min-height: clamp(560px, 58vw, 740px);
  display: grid; grid-template-rows: auto 1fr auto; background: #121a26; color: #eef2f6; box-shadow: 0 30px 80px rgba(10,20,30,.35); }
.pnav { position: relative; z-index: 3; display: flex; border-bottom: 1px solid var(--pline); }
.pnav .cell { display: flex; align-items: center; gap: .55rem; padding: 0 1.25rem; min-height: 58px; border-left: 1px solid var(--pline); font: 500 .88rem var(--body); color: #eef2f6; text-decoration: none; white-space: nowrap; }
.pnav .cell:hover { background: rgba(255,255,255,.05); }
.pnav .cell svg { width: 18px; height: 18px; flex: none; }
.pnav .logo.cell { border-left: 0; border-right: 1px solid var(--pline); font: 700 1.05rem var(--wide); font-stretch: 112%; letter-spacing: .02em; text-transform: uppercase; }
.pnav .logo.cell svg { width: 28px; height: 28px; }
.pnav .spacer { flex: 1; }
.burger { display: grid; gap: 5px; }
.burger i { display: block; width: 22px; height: 2px; background: currentColor; }
.ship { position: absolute; z-index: 1; left: 31%; top: -20%; height: 152%; aspect-ratio: 1 / 5; transform: rotate(-36deg); pointer-events: none; filter: drop-shadow(0 24px 40px rgba(0,0,0,.55)); }
.ship svg { display: block; width: 100%; height: 100%; }
.beacon { position: absolute; left: 50%; top: 61%; width: 16px; height: 16px; border-radius: 50%; background: #f28a33; translate: -50% -50%; box-shadow: 0 0 0 0 rgba(242,138,51,.55); }
@media (prefers-reduced-motion: no-preference) { .beacon { animation: beacon 2.2s ease-out infinite; } }
@keyframes beacon { 70% { box-shadow: 0 0 0 18px rgba(242,138,51,0); } 100% { box-shadow: 0 0 0 0 rgba(242,138,51,0); } }
.stars { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: .75; }
.big { position: relative; z-index: 2; margin: 0; padding: clamp(2rem, 5vw, 4rem) clamp(1rem, 4.5vw, 3.75rem) 0; display: grid; align-content: center;
  font: 800 clamp(2.1rem, 7.6vw, 6.3rem)/.93 var(--wide); font-stretch: 125%; text-transform: uppercase; letter-spacing: -.005em; text-shadow: 0 2px 24px rgba(0,0,0,.35); }
.big span { display: block; }
.big .l1 { justify-self: end; }
.big .l3 { padding-left: 14%; }
.pfoot { position: relative; z-index: 2; display: flex; flex-wrap: wrap; gap: 1.25rem 2rem; align-items: end; justify-content: space-between; padding: 2rem clamp(1rem, 4.5vw, 3.75rem) clamp(1.25rem, 3.5vw, 2.75rem); }
.pfoot .left { display: grid; gap: 1rem; max-width: 44ch; }
.pfoot p { margin: 0; color: #a9b6c3; }
.pfoot .search { flex: 1 1 300px; max-width: 460px; }
.pfoot .search input { box-shadow: none; border-radius: 0; }
.pfoot .btn { border-radius: 0; }
@media (max-width: 760px) {
  .pnav .cell.txt { display: none; }
  .ship { left: 40%; top: -8%; height: 125%; }
  .big .l3 { padding-left: 6%; }
  .big { font-size: 9.4vw; }
  .pfoot p { text-shadow: 0 1px 8px #121a26, 0 0 2px #121a26; }
}
.sec-head h2, .sem .m, .page-head h1 { font-family: var(--wide); font-stretch: 112%; font-weight: 700; text-transform: uppercase; letter-spacing: 0; }
.sem .m { font-size: 2.6rem; font-stretch: 125%; font-weight: 800; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>


<header class="top" id="hdr">
  <div class="wrap" id="topWrap">
    <div class="topbar">
      <a class="logo" href="#start" aria-label="Maskinenoter.dk forside">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="13" stroke="#f28a33" stroke-width="3"/><path d="M16 7v4M16 21v4M7 16h4M21 16h4" stroke="#f28a33" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="3.5" fill="#f28a33"/></svg>
        <span class="wordmark">Maskine<span>noter</span>.dk</span>
      </a>
      <nav class="nav" aria-label="Menu"><a href="#start">Forside</a><a href="#semestre">Semestre</a><a href="#om">Om</a></nav>
    </div>
    <div id="topContent"></div>
  </div>
</header>

<main><div class="wrap" id="main"></div></main>
<footer><div class="wrap"><span>© 2026 Maskinenoter.dk</span><span>Lavet af en maskinmesterstuderende</span></div></footer>

<script>
const NU = 5;
const ICON = {
  el: '<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/>',
  energi: '<path d="M12 3c3 4 6 6.5 6 10.5A6 6 0 0 1 6 13.5c0-2.4 1.3-4 3-5.5.3 2 1.2 3 2.3 3.5C11 8.5 11.5 5.5 12 3Z"/>',
  auto: '<path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/>',
  ledelse: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  studie: '<path d="M3 8l9-4 9 4-9 4-9-4Z"/><path d="M7 10v5c0 1.5 2.2 3 5 3s5-1.5 5-3v-5"/>',
};
const AREA = { el: "El", energi: "Energi og maskiner", auto: "Automation", ledelse: "Ledelse og økonomi", studie: "Studie og projekt" };
const SEMS = [
  { n: 4, fag: [["el1","Elektroteknik 1",15,"el"],["term","Grundlæggende termodynamik",10,"energi"],["stud","Studiekompetence & metode",5,"studie"]] },
  { n: 5, fag: [["el2","Elektroteknik 2",10,"el","https://www.teknikaqms.dk/showpage.php?pageid=485818"],["pa1","Procesanalyse & automation 1",5,"auto","https://www.teknikaqms.dk/showpage.php?pageid=485841"],["forb","Forbrændingsmotoranlæg",10,"energi","https://www.teknikaqms.dk/showpage.php?pageid=485875"],["drift","Driftsøkonomi",5,"ledelse","https://www.teknikaqms.dk/showpage.php?pageid=485877"]] },
  { n: 6, fag: [["elaut1","El-autorisation 1",10,"el"],["pa2","Procesanalyse & automation 2",5,"auto"],["energi","Energiforsyningsanlæg",10,"energi"],["org","Organisation",5,"ledelse"]] },
  { n: 7, fag: [["elaut2","El-autorisation 2",10,"el"],["pa3","Procesanalyse & automation 3",5,"auto"],["koel","Køle- & indeklimaanlæg",10,"energi"],["ledsys","Ledelsessystemer",5,"ledelse"]] },
  { n: 8, fag: [["valg","Valgfag",20,"studie"],["projled","Projektledelse",5,"ledelse"],["persled","Personaleledelse",5,"ledelse"]] },
  { n: 9, fag: [["prof","Professionspraktik",15,"studie"],["bach","Bachelorprojekt",15,"studie"]] },
];
/* type: "note" eller "sim" */
const MAT = [
  { type: "ov", nr: "EL2", t: "Alle EL2-laboratorieøvelser", fag: "el2", url: "modeller/el2/index.html", d: "Startside med alle otte øvelser fra stærkstrømslaboratoriet.", tags: ["Oversigt"], ov: true },
  { type: "lab", nr: "01", t: "Symmetrisk og usymmetrisk 3-faset belastning", fag: "el2", url: "modeller/el2/lab1.html", d: "Sæt ledninger på bænken, mål med wattmetre og tang, og se stjernepunktet flytte sig når nullen fjernes.", tags: ["Y / Δ","Millman","Aron","KCL"] },
  { type: "lab", nr: "02", t: "AC-generatorundersøgelse", fag: "el2", url: "modeller/el2/lab2.html", d: "Remanens, magnetiserings- og belastningskarakteristik samt spændingens forvrængning.", tags: ["Synkrongenerator","Magnetisering","THDu"] },
  { type: "lab", nr: "03", t: "Trefaset asynkronmotor", fag: "el2", url: "modeller/el2/lab3.html", d: "Viklingsmodstand, effektforhold, tabsmetoder og fasekompensering med kondensatorer.", tags: ["Slip","Tab","cos φ","Kompensering"] },
  { type: "lab", nr: "04", t: "Jordelektrodens overgangsmodstand", fag: "el2", url: "modeller/el2/lab4.html", d: "Måling med Metrel Eurotest, 55/60/65 %-kravet og potentialebjerge omkring spydene.", tags: ["Jordspyd","3-pol måling","Potentiale"] },
  { type: "lab", nr: "05", t: "Transformer: tomgangs- og kortslutningsforsøg", fag: "el2", url: "modeller/el2/lab5.html", d: "Tomgang og kortslutning med Aron-kobling, og spændingsfald beregnet efter tre metoder.", tags: ["P₀ / Pk","uk %","Spændingsfald"] },
  { type: "lab", nr: "06", t: "Koblingsciffer og kortslutningsstrømme", fag: "el2", url: "modeller/el2/lab6.html", d: "Kortslutningsstrømme bag Dyn, koblingsciffer med cirkelslag og paralleldrift af to transformere.", tags: ["Dyn5/Dyn11","Ik","Paralleldrift"] },
  { type: "lab", nr: "07", t: "Synkronisering og paralleldrift", fag: "el2", url: "modeller/el2/lab7.html", d: "Levende synkronoskop, fordeling af P og Q mellem generatorer og frekvensstatik ved afkobling.", tags: ["Synkronoskop","Statik","P/Q-deling"] },
  { type: "lab", nr: "08", t: "Frekvensomformer med reluktansmotor", fag: "el2", url: "modeller/el2/lab8.html", d: "ABB-frekvensomformer, strømmens harmoniske og virkningsgrader ved forskellig last og hastighed.", tags: ["THDi","Harmoniske","Virkningsgrad"] },
];
const ALLE = SEMS.flatMap(s => s.fag.map(([id, navn, ects, area, lm]) => ({ id, navn, ects, area, lm, sem: s.n })));
const fagInfo = id => ALLE.find(f => f.id === id);
const antal = id => MAT.filter(m => m.fag === id).length;
const status = n => n < NU ? ["done", "Bestået"] : n === NU ? ["now", "I gang nu"] : ["", "Kommende"];
const svg = a => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[a]}</svg>`;
const $ = s => document.querySelector(s);
const crumbs = items => `<nav class="crumbs" aria-label="Brødkrummer">${items.map((c, i) => i < items.length - 1 ? `<a href="#${c[1]}">${c[0]}</a><span class="sep">/</span>` : `<span class="here">${c[0]}</span>`).join("")}</nav>`;

const DELE = [["sim","Simulator"],["noter","Noter"],["modeller","Modeller"],["forstaa","Forståelse"],["test","Test dig selv"]];
function matKort(m, visFag) {
  const f = fagInfo(m.fag);
  const kind = m.type === "lab" ? "Labøvelse" : m.type === "ov" ? "Oversigt" : "Note";
  const go = m.type === "lab" ? "Åbn øvelsen →" : m.type === "ov" ? "Åbn oversigten →" : "Læs noten →";
  return `<div class="mat a-${f.area}${m.type === "ov" ? " overview" : ""}">
    <span class="row1"><span class="num">${m.nr}</span><span class="kind">${kind}</span></span>
    <h3><a href="${m.url}" target="_blank" rel="noopener">${m.t}</a></h3><p>${m.d}</p>
    <span class="tags">${m.tags.map(t => `<span>${t}</span>`).join("")}</span>
    ${m.type === "lab" ? `<span class="parts" aria-label="Indhold">${DELE.map(([h, navn]) => `<a href="${m.url}#${h}" target="_blank" rel="noopener">${navn}</a>`).join("")}</span>` : ""}
    ${visFag ? `<span class="where">M${f.sem} · ${f.navn}</span>` : ""}
    <span class="go">${go}</span></div>`;
}

/* ---------- Forside ---------- */
const H = $("#hdr"), STD = H.innerHTML;
function stdHeader() { if (H.className !== "top") { H.className = "top"; H.innerHTML = STD; } }
function rnd(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function shipSVG() {
  const r = rnd(7); let h = "";
  for (let y = 175; y < 830; y += 47) for (const x of [42, 106]) {
    h += `<rect x="${x}" y="${y}" width="52" height="39" fill="#333d48" stroke="#5f6b78" stroke-width="1.5"/>`;
    for (let k = 1; k < 4; k++) h += `<line x1="${x + 4}" x2="${x + 48}" y1="${y + k * 9.75}" y2="${y + k * 9.75}" stroke="#4a5562" stroke-width="1"/>`;
    if (r() > .55) h += `<rect x="${x + 4 + r() * 38}" y="${y + 3 + r() * 28}" width="5" height="5" fill="#e0741b"/>`;
  }
  let det = ""; for (let i = 0; i < 26; i++) det += `<rect x="${36 + r() * 126}" y="${150 + r() * 700}" width="${2 + r() * 4}" height="${2 + r() * 3}" fill="${r() > .5 ? "#e0741b" : "#cfd6dc"}"/>`;
  return `<svg viewBox="0 0 200 1000" aria-hidden="true">
    <path d="M28 52 Q28 8 70 6 L130 6 Q172 8 172 52 L172 800 Q172 915 100 996 Q28 915 28 800 Z" fill="#4a5561" stroke="#7d8996" stroke-width="2"/>
    <path d="M36 140 L164 140 L164 800 Q164 905 100 978 Q36 905 36 800 Z" fill="#262f39"/>
    <rect x="44" y="18" width="112" height="104" fill="#aeb8c2" stroke="#e1e6ea" stroke-width="2"/>
    <rect x="56" y="30" width="88" height="62" fill="#8995a1"/>
    ${[0,1,2,3,4,5].map(i => `<rect x="${60 + i * 14}" y="98" width="9" height="14" fill="#38424d"/>`).join("")}
    <rect x="86" y="40" width="28" height="30" fill="#5b6672"/><circle cx="100" cy="55" r="7" fill="#e0741b"/>
    ${h}
    <rect x="97" y="140" width="6" height="760" fill="#8f9aa6"/>
    <rect x="66" y="140" width="3" height="720" fill="#6d7884"/><rect x="131" y="140" width="3" height="720" fill="#6d7884"/>
    <path d="M70 870 L130 870 L100 940 Z" fill="#333d48" stroke="#5f6b78" stroke-width="1.5"/>
    ${det}
  </svg><span class="beacon"></span>`;
}
function tegnPersp() {
  const st = $("#stage"), pn = $("#panel"), sv = $("#persp"); if (!st || !pn) return;
  const S = st.getBoundingClientRect(), P = pn.getBoundingClientRect();
  const w = S.width, h = S.height, x1 = P.left - S.left, y1 = P.top - S.top, x2 = x1 + P.width, y2 = y1 + P.height, cx = w / 2;
  sv.setAttribute("viewBox", `0 0 ${w} ${h}`);
  sv.innerHTML = [[0,0,x1,y1],[w,0,x2,y1],[0,h,x1,y2],[w,h,x2,y2],[cx,0,cx,y1],[cx,y2,cx,h]].map(([a,b,c,d]) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`).join("");
}
let ro;
function forside(scrollTil) {
  H.className = "landing";
  const r = rnd(3);
  H.innerHTML = `
  <div class="stage" id="stage"><svg class="persp" id="persp" aria-hidden="true"></svg>
    <div class="panel" id="panel">
      <nav class="pnav" aria-label="Menu">
        <a class="cell logo" href="#start"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="13" stroke="#f28a33" stroke-width="3"/><path d="M16 7v4M16 21v4M7 16h4M21 16h4" stroke="#f28a33" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="3.5" fill="#f28a33"/></svg>Maskinenoter</a>
        <span class="spacer"></span>
        <a class="cell txt" href="#semestre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M8 4v16"/></svg>Vælg semester</a>
        <a class="cell txt" href="#m${NU}-el2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>EL2-labøvelser</a>
        <a class="cell" href="#om" aria-label="Om siden"><span class="burger"><i></i><i></i></span></a>
      </nav>
      <div class="ship">${shipSVG()}</div>
      <div class="stars">${Array.from({ length: 16 }, () => `<i style="left:${(r() * 96 + 2).toFixed(1)}%;top:${(r() * 86 + 10).toFixed(1)}%"></i>`).join("")}</div>
      <h1 class="big"><span class="l1">Forstå</span><span class="l2">maskinen.</span><span class="l3">Bestå</span><span class="l4">eksamen.</span></h1>
      <div class="pfoot">
        <div class="left"><p>Noter, modeller, simulatorer og tests til maskinmesteruddannelsen. Gratis, og samlet efter semester og fag.</p>
          <div class="cta"><a class="btn primary" href="#m${NU}">Gå til M${NU} →</a><a class="btn ghost" href="#semestre">Alle semestre</a></div></div>
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="Søg fx “asynkronmotor” eller “transformer”" aria-label="Søg i noter og øvelser">
        </label>
      </div>
    </div>
  </div>`;
  ro?.disconnect(); ro = new ResizeObserver(tegnPersp); ro.observe($("#stage")); tegnPersp();
  $("#main").innerHTML = `
    <section id="soeg" hidden><div class="sec-head"><div><h2 id="soegTitel"></h2><p>Resultater fra alle semestre.</p></div></div><div class="mats" id="soegListe"></div></section>
    <section id="semestre">
      <div class="sec-head"><div><h2>Vælg semester</h2><p>Hvert semester har sine egne fag. Vælg et semester, og derefter det fag du vil se materiale fra.</p></div></div>
      <div class="semGrid">${SEMS.map(s => {
        const [cls, txt] = status(s.n); const n = s.fag.reduce((a, f) => a + antal(f[0]), 0);
        return `<a class="sem ${cls}" href="#m${s.n}" id="sem-m${s.n}">
          <span class="head"><span class="m">M${s.n}</span><span class="status">${txt}</span></span>
          <ul>${s.fag.map(f => `<li class="a-${f[3]}"><i></i>${f[1]}</li>`).join("")}</ul>
          <span class="foot"><span class="${n ? "has" : ""}">${n ? n + " materialer" : "Intet endnu"}</span><span class="go">Åbn →</span></span></a>`;
      }).join("")}</div>
      <p class="early">M1 til M3 er værkstedsskole og virksomhedspraktik, så der er ingen noter derfra.</p>
    </section>
    ${omSektion()}`;
  $("#q").addEventListener("input", () => { soeg(); if ($("#q").value.trim()) $("#soeg").scrollIntoView({ block: "nearest" }); });
  if (scrollTil) document.getElementById(scrollTil)?.scrollIntoView();
}
function soeg() {
  const raw = $("#q").value.trim(), q = raw.toLowerCase();
  $("#soeg").hidden = !q; if (!q) return;
  const liste = MAT.filter(m => (m.t + " " + m.d + " " + m.tags.join(" ") + " " + fagInfo(m.fag).navn).toLowerCase().includes(q));
  $("#soegTitel").textContent = `${liste.length} resultat${liste.length === 1 ? "" : "er"} for “${raw}”`;
  $("#soegListe").innerHTML = liste.length ? liste.map(m => matKort(m, true)).join("") : `<div class="empty"><b>Intet matcher</b>Prøv et andet ord, fx et fagnavn.</div>`;
}
function omSektion() {
  return `<section class="about" id="om">
    <div><h3>Hvem står bag?</h3><p>Jeg læser til maskinmester og deler de noter, modeller og tests, jeg selv bruger til at forstå stoffet. Materialet er et supplement til undervisningen, ikke en erstatning for pensum.</p></div>
    <div><h3>Fundet en fejl?</h3><p>Skriv til mig, så retter jeg den. Kontaktoplysninger kommer her.</p></div>
    <div><h3>Bruger du siden?</h3><p>Del den gerne med dit hold. Der kommer løbende nyt materiale, efterhånden som semestrene skrider frem.</p></div></section>`;
}

/* ---------- Semesterside ---------- */
function semesterSide(n) {
  stdHeader();
  const s = SEMS.find(x => x.n === n); const [, txt] = status(n);
  const ects = s.fag.reduce((a, f) => a + f[2], 0);
  $("#topContent").innerHTML = `${crumbs([["Forside", "start"], [`M${n}`]])}
    <div class="page-head"><div class="kicker">${txt}</div><h1>${n}. semester</h1>
    <p>${n === NU ? "Det semester jeg er i gang med lige nu. Vælg et fag for at se noter og øvelser." : n < NU ? "Bestået semester. Vælg et fag for at se noter og øvelser." : "Kommende semester. Her kommer materiale, når jeg når dertil."}</p>
    <div class="chips"><span class="chip">${s.fag.length} fag</span><span class="chip">${ects} ECTS</span></div></div>`;
  $("#main").innerHTML = `<section>
      <div class="sec-head"><div><h2>Vælg fag</h2></div></div>
      <div class="fagGrid">${s.fag.map(([id, navn, e, area]) => {
        const k = antal(id);
        return `<a class="fag a-${area}" href="#m${n}-${id}" id="fag-${id}">
          <span class="ico">${svg(area)}</span><span class="area">${AREA[area]}</span><b>${navn}</b>
          <span class="row"><span>${e} ECTS</span><span class="${k ? "has" : ""}">${k ? k + " materialer →" : "Kommer senere"}</span></span></a>`;
      }).join("")}</div>
      ${n === 8 ? `<div class="valgfag">Valgfag (vælg ét): <span>Industry Technology</span><span>Technical Facility Management</span><span>Den Grønne Energis Cyklus</span><span>Marine Engineering And Management</span></div>` : ""}
    </section>
    <a class="back" href="#semestre">← Alle semestre</a>`;
}

/* ---------- Fagside ---------- */
function fagSide(n, id) {
  stdHeader();
  const f = fagInfo(id);
  if (!f || f.sem !== n) return semesterSide(n);
  const noter = MAT.filter(m => m.fag === id && m.type === "note");
  const labs = MAT.filter(m => m.fag === id && (m.type === "lab" || m.type === "ov"));
  const nLab = labs.filter(m => m.type === "lab").length;
  $("#topContent").innerHTML = `${crumbs([["Forside", "start"], [`M${n}`, `m${n}`], [f.navn]])}
    <div class="page-head a-${f.area}"><div class="kicker">${AREA[f.area]} · M${n}</div><h1>${f.navn}</h1>
    <div class="chips"><span class="chip">${f.ects} ECTS</span>${nLab ? `<span class="chip">${nLab} labøvelser</span>` : ""}${noter.length ? `<span class="chip">${noter.length} noter</span>` : ""}${f.lm ? `<a class="chip" href="${f.lm}" target="_blank" rel="noopener">Læringsmål ↗</a>` : ""}</div></div>`;
  $("#main").innerHTML = `
    ${labs.length ? `<section><div class="sec-head"><div><h2>Laboratorieøvelser</h2><p>Hver øvelse er en samlet pakke, du åbner i browseren. Hop direkte til den del, du har brug for.</p></div></div>
      <p class="intro-lab">Hver øvelse indeholder: <b>Simulator</b> · <b>Noter</b> · <b>Modeller</b> · <b>Forståelse</b> · <b>Test dig selv</b></p>
      <div class="mats">${labs.map(m => matKort(m)).join("")}</div></section>` : ""}
    ${noter.length ? `<section><div class="sec-head"><div><h2>Noter</h2></div></div><div class="mats">${noter.map(m => matKort(m)).join("")}</div></section>` : ""}
    ${!labs.length && !noter.length ? `<div class="empty"><b>Intet materiale endnu</b>Der kommer noter, modeller og tests her, når de er klar.</div>` : ""}
    <a class="back" href="#m${n}">← Tilbage til M${n}</a>`;
}

/* ---------- Router ---------- */
function vis() {
  const h = location.hash.slice(1);
  let m;
  if ((m = h.match(/^m(\d)-([a-z0-9]+)$/)) && SEMS.some(s => s.n === +m[1])) fagSide(+m[1], m[2]);
  else if ((m = h.match(/^m(\d)$/)) && SEMS.some(s => s.n === +m[1])) semesterSide(+m[1]);
  else forside(h === "semestre" || h === "om" ? h : null);
  if (!["semestre", "om"].includes(h)) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", vis);
vis();
</script>

</body>
